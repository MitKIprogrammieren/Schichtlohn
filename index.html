<style>
/* Layout: Kopfzeile mit Reitern, darunter zweispaltig – links Eingaben (Auftrag, Teile), rechts klebend das Ergebnis. Mobil einspaltig. Glas-Paneele auf Schwarz wie das HA-Theme. */
:root{
  --bg:#050706;
  --glass:rgba(255,255,255,.045);
  --glass-2:rgba(255,255,255,.075);
  --line:rgba(190,255,215,.10);
  --line-2:rgba(190,255,215,.18);
  --fg:#eef4f0;
  --fg-2:#a9b7ae;
  --fg-3:#6f7d74;
  --accent:#3fd47f;
  --accent-ink:#04140a;
  --accent-soft:rgba(63,212,127,.14);
  --warn:#f2b84b;
  --bad:#ff6b5e;
  --c-mat:#3fd47f;--c-en:#f2b84b;--c-mach:#6aa9ff;--c-lab:#c58bff;--c-fee:#ff8a6b;--c-pkg:#8fa39a;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;--r-s:9px;
  --good:var(--accent);--solid:#0b100d;--header-bg:rgba(5,7,6,.78);--strip:rgba(255,255,255,.06);--sunken:rgba(0,0,0,.35);--track:rgba(255,255,255,.16);
  --body-bg:radial-gradient(1200px 600px at 85% -10%,rgba(63,212,127,.09),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(63,212,127,.05),transparent 60%),var(--bg);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font:15px/1.5 var(--f-body);margin:0;min-height:100vh;
  background:var(--body-bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--header-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em}
.brand svg{width:28px;height:28px;color:var(--accent)}
.brand small{display:block;font:500 11px/1 var(--f-body);color:var(--fg-3);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
nav.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none;max-width:100%}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:1px solid transparent;border-radius:999px;padding:7px 14px;color:var(--fg-2);cursor:pointer;white-space:nowrap;font-weight:500}
nav.tabs button:hover{color:var(--fg);background:var(--glass)}
nav.tabs button[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-3);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--fg-3)}
.sync.ok i{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.sync.busy i{background:var(--warn)}
main{padding-top:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:26px}h2{font-size:18px}h3{font-size:15px}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.muted{color:var(--fg-2)}.dim{color:var(--fg-3)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pad{padding:16px}
.grid-calc{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cols4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12px;color:var(--fg-2)}
input[type=text],input[type=search],input[type=url],input[type=email],select,textarea{width:100%;background:var(--sunken);border:1px solid var(--line-2);border-radius:var(--r-s);padding:9px 11px;outline:none;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--fg-2) 50%),linear-gradient(135deg,var(--fg-2) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
select option{background:var(--solid);color:var(--fg)}
.unit{position:relative}
.unit input{padding-right:42px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.unit em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;color:var(--fg-3);pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--glass-2);border-radius:var(--r-s);padding:9px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--fg)}
.btn:focus-visible,nav.tabs button:focus-visible,.chip:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{color:var(--fg);background:var(--glass)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.icon{padding:7px;width:34px;height:34px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn svg{width:16px;height:16px;flex:none}
.seg{display:flex;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-s);padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;background:none;border:0;border-radius:7px;padding:7px 10px;color:var(--fg-2);cursor:pointer;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--glass-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--sunken);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--fg-2)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.setup{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.part{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:14px;border-top:1px solid var(--line)}
.part:first-child{border-top:0}
.thumb{width:64px;height:64px;border-radius:10px;background:var(--sunken) center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--fg-3)}
.thumb svg{width:26px;height:26px}
.part-head{display:flex;gap:8px;align-items:center}
.part-head input{font-weight:600}
.part-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.mats{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.matline{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px;align-items:center}
.part-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--fg-2);gap:8px;flex-wrap:wrap}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:22px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:30px;height:30px;color:var(--accent)}
.result{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.price{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;letter-spacing:.01em}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.kpi b{display:block;font:500 17px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;margin-top:3px}
.good{color:var(--good)}.bad{color:var(--bad)}.warnc{color:var(--warn)}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--sunken)}
.bar span{display:block;height:100%}
.brk{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:4px 8px;align-items:center;font-size:13px}
.brk .sw{width:10px;height:10px;border-radius:3px}
.brk .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.brk .tot{border-top:1px solid var(--line);padding-top:6px;margin-top:2px;font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
.empty{padding:34px 16px;text-align:center;color:var(--fg-2)}
.empty h3{color:var(--fg);margin-bottom:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pcard{overflow:hidden;display:flex;flex-direction:column}
.pcard .img{aspect-ratio:4/3;max-width:100%;background:var(--sunken) center/cover no-repeat;display:grid;place-items:center;color:var(--fg-3);border-bottom:1px solid var(--line)}
.pcard .img svg{width:40px;height:40px}
.pcard .body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard .acts{display:flex;gap:6px;margin-top:auto;padding-top:6px}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
table.list td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:last-child td{border-bottom:0}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:var(--glass)}
.tscroll{overflow-x:auto}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:999px;padding:3px 9px;border:1px solid currentColor;white-space:nowrap}
.st-angebot{color:#9fb0a6}.st-angenommen{color:#6aa9ff}.st-druck{color:#f2b84b}.st-fertig{color:#c58bff}.st-versendet{color:#5fd0d6}.st-bezahlt{color:#3fd47f}.st-storniert{color:#ff6b5e}
.chart{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.chart .stackb{width:100%;max-width:46px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 2px 2px;overflow:hidden;min-height:2px;background:var(--sunken)}
.chart .stackb i{display:block}
.chart small{font-size:11px;color:var(--fg-3)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(5vh,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));overflow:auto}
.modal{width:min(640px,100%);background:var(--solid);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal .mb{padding:16px;display:flex;flex-direction:column;gap:12px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.pick{display:flex;flex-direction:column;max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.pick button{display:flex;gap:10px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;cursor:pointer}
.pick button:hover{background:var(--glass)}
.pick button:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--solid);border:1px solid var(--accent);color:var(--fg);padding:10px 16px;border-radius:999px;z-index:60;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100vw - 32px)}
.setlist{display:flex;flex-direction:column}
.setrow{display:grid;gap:8px;align-items:end;padding:10px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.sr-pr{grid-template-columns:minmax(120px,1.4fr) repeat(5,minmax(70px,1fr)) 34px}
.sr-mt{grid-template-columns:44px minmax(140px,1.6fr) minmax(80px,.8fr) repeat(2,minmax(80px,1fr)) 34px}
.sr-ch{grid-template-columns:minmax(100px,1.5fr) repeat(2,minmax(70px,1fr)) 34px}
.grid-biz{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.grid-2p{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sec-title{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.note{font-size:13px;color:var(--fg-2);background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.hint{font-size:12px;color:var(--fg-3)}
@media (max-width:980px){.grid-calc,.grid-biz,.grid-2p{grid-template-columns:minmax(0,1fr)}.sr-pr{grid-template-columns:repeat(3,minmax(0,1fr)) 34px}.sr-pr>label:first-child{grid-column:1/-1}.result{position:static}.setup{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){
  .part-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols3,.cols4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .price{font-size:38px}
  nav.tabs{margin-left:0;width:100%}
  .brand{flex:1}
  h1{font-size:22px}
  .part{grid-template-columns:minmax(0,1fr)}
  .part .thumb{display:none}
  .sr-pr{grid-template-columns:repeat(2,minmax(0,1fr))}.sr-mt{grid-template-columns:44px minmax(0,1fr) minmax(0,1fr)}.sr-mt>label:nth-child(n+3){grid-column:auto}.sr-ch{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.sr-ch>label:first-child{grid-column:1/-1}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:400px){.setup,.cols2{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- Kalkulation ---------- */
function calc(q){
  const c=S.cfg;const out={parts:[],material:0,energy:0,machine:0,scrap:0,labor:0,pkg:0,extra:num(q.extra),grams:0,minutes:0,pieces:0};
  for(const p of q.parts){
    const qty=Math.max(1,Math.round(num(p.qty)));const pr=printerOf(p,q);const hours=num(p.time)/60;
    let matCost=0,grams=0;
    p.mats.forEach((m,i)=>{const mt=matOf(m,q);const gg=num(m.g)+(i===0?num(p.purge):0);grams+=gg;matCost+=gg*num(mt.price)/1000});
    const energy=hours*num(pr.watt)/1000*num(c.kwh);
    const machine=hours*(num(pr.price)/Math.max(1,num(pr.life))+num(pr.maint));
    const raw=matCost+energy+machine;const scrap=raw*num(c.scrap)/100;
    const labor=(num(c.prepMin)+num(c.postMin)*qty)/60*num(c.rate);
    const line={id:p.id,qty,unit:raw+scrap,mat:matCost*qty,energy:energy*qty,machine:machine*qty,scrap:scrap*qty,labor,grams:grams*qty,minutes:num(p.time)*qty};
    line.total=line.mat+line.energy+line.machine+line.scrap+line.labor;
    out.parts.push(line);
    out.material+=line.mat;out.energy+=line.energy;out.machine+=line.machine;out.scrap+=line.scrap;out.labor+=line.labor;out.grams+=line.grams;out.minutes+=line.minutes;out.pieces+=qty;
  }
  out.pkg=q.parts.length?num(c.pkg):0;
  out.cost=out.material+out.energy+out.machine+out.scrap+out.labor+out.pkg+out.extra;
  const ch=byId(c.channels,q.channelId)||{pct:0,fix:0},pay=byId(c.payments,q.paymentId)||{pct:0,fix:0};
  const rate=(num(ch.pct)+num(pay.pct))/100,fixed=num(ch.fix)+num(pay.fix);
  const v=c.vat?num(c.vatRate)/(100+num(c.vatRate)):0;
  const ship=num(q.shipping);
  const target=out.cost*(1+num(q.markup)/100);
  let goods;
  const ov=String(q.override??"").trim();
  if(ov!==""&&num(ov)>0){goods=num(ov);out.manual=true}
  else{const T=(target+ship+fixed)/Math.max(.05,1-rate-v);goods=roundPrice(Math.max(0,T-ship),q.rounding)}
  if(!q.parts.length)goods=0;
  const T=goods+ship;
  out.goods=goods;out.ship=ship;out.total=T;
  out.fees=q.parts.length?T*rate+fixed:0;out.vatAmt=T*v;out.net=T-out.vatAmt;
  out.profit=T-out.fees-out.vatAmt-ship-out.cost;
  out.margin=out.net>0?out.profit/(out.net-0)*100:0;
  out.realMarkup=out.cost>0?out.profit/out.cost*100:0;
  return out;
}
function roundPrice(p,mode){
  if(p<=0)return 0;
  switch(mode){case "10":return Math.ceil(p*10-1e-9)/10;case "50":return Math.ceil(p*2-1e-9)/2;case "100":return Math.ceil(p-1e-9);
    case "90":{const b=Math.ceil(p-0.9-1e-9)+0.9;return b<p-1e-9?b+1:b}
    case "99":{const b=Math.ceil(p-0.99-1e-9)+0.99;return b<p-1e-9?b+1:b}
    default:return r2(p)}
}

/* ---------- Geschäft ---------- */
function renderBiz(m){
  const sold=S.orders.filter(o=>SOLD.has(o.status));
  const sum=k=>sold.reduce((a,o)=>a+num(o.sum?.[k]),0);
  const open=S.orders.filter(o=>o.status==="angebot");
  const unpaid=S.orders.filter(o=>["angenommen","druck","fertig","versendet"].includes(o.status));
  const months=[];const now=new Date();for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({k:d.toISOString().slice(0,7),l:d.toLocaleDateString("de-DE",{month:"short"}),rev:0,pro:0})}
  sold.forEach(o=>{const mm=months.find(x=>x.k===(o.date||"").slice(0,7));if(mm){mm.rev+=num(o.sum?.total)-num(o.sum?.ship);mm.pro+=num(o.sum?.profit)}});
  const max=Math.max(1,...months.map(x=>x.rev));
  const prod={};sold.forEach(o=>o.parts.forEach(p=>{const k=p.name;prod[k]=prod[k]||{n:0,name:k};prod[k].n+=num(p.qty)}));
  const top=Object.values(prod).sort((a,b)=>b.n-a.n).slice(0,6);
  m.innerHTML=`<div class="stack">
    <div class="row"><h1>Geschäft</h1><span class="dim">alle verkauften Aufträge</span></div>
    <div class="cols4">
      <div class="panel pad"><span class="label">Umsatz</span><div class="price num" style="font-size:26px;margin-top:6px">${eur(sum("total")-sum("ship"))}</div><div class="hint">${sold.length} Aufträge</div></div>
      <div class="panel pad"><span class="label">Gewinn</span><div class="price num good" style="font-size:26px;margin-top:6px">${eur(sum("profit"))}</div><div class="hint">nach Kosten, Gebühren${S.cfg.vat?", USt":""}</div></div>
      <div class="panel pad"><span class="label">Druckzeit</span><div class="price num" style="font-size:26px;margin-top:6px">${N0.format(sum("minutes")/60)} h</div><div class="hint">${g(sum("grams"))} Filament</div></div>
      <div class="panel pad"><span class="label">Offen</span><div class="price num" style="font-size:26px;margin-top:6px">${unpaid.length}</div><div class="hint">${eur(unpaid.reduce((a,o)=>a+num(o.sum?.total),0))} noch nicht bezahlt · ${open.length} Angebote</div></div>
    </div>
    <div class="grid-biz">
      <section class="panel pad"><div class="row"><h2>Umsatz und Gewinn je Monat</h2><span class="sp"></span><span class="chip"><span class="dot" style="background:var(--track)"></span>Umsatz</span><span class="chip"><span class="dot" style="background:var(--good)"></span>Gewinn</span></div>
        <div class="chart">${months.map(x=>`<div class="col" title="${x.l}: ${eur(x.rev)} Umsatz, ${eur(x.pro)} Gewinn"><small class="num">${x.rev?N0.format(x.rev)+" €":""}</small>
          <div class="stackb" style="height:${Math.max(2,x.rev/max*130)}px"><i style="height:${x.rev?Math.max(0,x.pro)/x.rev*100:0}%;background:var(--good)"></i><i style="flex:1;background:var(--track)"></i></div><small>${x.l}</small></div>`).join("")}</div></section>
      <section class="panel pad"><h2>Meistverkauft</h2>
        ${top.length?`<div class="stack" style="gap:8px;margin-top:10px">${top.map(t=>`<div class="row"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.name)}</span><span class="num dim">${N0.format(t.n)} Stk</span></div>`).join("")}</div>`:`<p class="muted">Sobald Aufträge angenommen sind, erscheinen hier deine Bestseller.</p>`}</section>
    </div>
  </div>`;
}

let toastT;function toast(t){let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=t;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),2600)}

/* ---------- Datei-Import ---------- */
function parseDur(s){if(!s)return 0;let m=0;const re=/(\d+(?:\.\d+)?)\s*([dhms])/g;let x,found=false;while((x=re.exec(s))){found=true;const v=parseFloat(x[1]);m+={d:1440,h:60,m:1,s:1/60}[x[2]]*v}return found?m:0}
function splitList(s){return String(s||"").split(/[;,]/).map(x=>x.trim()).filter(Boolean)}
function parseGcodeText(t){
  const r={minutes:0,grams:[],lengths:[],types:[],colors:[],densities:[]};let mm;
  if((mm=t.match(/total estimated time:\s*([^;\n]+)/i)))r.minutes=parseDur(mm[1]);
  if(!r.minutes&&(mm=t.match(/estimated printing time \(normal mode\)\s*=\s*([^\n]+)/i)))r.minutes=parseDur(mm[1]);
  if(!r.minutes&&(mm=t.match(/model printing time:\s*([^;\n]+)/i)))r.minutes=parseDur(mm[1]);
  if(!r.minutes&&(mm=t.match(/;\s*TIME:\s*(\d+)/)))r.minutes=parseInt(mm[1])/60;
  if(!r.minutes&&(mm=t.match(/;\s*PRINT\.TIME\s*:\s*(\d+)/i)))r.minutes=parseInt(mm[1])/60;
  if((mm=t.match(/total filament weight \[g\]\s*:\s*([^\n]+)/i)))r.grams=splitList(mm[1]).map(Number);
  else if((mm=t.match(/filament used \[g\]\s*=\s*([^\n]+)/i)))r.grams=splitList(mm[1]).map(Number);
  if((mm=t.match(/filament used \[mm\]\s*=\s*([^\n]+)/i))||(mm=t.match(/total filament length \[mm\]\s*:\s*([^\n]+)/i)))r.lengths=splitList(mm[1]).map(Number);
  else if((mm=t.match(/;\s*Filament used:\s*([\d.,\sm]+)/i)))r.lengths=splitList(mm[1].replace(/m/g,"")).map(v=>Number(v)*1000);
  if((mm=t.match(/;\s*filament_type\s*=\s*([^\n]+)/i)))r.types=splitList(mm[1]);
  if((mm=t.match(/;\s*filament_colou?r\s*=\s*([^\n]+)/i)))r.colors=splitList(mm[1]);
  if((mm=t.match(/;\s*filament_density\s*[=:]\s*([^\n]+)/i)))r.densities=splitList(mm[1]).map(Number);
  if(!r.grams.length&&r.lengths.length){r.grams=r.lengths.map((L,i)=>L*Math.PI*0.875*0.875*(r.densities[i]||1.24)/1000)}
  return r;
}
function gcodeToMats(r){
  const out=[];r.grams.forEach((gg,i)=>{if(!(gg>0))return;out.push({g:r2(gg),type:r.types[i]||r.types[0]||"",color:r.colors[i]||""})});return out;
}
function hexDist(a,b){const p=h=>{h=String(h||"").replace("#","");if(h.length===8)h=h.slice(0,6);if(h.length!==6)return null;return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};const x=p(a),y=p(b);if(!x||!y)return 999;return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])}
function mapMaterial(type,color){
  const tk=typeKey(type);const same=S.cfg.materials.filter(m=>typeKey(m.type)===tk);
  if(!type)return S.quote.matId?"":S.cfg.materials[0]?.id||"";
  if(!same.length)return "";
  if(color){let best=same[0],bd=1e9;same.forEach(m=>{const d=hexDist(m.hex,color);if(d<bd){bd=d;best=m}});return best.id}
  return same[0].id;
}
function matsFromFile(list){
  if(!list.length)return [{matId:"",g:0}];
  return list.map(x=>({matId:mapMaterial(x.type,x.color),g:x.g,label:[x.type,x.color].filter(Boolean).join(" ")||"",color:x.color||""}));
}
async function blobToThumb(blob,max=240){
  return new Promise(res=>{const url=URL.createObjectURL(blob);const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);const x=c.getContext("2d");x.fillStyle="#0b100d";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.78))};img.onerror=()=>{URL.revokeObjectURL(url);res("")};img.src=url});
}
function meshStats(tris){ // tris: Float32Array, 9 Werte je Dreieck
  let vol=0,area=0;
  for(let i=0;i<tris.length;i+=9){const ax=tris[i],ay=tris[i+1],az=tris[i+2],bx=tris[i+3],by=tris[i+4],bz=tris[i+5],cx=tris[i+6],cy=tris[i+7],cz=tris[i+8];
    vol+=(ax*(by*cz-bz*cy)-ay*(bx*cz-bz*cx)+az*(bx*cy-by*cx))/6;
    const ux=bx-ax,uy=by-ay,uz=bz-az,vx=cx-ax,vy=cy-ay,vz=cz-az;area+=Math.hypot(uy*vz-uz*vy,uz*vx-ux*vz,ux*vy-uy*vx)/2}
  return {vol:Math.abs(vol),area};
}
function parseStl(buf){
  const dv=new DataView(buf);
  if(buf.byteLength>84){const n=dv.getUint32(80,true);if(84+n*50===buf.byteLength){const t=new Float32Array(n*9);for(let i=0;i<n;i++){const o=84+i*50+12;for(let j=0;j<9;j++)t[i*9+j]=dv.getFloat32(o+j*4,true)}return meshStats(t)}}
  const txt=new TextDecoder().decode(buf);const v=[...txt.matchAll(/vertex\s+([-\d.eE+]+)\s+([-\d.eE+]+)\s+([-\d.eE+]+)/g)].map(m=>[+m[1],+m[2],+m[3]]);
  const t=new Float32Array(Math.floor(v.length/3)*9);for(let i=0;i+2<v.length;i+=3){t.set([...v[i],...v[i+1],...v[i+2]],(i/3)*9)}return meshStats(t);
}
function estimate(stats,matId){
  const c=S.cfg;const mt=byId(c.materials,matId||S.quote.matId)||c.materials[0]||{density:1.24};const pr=byId(c.printers,S.quote.printerId)||c.printers[0]||{gph:25};
  const vcm=stats.vol/1000;const shell=Math.min(vcm,stats.area*num(c.estWall)/1000);
  const grams=(shell+(vcm-shell)*num(c.estInfill)/100)*num(mt.density||1.24);
  const minutes=grams/Math.max(1,num(pr.gph))*60+8;
  return {grams:r2(grams),minutes:Math.round(minutes)};
}
async function parse3mf(file){
  const zip=await JSZip.loadAsync(file);const base=file.name.replace(/\.gcode\.3mf$|\.3mf$/i,"");
  const parts=[];
  const si=zip.file("Metadata/slice_info.config");
  let plateNames={};
  const ms=zip.file("Metadata/model_settings.config");
  if(ms){try{const d=new DOMParser().parseFromString(await ms.async("string"),"text/xml");$$("plate",d).forEach(pl=>{const md={};$$(":scope>metadata",pl).forEach(e=>md[e.getAttribute("key")]=e.getAttribute("value"));if(md.plater_id)plateNames[md.plater_id]=md.plater_name||""})}catch(e){}}
  if(si){
    const d=new DOMParser().parseFromString(await si.async("string"),"text/xml");
    for(const pl of $$("plate",d)){
      const md={};$$(":scope>metadata",pl).forEach(e=>md[e.getAttribute("key")]=e.getAttribute("value"));
      const idx=md.index||"1";const sec=num(md.prediction);
      let mats=$$("filament",pl).map(f=>({g:r2(num(f.getAttribute("used_g"))),type:f.getAttribute("type")||"",color:(f.getAttribute("color")||"").slice(0,7)})).filter(x=>x.g>0);
      if(!mats.length&&num(md.weight)>0)mats=[{g:r2(num(md.weight)),type:"",color:""}];
      if(!sec&&!mats.length)continue;
      const objs=$$("object",pl).map(o=>o.getAttribute("name")).filter(Boolean);
      const thumbF=zip.file(`Metadata/plate_${idx}.png`)||zip.file(`Metadata/plate_${idx}_small.png`)||zip.file("Metadata/thumbnail.png");
      const thumb=thumbF?await blobToThumb(await thumbF.async("blob")):"";
      const nm=plateNames[idx]||(objs.length===1?objs[0]:"")||base;
      parts.push({name:nm+(($$("plate",d).length>1&&!plateNames[idx])?` · Platte ${idx}`:""),minutes:sec/60,mats,thumb,src:"3MF geslict"});
    }
  }
  if(!parts.length){
    const gf=Object.keys(zip.files).filter(n=>/^Metadata\/plate_\d+\.gcode$/i.test(n));
    for(const n of gf){const t=await zip.file(n).async("string");const r=parseGcodeText(t.slice(0,300000)+"\n"+t.slice(-300000));if(r.minutes||r.grams.length){const idx=n.match(/plate_(\d+)/)[1];const tf=zip.file(`Metadata/plate_${idx}.png`);parts.push({name:base+(gf.length>1?` · Platte ${idx}`:""),minutes:r.minutes,mats:gcodeToMats(r),thumb:tf?await blobToThumb(await tf.async("blob")):"",src:"G-Code"})}}
  }
  if(!parts.length){
    // ungeslict: Volumen aus dem Netz
    const files=Object.keys(zip.files).filter(n=>/\.model$/i.test(n));const objects={};let build=[];
    for(const n of files){
      const d=new DOMParser().parseFromString(await zip.file(n).async("string"),"text/xml");
      const path="/"+n.replace(/^\//,"");
      d.querySelectorAll("object").forEach(o=>{const id=o.getAttribute("id");const mesh=o.getElementsByTagName("mesh")[0];
        if(mesh){const vs=[...mesh.getElementsByTagName("vertex")].map(v=>[+v.getAttribute("x"),+v.getAttribute("y"),+v.getAttribute("z")]);const ts=[...mesh.getElementsByTagName("triangle")];const t=new Float32Array(ts.length*9);ts.forEach((tr,i)=>{const a=vs[+tr.getAttribute("v1")],b=vs[+tr.getAttribute("v2")],c=vs[+tr.getAttribute("v3")];if(a&&b&&c)t.set([...a,...b,...c],i*9)});objects[path+"#"+id]={stats:meshStats(t),name:o.getAttribute("name")}}
        else{const comps=[...o.getElementsByTagName("component")].map(cp=>(cp.getAttribute("p:path")||path)+"#"+cp.getAttribute("objectid"));objects[path+"#"+id]={comps,name:o.getAttribute("name")}}});
      if(/3dmodel\.model$/i.test(n))build=[...d.getElementsByTagName("item")].map(it=>path+"#"+it.getAttribute("objectid"));
    }
    const statOf=(k,depth=0)=>{const o=objects[k]||objects[k.replace(/^\/+/,"/")];if(!o||depth>8)return {vol:0,area:0};if(o.stats)return o.stats;return o.comps.reduce((a,c)=>{const s=statOf(c,depth+1);return {vol:a.vol+s.vol,area:a.area+s.area}},{vol:0,area:0})};
    const tot=build.reduce((a,k)=>{const s=statOf(k);return {vol:a.vol+s.vol,area:a.area+s.area}},{vol:0,area:0});
    if(tot.vol>0){const e=estimate(tot);const tf=zip.file("Metadata/thumbnail.png")||zip.file("Metadata/plate_1.png");parts.push({name:base,minutes:e.minutes,mats:[{g:e.grams,type:"",color:""}],thumb:tf?await blobToThumb(await tf.async("blob")):"",src:"Schätzung aus Modell"})}
  }
  return parts;
}
async function importFiles(files,target="quote"){
  const added=[];
  for(const f of files){
    try{
      const n=f.name.toLowerCase();let parts=[];
      if(n.endsWith(".3mf"))parts=await parse3mf(f);
      else if(n.endsWith(".stl")){const st=parseStl(await f.arrayBuffer());if(st.vol>0){const e=estimate(st);parts=[{name:f.name.replace(/\.stl$/i,""),minutes:e.minutes,mats:[{g:e.grams,type:"",color:""}],src:"Schätzung aus STL"}]}}
      else if(n.endsWith(".bgcode")){toast("Binärer G-Code (.bgcode) wird nicht unterstützt. Exportiere als .gcode.");continue}
      else{const big=f.size>1.2e6;const t=big?(await f.slice(0,600000).text())+"\n"+(await f.slice(Math.max(0,f.size-600000)).text()):await f.text();const r=parseGcodeText(t);if(r.minutes||r.grams.length)parts=[{name:f.name.replace(/\.(gcode|gco)$/i,""),minutes:r.minutes,mats:gcodeToMats(r),src:"G-Code"}]}
      if(!parts.length){toast(`In „${f.name}“ wurden keine Druckdaten gefunden.`);continue}
      for(const p of parts)added.push(newPart({name:p.name,time:Math.round(p.minutes),thumb:p.thumb||"",src:p.src,mats:matsFromFile(p.mats)}));
    }catch(e){console.error(e);toast(`„${f.name}“ konnte nicht gelesen werden.`)}
  }
  if(!added.length)return [];
  if(target==="quote"){S.quote.parts.push(...added);saveDraft();if(S.tab!=="rechner")S.tab="rechner";render();toast(added.length===1?"Teil übernommen":`${added.length} Teile übernommen`)}
  return added;
}

/* ---------- PDF ---------- */
function buildPdf(q){
  const r=calc(q),c=S.cfg;const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4"});
  const L=20,R=190;let y=22;const green=[30,150,85];
  doc.setFont("helvetica","bold");doc.setFontSize(18);doc.text("Angebot",L,y);
  doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(90);
  const co=[c.company.name,...String(c.company.address||"").split("\n"),c.company.email,c.company.phone].filter(Boolean);
  co.forEach((l,i)=>doc.text(l,R,y-4+i*4.2,{align:"right"}));
  y+=8;doc.setTextColor(0);doc.setFontSize(10);
  doc.text(`Angebotsnummer: ${q.no||"Entwurf"}`,L,y);doc.text(`Datum: ${dDE(q.date||today())}`,L,y+5);
  const vu=new Date(q.date||today());vu.setDate(vu.getDate()+num(c.validDays));doc.text(`Gültig bis: ${vu.toLocaleDateString("de-DE")}`,L,y+10);
  if(q.customer){doc.setFont("helvetica","bold");doc.text("Für",120,y);doc.setFont("helvetica","normal");doc.text([q.customer,...String(q.customerAddr||"").split("\n").filter(Boolean)],120,y+5)}
  y=Math.max(y+22,22+co.length*4.2+8);
  if(q.name){doc.setFont("helvetica","bold");doc.setFontSize(12);doc.text(q.name,L,y);y+=7}
  doc.setDrawColor(...green);doc.setLineWidth(.6);doc.line(L,y,R,y);y+=6;
  doc.setFontSize(9);doc.setFont("helvetica","bold");doc.text("Pos.",L,y);doc.text("Bezeichnung",L+12,y);doc.text("Menge",128,y,{align:"right"});doc.text("Einzelpreis",158,y,{align:"right"});doc.text("Gesamt",R,y,{align:"right"});
  y+=3;doc.setDrawColor(200);doc.setLineWidth(.2);doc.line(L,y,R,y);y+=6;doc.setFont("helvetica","normal");
  // Preis anteilig nach Kosten auf die Positionen verteilen
  const base=r.parts.reduce((a,p)=>a+p.total,0)||1;let rest=r.goods;
  r.parts.forEach((p,i)=>{const part=q.parts.find(x=>x.id===p.id);let lineTot=i===r.parts.length-1?rest:r2(r.goods*p.total/base);rest=r2(rest-lineTot);
    const unit=lineTot/p.qty;const mats=part.mats.map(m=>matOf(m,q)).map(m=>m.name).filter((v,j,a)=>a.indexOf(v)===j).join(", ");

    doc.text(String(i+1),L,y);doc.text(nameLines,L+12,y);doc.text(String(p.qty),128,y,{align:"right"});doc.text(eur(unit),158,y,{align:"right"});doc.text(eur(lineTot),R,y,{align:"right"});

function setPath(obj,path,val){const k=path.split(".");let o=obj;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k.at(-1)]=val}

    const [scope,...rest]=t.dataset.bind.split(".");const key=rest.at(-1);const path=rest.join(".");

    else if(scope==="c"){setPath(S.cfg,path,val);saveCfgSoon()}

    const p=S.quote.parts.find(x=>x.id===row.dataset.part);if(!p)return;
    if(t.dataset.pbind){const k=t.dataset.pbind;p[k]=NUMERIC.has(k)?num(t.value):t.value}

      const i=S.portfolio.findIndex(x=>x.id===p.id);if(i>=0)S.portfolio[i]=p;else S.portfolio.push(p);await Store.saveItem("p",p);closeModal();render();toast("Produkt gespeichert");break}

function fixRefs(){const c=S.cfg,q=S.quote;if(!byId(c.printers,q.printerId))q.printerId=c.printers[0].id;if(!byId(c.materials,q.matId))q.matId=c.materials[0].id;if(!byId(c.channels,q.channelId))q.channelId=c.channels[0].id;if(!byId(c.payments,q.paymentId))q.paymentId=c.payments[0].id;

(async function start(){
  S.cfg=defaultCfg();S.quote=newQuote();render();setSync("busy");
  await Store.init();
  try{
    const d=await Store.load();
    if(d.cfg)S.cfg=Object.assign(defaultCfg(),d.cfg);
    S.portfolio=d.portfolio||[];S.orders=d.orders||[];
    if(!d.cfg||Store._migrate)await Store.saveAll();

  fixRefs();setSync("ok");render();
})();

/* Preisleiste fürs Handy: zeigt Preis und Gewinn, solange das Ergebnis nicht im Bild ist */
(function(){
  const bar=$("#mbar");let resVisible=false,io=null;
  function upd(){
    const show=S.tab==="rechner"&&S.quote&&S.quote.parts.length&&!resVisible;
    document.body.classList.toggle("has-mbar",S.tab==="rechner");
    bar.hidden=!show;if(!show)return;

  }
  function watch(){const el=$("#result");if(io)io.disconnect();if(!el||!("IntersectionObserver" in window)){resVisible=false;return}
    io=new IntersectionObserver(es=>{resVisible=es[0].isIntersecting;upd()},{threshold:.15});io.observe(el)}
  const _rr=renderResult;renderResult=function(){_rr();upd()};
  const _rc=renderCalc;renderCalc=function(m){_rc(m);watch();upd()};
  const _r=render;render=function(){_r();if(S.tab!=="rechner")resVisible=false;upd()};
  $("#mbarGo").addEventListener("click",()=>{const el=$("#result");if(el)el.scrollIntoView({behavior:"smooth",block:"start"})});
  watch();upd();
})();

:root[data-skin="ha"]{
