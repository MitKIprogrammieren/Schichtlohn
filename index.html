  const seen=new Set();let card=null,link="";
  for(const p of paths.slice(0,30)){if(seen.has(p))continue;seen.add(p);
    let c;try{c=await hass().callWS({type:"lovelace/config",url_path:p})}catch(e){continue}
    let found=null,ifr="";walk(c,o=>{if(!found&&o.type==="custom:"+TAG)found=o;if(!ifr&&o.type==="iframe"&&o.url&&/druck/i.test((o.title||"")+o.url))ifr=o.url});
    if(found){card=found;link=ifr;break}}
  const cfg=Object.assign({entity:"todo.filament",verbrauch:"todo.filament_verbrauch"},card||{});
  delete cfg.type;delete cfg.card_mod;delete cfg.grid_options;delete cfg.view_layout;
  return {cfg,link};
}

  ensure().then(put).catch(e=>{const host=$("#lagerHost");if(host&&S.tab==="lager")host.innerHTML=`<div class="panel pad"><div class="note" style="border-color:var(--bad)">${esc(String(e&&e.message||e))}</div><div class="row" style="margin-top:10px"><button class="btn sm" data-act="lagerRetry">Erneut versuchen</button></div></div>`});
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act=lagerRetry]");if(b){L.err="";render()}});

window.LAGER={render,_L:L};
})();
</script>
<style>
#main .fold>.sec-title{cursor:pointer;user-select:none;-webkit-user-select:none}
#main .fold>.sec-title h2{display:flex;align-items:center;gap:8px}
#main .fold>.sec-title:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fold>.sec-title .chev{width:16px;height:16px;flex:none;color:var(--fg-3);transition:transform .15s}
.fold.zu>.sec-title .chev{transform:rotate(-90deg)}
.fold.zu>:not(.sec-title){display:none!important}
.fold.zu>.sec-title>:not(h2){display:none!important}
.fold.zu>.sec-title{margin-bottom:0!important;min-height:0}
.panel.pad.fold.zu{padding-top:12px;padding-bottom:12px}
.panel.pad.fold.zu.stack{gap:0}
[data-skin="bambu"] .panel.pad.fold.zu{padding-top:16px;padding-bottom:0}
[data-skin="bambu"] .panel.pad.fold.zu>.sec-title:first-child{margin-bottom:0!important;border-bottom:0;border-radius:var(--r)}
</style>
<script>
/* ===== Einstellungen: Abschnitte einklappbar, Zustand je Gerät gemerkt ===== */
(function(){
const KEY="schichtlohn_fold";let open={};try{open=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(open))}catch(e){}};
const CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
function secs(){return [...document.querySelectorAll("#main section.panel")].filter(s=>s.querySelector(":scope>.sec-title h2"))}
function apply(){
  if(S.tab!=="einstellungen")return;
  const list=secs();if(!list.length)return;
  for(const sec of list){const t=sec.querySelector(":scope>.sec-title"),h=t.querySelector("h2");
    const k=h.textContent.trim();sec.dataset.fold=k;
    if(!sec.classList.contains("fold")){sec.classList.add("fold");h.insertAdjacentHTML("afterbegin",CHEV);t.setAttribute("role","button");t.tabIndex=0}
    sec.classList.toggle("zu",!open[k]);t.setAttribute("aria-expanded",String(!!open[k]))}
  const head=document.querySelector("#main .stack>.row");
  if(head&&!head.querySelector("[data-act=foldAll]"))head.insertAdjacentHTML("beforeend",'<span class="sp"></span><button class="btn ghost sm" data-act="foldAll"></button>');
  const b=document.querySelector("#main [data-act=foldAll]");if(b)b.textContent=list.some(s=>s.classList.contains("zu"))?"Alle aufklappen":"Alle zuklappen";
}
function toggle(sec,want){const k=sec.dataset.fold;open[k]=want===undefined?sec.classList.contains("zu"):want;save();apply()}
document.addEventListener("click",e=>{
  const all=e.target.closest("#main [data-act=foldAll]");
  if(all){const any=secs().some(s=>s.classList.contains("zu"));secs().forEach(s=>{open[s.dataset.fold]=any});save();apply();return}
  const t=e.target.closest("#main .fold>.sec-title");if(!t||e.target.closest("button,select,input,a,label"))return;toggle(t.parentElement)});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("#main .fold>.sec-title")){e.preventDefault();toggle(e.target.parentElement)}});
const m=document.getElementById("main");if(m)new MutationObserver(()=>apply()).observe(m,{childList:true});
})();
</script>
<style>
.cfold>:first-child{cursor:default}
.cfold .cchev{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin:0 4px 0 -4px;padding:0;border:0;background:none;color:var(--fg-3);cursor:pointer;border-radius:4px;vertical-align:middle}
.cfold .cchev:hover{color:var(--fg);background:var(--glass-2)}
.cfold .cchev svg{width:16px;height:16px;transition:transform .15s}
.cfold.czu .cchev svg{transform:rotate(-90deg)}
.cfold.czu>:not(:first-child){display:none!important}
.panel.pad.cfold.czu{padding-bottom:16px}
[data-skin="bambu"] .panel.pad.cfold.czu{padding-bottom:0}
[data-skin="bambu"] .panel.pad.cfold.czu>:first-child{border-bottom:0;border-radius:var(--r);margin-bottom:0}
[data-skin="bambu"] .panel.cfold.czu>.row.pad:first-child{border-bottom:0;border-radius:var(--r)}
.panel.pad.cfold.czu.stack{gap:0}
</style>
<script>
/* ===== Rechner: Abschnitte per Doppelklick (oder Pfeil) einklappen, Zustand je Gerät gemerkt ===== */
(function(){
const KEY="schichtlohn_calcfold",SECS=["Teile","Teil hinzufügen","Weitere Angaben"];
let zu={};try{zu=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(zu))}catch(e){}};
const CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
function apply(){
  if(S.tab!=="rechner")return;
  for(const name of SECS){const sec=document.querySelector(`#main section.panel[aria-label="${name}"]`);if(!sec)continue;
    const head=sec.firstElementChild;const h=head&&(head.matches("h2")?head:head.querySelector("h2"));if(!h)continue;
    if(!sec.classList.contains("cfold")){sec.classList.add("cfold");sec.dataset.cfold=name;
      h.insertAdjacentHTML("afterbegin",`<button type="button" class="cchev" data-act="cfold" aria-label="${name} ein- oder ausklappen" title="Einklappen (oder Doppelklick auf die Leiste)">${CHEV}</button>`);head.title="Doppelklick: ein- oder ausklappen"}
    sec.classList.toggle("czu",!!zu[name]);const b=h.querySelector(".cchev");if(b)b.setAttribute("aria-expanded",String(!zu[name]))}
}
function toggle(sec,want){const n=sec.dataset.cfold;zu[n]=want===undefined?!zu[n]:want;save();apply()}
document.addEventListener("dblclick",e=>{const sec=e.target.closest("#main section.cfold");if(!sec)return;const head=sec.firstElementChild;
  if(!head.contains(e.target)||e.target.closest(".seg,input,select,textarea,a,[data-act]:not(.cchev)"))return;
  e.preventDefault();try{getSelection().removeAllRanges()}catch(x){}toggle(sec)});
document.addEventListener("click",e=>{const b=e.target.closest("#main .cchev");if(b){e.stopPropagation();toggle(b.closest("section.cfold"));return}
  const m=e.target.closest('#main section.cfold.czu [data-act="addMode"]');if(m){const sec=m.closest("section.cfold");setTimeout(()=>toggle(sec,false),0)}},true);
const m=document.getElementById("main");if(m)new MutationObserver(()=>apply()).observe(m,{childList:true,subtree:true});
})();
</script>
