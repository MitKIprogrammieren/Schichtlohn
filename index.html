/* --- QR-Code (Bestätigung in der Creality-Cloud-App) --- */
let qrLib=null;
function loadQr(){if(window.qrcode)return Promise.resolve(window.qrcode);if(qrLib)return qrLib;
  qrLib=new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js";s.onload=()=>window.qrcode?ok(window.qrcode):no(new Error("QR-Bibliothek fehlt"));s.onerror=()=>{qrLib=null;no(new Error("QR-Code konnte nicht geladen werden"))};document.head.appendChild(s)});return qrLib}
async function qrSvg(text){const qrcode=await loadQr();const q=qrcode(0,"M");q.addData(text);q.make();const n=q.getModuleCount();let p="";
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))p+=`M${x} ${y}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="QR-Code zum Anmelden"><path d="${p}" fill="#000"/></svg>`}
function stopPoll(){if(C.poll){clearInterval(C.poll);C.poll=null}}
async function qrStart(){
  const L=C.login;stopPoll();L.qr=null;L.qrState=0;L.qrMsg="";drawLogin();
  try{const r=await api("qr/new",{}, {noAuth:true,region:L.region});if(!r||!r.identical)throw new Error("Kein QR-Code erhalten");
    const url=(L.region==="cn"?"https://share.crealitycloud.cn/scan-code?geo=zh&i=":"https://share.crealitycloud.com/scan-code?geo=en&i=")+r.identical;
    L.qr={id:r.identical,url,svg:await qrSvg(url),bis:Date.now()+Math.max(60,(Number(r.expireTime)-Number(r.nowTime))||180)*1000};drawLogin();
    C.poll=setInterval(qrPoll,2000)}
  catch(e){L.qrMsg="Fehler: "+e.message;drawLogin()}}
async function qrPoll(){
  const L=C.login;if(!L||!L.qr||!document.getElementById("cr_login")){stopPoll();return}
  if(Date.now()>L.qr.bis){stopPoll();L.qrState=4;drawLogin();return}
  try{const r=await api("qr/query",{identical:L.qr.id},{noAuth:true,region:L.region})||{};const st=Number(r.state);
    if(st===2&&L.qrState!==2){L.qrState=2;L.nick=(r.confirmUserInfo&&r.confirmUserInfo.nickName)||"";drawLogin()}
    else if(st===3){stopPoll();saveLogin({token:r.token,userId:r.userId},L.nick||"",L.region);closeModal();toast("Creality-Cloud verbunden");load(true);rerender()}
    else if(st===4||st===5){stopPoll();L.qrState=st;drawLogin()}}
  catch(e){/* nächster Versuch */}}

/* --- Anmeldefenster --- */
function loginModal(){C.login={mode:"qr",region:"global",account:(acct()||{}).account||""};drawLogin(true);qrStart()}
function drawLogin(first){
  const L=C.login;if(!L)return;
  const tabs=`<div class="tabtg">${tg("crMode",L.mode==="qr","Mit der App bestätigen").replace('data-act="crMode"','data-act="crMode" data-m="qr"')}${tg("crMode",L.mode==="pw","E-Mail und Passwort").replace('data-act="crMode"','data-act="crMode" data-m="pw"')}</div>`;
  const reg=`<label class="field"><span>Region</span><select id="cr_reg"><option value="global"${L.region!=="cn"?" selected":""}>Europa und Welt (crealitycloud.com)</option><option value="cn"${L.region==="cn"?" selected":""}>China (crealitycloud.cn)</option></select></label>`;
  let body;
  if(L.mode==="qr"){
    const st=L.qrState;
    const inner=!L.qr?`<div class="hint">${esc(L.qrMsg||"QR-Code wird erzeugt…")}</div>`
      :st===4||st===5?`<div class="note">${st===4?"Der QR-Code ist abgelaufen.":"Die Anmeldung wurde in der App abgelehnt."}</div><button class="btn" data-act="crQrNew">Neuen QR-Code erzeugen</button>`
      :st===2?`<div class="note">Gescannt${L.nick?" von <b>"+esc(L.nick)+"</b>":""}. Bitte die Anmeldung jetzt in der Creality-Cloud-App bestätigen.</div>`
      :`<div class="box">${L.qr.svg}</div><div class="note"><b>Wichtig:</b> Nicht mit der Kamera-App scannen, sonst öffnet sich nur eine Fehlerseite („404“). Öffne die <b>Creality-Cloud-App</b>, tippe dort auf das <b>Scan-Symbol</b> und scanne den Code. Danach in der App „Anmelden“ bestätigen.</div><div class="hint">Du bist gerade am Handy und kannst den Code nicht scannen? Öffne SchichtLohn am Computer oder Tablet, oder nimm „E-Mail und Passwort“.</div>`;
    body=`${tabs}<p class="muted" style="margin:0">Zwei-Faktor-Anmeldung: Du scannst den Code mit der Creality-Cloud-App auf deinem Handy und gibst die Anmeldung dort frei. SchichtLohn bekommt dein Passwort dabei nie zu sehen.</p>
      <div class="crqr">${inner}</div>${reg}`}
  else body=`${tabs}<p class="muted" style="margin:0">Das Passwort wird nur für die Anmeldung gesendet und nicht gespeichert. In diesem Browser bleibt danach nur der Anmeldeschlüssel.</p>
      <label class="field"><span>E-Mail</span><input type="email" id="cr_acc" autocomplete="username" value="${esc(L.account)}"></label>
      <label class="field"><span>Passwort</span><input type="password" id="cr_pw" autocomplete="current-password"></label>${reg}
      <div class="hint">Sicherer ist „Mit der App bestätigen“: Dann ist zusätzlich dein Handy nötig (zweiter Faktor). Mit E-Mail und Passwort fragt Creality keinen zweiten Faktor ab.</div>`;
  const html=`<div class="stack" id="cr_login">${body}<div class="hint">Creality bietet dafür keine offizielle Schnittstelle. Der Abruf läuft über eine kleine Weiterleitung auf schichtlohn.pages.dev, die nichts speichert. Ändert Creality etwas, kann der Abruf ausfallen.</div><div class="hint" id="cr_msg" role="status"></div></div>`;
  const foot=`<button class="btn ghost" data-act="close">Abbrechen</button>${L.mode==="pw"?`<button class="btn pri" data-act="crLogin">Anmelden</button>`:""}`;
  if(!first&&!document.getElementById("cr_login"))return;
  modal("Creality-Cloud verbinden",html,foot)}
async function pwLogin(){
  const msg=$("#cr_msg");const btn=$('[data-act="crLogin"]');const account=$("#cr_acc").value.trim(),password=$("#cr_pw").value;const region=$("#cr_reg").value;
  if(!/.+@.+/.test(account)||!password){msg.textContent="Gib E-Mail und Passwort ein.";return}
  if(btn)btn.disabled=true;msg.textContent="Prüfe…";
  try{const r=await api("login",{account,password},{noAuth:true,region});saveLogin(r,account,region);closeModal();toast("Creality-Cloud verbunden");load(true);rerender()}
  catch(e){msg.textContent=(e.status===400?"Anmeldung abgelehnt: ":"Fehler: ")+e.message}
  finally{if(btn)btn.disabled=false}}

/* --- Normalisieren --- */
const hexOf=c=>{c=String(c==null?"":c).trim().split(/[,;]/)[0].trim();if(/^#?[0-9a-f]{7,8}$/i.test(c))return "#"+c.replace("#","").slice(-6).toLowerCase();if(/^#?[0-9a-f]{6}$/i.test(c))return "#"+c.replace("#","").slice(0,6).toLowerCase();const n=Number(c);return Number.isFinite(n)&&n>0&&n<=0xffffff&&/^\d+$/.test(c)?"#"+n.toString(16).padStart(6,"0"):""};
const nOf=v=>{const x=Number(v);return Number.isFinite(x)?x:null};
const tIso=v=>{const x=Number(v);if(!x)return "";return new Date(x>1e12?x:x*1000).toISOString()};
const STATES={0:"idle",1:"printing",2:"finished",3:"failed",4:"stopped",5:"paused"};
const STN={idle:"Bereit",printing:"Druckt",finished:"Fertig",failed:"Fehler",stopped:"Abgebrochen",paused:"Pausiert",offline:"Offline",unknown:"Unbekannt"};
const JOB_RE=/[._]([A-Z][A-Z0-9+-]{1,9})(?:_(0\.\d+))?_(?:(\d+)d)?(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?(?:\.gcode)?$/;
function jobInfo(name){const n=String(name||"");const m=n.match(JOB_RE);const sec=m&&[3,4,5,6].some(i=>m[i])?((+m[3]||0)*86400+(+m[4]||0)*3600+(+m[5]||0)*60+(+m[6]||0)):0;
  const title=(m?n.slice(0,m.index):n).replace(/\.(gcode|3mf|bgcode|stl)$/i,"").replace(/\.(stl|3mf|obj|step)$/i,"").split("/").pop()||"Druck";
  return {title,mat:m?m[1]:"",sec}}
/* Farb-/Materialangaben (CFS) irgendwo in den Daten finden: Objekte mit Farbe und Material */
function findSlots(obj,ort,out,depth){out=out||[];if(depth>6||obj==null)return out;
  if(typeof obj==="string"&&/^[\[{]/.test(obj.trim())){try{return findSlots(JSON.parse(obj),ort,out,depth+1)}catch(e){return out}}
  if(Array.isArray(obj)){obj.forEach((x,i)=>findSlots(x,ort,out,depth+1));return out}
  if(typeof obj!=="object")return out;
  const col=obj.color??obj.colour??obj.materialColor??obj.colorCode;const typ=obj.type??obj.materialType??obj.filamentType??obj.material;
  if(col!=null&&typ!=null&&typeof typ!=="object"&&hexOf(col)){out.push({type:String(typ),color:hexOf(col),name:String(obj.name||obj.materialName||obj.vendor||typ),
    remain:nOf(obj.percent??obj.remain??obj.remainLen),g:nOf(obj.weight??obj.usedWeight??obj.useWeight??obj.consumeWeight),len:nOf(obj.length??obj.usedLength??obj.useLength)});return out}
  Object.keys(obj).forEach(k=>{if(/box|cfs|material|filament|slot|tray|consum/i.test(k)||depth>0)findSlots(obj[k],ort,out,depth+1)});return out}
function parseDevice(d){
  const a={};(d.iotAttr||[]).forEach(x=>{if(x&&x.key!=null)a[x.key]=x.value});const p=d.printInfo||{};
  let state=STATES[a.state]||"unknown";const online=d.deviceState===1&&(a.connect??d.connect)===1;if(!online)state="offline";
  const active=state==="printing"||state==="paused";const job=active?(p.modelName||a.print||""):"";
  let progress=active?nOf(p.printProgress):null,left=active?nOf(p.printLeftTime):null;const started=active?nOf(a.printStartTime):null;
  if(state==="printing"&&progress==null&&left==null&&started){const s=jobInfo(job).sec;if(s){const el=Math.max(0,Date.now()/1000-started);progress=Math.min(99,Math.round(el/s*100));left=Math.max(0,s-el)}}
  const cfs=[];Object.keys(a).forEach(k=>{if(/box|cfs|material/i.test(k))findSlots(a[k],k,cfs,0)});
  return {id:String(d.deviceName||d.id||""),name:d.aliasName||d.deviceName||"Creality-Drucker",model:(d.deviceType&&d.deviceType.name)||d.model||"Creality",online,state,job:jobInfo(job).title||job,
    progress,left,nozzle:nOf(d.nozzleTemp),bed:nOf(d.bedTemp),chamber:nOf(d.boxTemp),thumb:active?(p.gcodeThumbnail||""):"",cfs:cfs.slice(0,16),tbId:String(d.tbId||""),cfsDa:Number(a.cfsInsert)===1,printId:active?String(p.printId||a.printId||""):"",boxes:null}}
const DENS={PLA:1.24,PETG:1.27,ABS:1.04,ASA:1.07,TPU:1.21,PA:1.14,PC:1.2,PET:1.3,PVA:1.23,HIPS:1.04};
const lenToG=(mm,type)=>{const t=String(type||"PLA").toUpperCase();const dn=DENS[Object.keys(DENS).find(k=>t.startsWith(k))]||1.24;return mm*Math.PI*0.875*0.875*dn/1000};
function firstNum(o,keys){for(const k of keys){const v=nOf(o[k]);if(v!=null&&v>0)return v}return null}
function parseRecord(r,pr){
  const info=jobInfo(r.name);const st=STATES[r.printState]||"unknown";const start=tIso(r.printStartTime),end=tIso(r.printEndTime);
  let minutes=nOf(r.printJobTime)?nOf(r.printJobTime)/60:(start&&end?(new Date(end)-new Date(start))/60000:0);
  let mats=findSlots(r.materialList||r.materials||r.filamentList||r.consumables||r.materialInfo||null,"",[],0).map(s=>({g:s.g!=null?s.g:(s.len?lenToG(s.len>1000?s.len:s.len*1000,s.type):0),type:s.type,color:s.color,name:s.name,filament_id:""}));
  let total=firstNum(r,["consumablesWeight","filamentWeight","weight","printWeight","useWeight","consumeWeight","materialWeight","totalWeight","filamentUsedWeight","usedWeight"]);
  const matTyp=(typeof r.material==="string"&&r.material)||(r.material&&typeof r.material==="object"&&!Array.isArray(r.material)&&(r.material.type||r.material.name))||info.mat;
  if(total==null){const vol=nOf(r.filamentRealVolume);if(vol>0){const t=String(matTyp||"PLA").toUpperCase();total=vol/1000*(DENS[Object.keys(DENS).find(k=>t.startsWith(k))]||1.24)}}
  if(total==null){const len=firstNum(r,["filamentLength","printLength","materialLength","useLength","filamentUsed","usedLength"]);if(len)total=lenToG(len>1000?len:len*1000,matTyp)}
  mats=mats.filter(m=>m.g>0.05);
  if(!mats.length&&total)mats.push({g:Math.round(total*10)/10,type:matTyp,color:"",name:matTyp,filament_id:""});
  const share=st==="finished"?1:Math.min(1,(nOf(r.printProgress)||0)/100);if(share<1)mats=mats.map(m=>Object.assign({},m,{g:Math.round(m.g*share*10)/10}));
  return {key:"cr:"+(r.id||r.printId||(pr.id+":"+r.printStartTime)),src:"creality",id:String(r.id||""),title:info.title,printer:pr.name,serial:pr.id,model:pr.model,
    start,end,minutes:Math.round(minutes||0),failed:st==="failed"||st==="stopped",running:st==="printing"||st==="paused",progress:nOf(r.printProgress),
    grams:Math.round(mats.reduce((a,m)=>a+m.g,0)*10)/10,mats,cover:r.thumbnailUrl||"",mat:matTyp}}

/* Creality-Drucker automatisch in die Druckerliste des Rechners übernehmen (Werte je Modell, danach in den Einstellungen anpassbar) */
const MODELLE=[[/k2\s*plus/i,{watt:250,price:1499,gph:30}],[/k2\s*pro/i,{watt:220,price:1099,gph:28}],[/k2/i,{watt:200,price:899,gph:26}],[/k1\s*max/i,{watt:220,price:699,gph:24}],[/k1c|k1\s*se|k1/i,{watt:150,price:449,gph:20}],
  [/hi\b|ender[-\s]*3\s*v3/i,{watt:130,price:299,gph:16}],[/ender/i,{watt:120,price:229,gph:14}]];
function druckerAnlegen(){const neu=[];
  C.printers.forEach(p=>{if(!p.id)return;const nn=String(p.name).toLowerCase().replace(/[\s_-]+/g,"");
    if(S.cfg.printers.some(x=>x.crealityId===p.id||String(x.name).toLowerCase().replace(/[\s_-]+/g,"")===nn))return;
    const m=(MODELLE.find(([re])=>re.test(p.model))||[0,{watt:200,price:600,gph:20}])[1];
    S.cfg.printers.push({id:uid(),name:p.name,watt:m.watt,price:m.price,life:6000,maint:0.05,gph:m.gph,crealityId:p.id});neu.push(p.name)});
  if(neu.length){saveCfgSoon();toast((neu.length>1?"Drucker ":"Drucker ")+neu.join(", ")+" hinzugefügt. Strom und Preis unter Einstellungen → Drucker prüfen.")}}
/* --- CFS über die Cloud (Versuch): der Drucker wird über Creality gefragt, Antwort wie im Heimnetz (boxsInfo) --- */
const SLOTS_K="schichtlohn_creality_faecher";
function findBoxes(o,d){if(d>7||o==null)return null;if(typeof o==="string"&&/^[\[{]/.test(o.trim())){try{return findBoxes(JSON.parse(o),d+1)}catch(e){return null}}
  if(Array.isArray(o)){for(const x of o){const r=findBoxes(x,d+1);if(r)return r}return null}
  if(typeof o!=="object")return null;if(Array.isArray(o.materialBoxs))return o.materialBoxs;for(const k of Object.keys(o)){const r=findBoxes(o[k],d+1);if(r)return r}return null}
/* Format der Cloud-Abfrage „cfsList“ (wie in Creality Print): cfsList[].portList[] und rackFilament */
function findCfsList(o,d){if(d>7||o==null)return null;if(typeof o==="string"&&/^[\[{]/.test(o.trim())){try{return findCfsList(JSON.parse(o),d+1)}catch(e){return null}}
  if(typeof o!=="object")return null;
  if(Array.isArray(o.cfsList)||o.rackFilament){const out=[];
    (o.cfsList||[]).forEach((c,i)=>out.push({id:i+1,type:0,temp:c.temp??c.temperature,humidity:c.humidity,materials:(c.portList||[]).map((m,k)=>({id:k,type:m.filamentType||"",name:m.filamentName||"",vendor:m.vendor||"",color:m.filamentsColor||"",percent:m.filamentProgress!=null?Number(m.filamentProgress)*(Number(m.filamentProgress)<=1?100:1):null,state:m.filamentType?1:0,selected:m.selected?1:0}))}));
    const rk=o.rackFilament;if(rk&&(rk.filamentType||rk.filamentsColor))out.push({id:0,type:1,materials:[{id:0,type:rk.filamentType||"",name:"",vendor:"",color:rk.filamentsColor||"",percent:null,state:1,selected:rk.selected?1:0}]});
    return out}
  if(Array.isArray(o)){for(const x of o){const r=findCfsList(x,d+1);if(r)return r}return null}
  for(const k of Object.keys(o)){const r=findCfsList(o[k],d+1);if(r)return r}return null}
function boxesOf(list){let n=0;return list.filter(b=>b&&Array.isArray(b.materials)).map(b=>{const ext=Number(b.type)===1;if(!ext)n++;
  return {name:ext?"Extern":"CFS "+(n),temp:nOf(b.temp),hum:nOf(b.humidity),slots:b.materials.filter(m=>m&&Number(m.state)!==0||m&&m.type).map(m=>({nr:(ext?"E":String(n))+String.fromCharCode(65+Number(m.id||0)),type:String(m.type||""),name:String(m.name||""),vendor:String(m.vendor||""),color:hexOf(m.color),pct:nOf(m.percent),sel:Number(m.selected)===1}))}})}
async function loadCfs(){
  for(const p of C.printers){if(!p.tbId||!p.online||!p.cfsDa)continue;const w=C.cfsAt[p.id]||0;if(Date.now()-w<(C.cfsFail[p.id]?600000:55000))continue;C.cfsAt[p.id]=Date.now();
    try{const r=await api("rpc",{tbId:p.tbId,get:"cfsList"});C.raw.rpc=r;const b=findCfsList(r,0)||findBoxes(r,0);
      if(b&&b.length){p.boxes=boxesOf(b);p.cfsInfo="";delete C.cfsFail[p.id];merkFaecher(p)}else{C.cfsFail[p.id]=1;p.cfsInfo="CFS angeschlossen – Creality liefert über die Cloud keine Fachdaten"}}
    catch(e){C.cfsFail[p.id]=1;C.raw.rpcFehler=String(e&&e.message||e);p.cfsInfo="CFS angeschlossen – Fachdaten über die Cloud nicht abrufbar"}}
  rerender()}
/* Während eines Drucks merken, welche Fächer aktiv waren: hilft beim Abbuchen (Farbe statt nur Material) */
function faecher(){try{return JSON.parse(localStorage.getItem(SLOTS_K)||"{}")||{}}catch(e){return {}}}
function merkFaecher(p){if(!p.printId||!p.boxes)return;const sel=[];p.boxes.forEach(b=>b.slots.forEach(s=>{if(s.sel&&s.color)sel.push({type:s.type,color:s.color,name:[s.vendor,s.name].filter(Boolean).join(" ")})}));if(!sel.length)return;
  const f=faecher();const l=f[p.printId]||[];sel.forEach(s=>{if(!l.some(x=>x.color===s.color&&x.type===s.type))l.push(s)});f[p.printId]=l;const ks=Object.keys(f);if(ks.length>200)ks.slice(0,ks.length-200).forEach(k=>delete f[k]);
  try{localStorage.setItem(SLOTS_K,JSON.stringify(f))}catch(e){}}
/* --- Laden --- */
async function loadStatus(force){
  if(!on()||!acct()||C.stLoading)return;if(!force&&C.stAt&&Date.now()-C.stAt<25000)return;
  C.stLoading=true;
  try{const r=await api("devices",{})||{};let list=[...(r.ungroupedList||[])];(r.groupList||[]).forEach(g=>{list=list.concat(g.list||g.devices||[])});
    const alt={};C.printers.forEach(p=>{if(p.boxes)alt[p.id]=p.boxes});
    C.raw.devices=list.slice(0,3);C.printers=list.map(parseDevice);C.printers.forEach(p=>{if(alt[p.id])p.boxes=alt[p.id]});C.stAt=Date.now();C.err="";druckerAnlegen();loadCfs()}
  catch(e){fail(e)}
  C.stLoading=false;rerender()}
async function load(force){
  if(!on()||!acct()||C.loading)return;if(!force&&C.at&&Date.now()-C.at<300000){loadStatus(false);return}
  C.loading=true;C.err="";rerender();
  try{await loadStatus(true);const jobs=[];
    for(const pr of C.printers){const r=await api("history",{deviceName:pr.id,page:1,pageSize:50})||{};const l=r.list||[];if(l.length&&!C.raw.history)C.raw.history=l.slice(0,3);l.forEach(x=>jobs.push(parseRecord(x,pr)))}
    const seen=new Set();C.jobs=jobs.filter(j=>!seen.has(j.key)&&seen.add(j.key));C.at=Date.now();buchen()}
  catch(e){fail(e)}
  C.loading=false;rerender()}
function fail(e){if(e.status===401){C.err="Die Anmeldung bei Creality ist abgelaufen. Bitte neu verbinden.";setAcct(null)}else C.err=String(e&&e.message||e)}
function rerender(){crStatus();if(S.tab==="drucke"&&window.JOBS){const q=document.getElementById("job_q");const foc=q&&document.activeElement===q;if(!foc)JOBS.render()}else if(S.tab==="einstellungen"&&window.render&&!document.querySelector("#modal.open, #modal[open]"))window.render()}
setInterval(()=>{if(on()&&acct()&&S.tab==="drucke"&&!document.hidden)loadStatus(false)},30000);

/* --- Abbuchen im Lager (nur neue, fertige Drucke seit dem Verbinden; jeder Druck nur einmal) --- */
function gebucht(){try{return new Set(JSON.parse(localStorage.getItem(DONE_K)||"[]"))}catch(e){return new Set()}}
function merk(set){try{localStorage.setItem(DONE_K,JSON.stringify([...set].slice(-500)))}catch(e){}}
let bucht=false;
async function buchenListe(liste){
  const B=LGN._book;const done=gebucht();const r={ab:0,offen:0};const stand={};
  const fm=faecher();
  for(const j of liste){const fa=fm[j.id]||[];if(fa.length===1)j.mats.forEach(m=>{if(!m.color){m.color=fa[0].color;if(!m.type)m.type=fa[0].type}});
    for(const m of j.mats){if(!(m.g>0.05))continue;
      const o={zeit:j.end,drucker:j.printer,ort:"CFS",anlass:j.failed?"Druck abgebrochen (Creality)":"Druck fertig (Creality)",quelle:j.key};
      let e=B.finde(m.type||j.mat,m.color);if(e&&stand[e.uid])e=stand[e.uid];
      if(e){const neuW=B.abbuchen(e,m.g);Object.assign(e,neuW);stand[e.uid]=e;await B.write(e,neuW);await B.log(e,o,m.g);r.ab++}
      else{await B.offen(Object.assign({},o,{gramm:m.g,farbe:m.color,material:m.type||j.mat,name:m.name||m.type||"",grund:m.color?"Keine Sorte mit "+(m.type||"diesem Material")+" in dieser Farbe im Lager":"Mehrere oder keine Sorte mit "+(m.type||j.mat||"diesem Material")+" – bitte zuordnen"}));r.offen++}}
    done.add(j.key);merk(done)}
  return r}
async function lagerBereit(){if(!window.LGN||!LGN._book)return false;const B=LGN._book;if(B.ready())return true;B.start();for(let i=0;i<30&&!B.ready();i++)await new Promise(ok=>setTimeout(ok,200));return B.ready()}
async function buchen(){
  if(bucht||!autoBuchen()||!window.LGN||!LGN._book)return;const B=LGN._book;if(!B.ready()){B.start();return}
  const a=acct();if(!a)return;const seit=a.since||"";const done=gebucht();const schon=B.quellen();
  const neu=C.jobs.filter(j=>!j.running&&j.end&&j.end>=seit&&j.grams>0&&!done.has(j.key)&&!schon.has(j.key));if(!neu.length)return;
  bucht=true;
  try{const r=await buchenListe(neu);if(r.ab||r.offen)toast(`Creality: ${r.ab} abgebucht${r.offen?`, ${r.offen} unter „Nicht zugeordnet“ im Lager`:""}`)}
  catch(e){console.warn("Creality abbuchen",e)}
  finally{bucht=false}}
/* Von Hand: ausgewählte Drucke jetzt abbuchen (auch ältere als das Verbinden) */
async function bucheJetzt(keys){
  if(bucht)return toast("Es wird gerade abgebucht, einen Moment …");
  if(!(await lagerBereit()))return toast("Das Lager ist noch nicht geladen. Öffne einmal den Reiter Lager.");
  const done=gebucht();const schon=LGN._book.quellen();const ks=new Set(keys);
  const l=C.jobs.filter(j=>ks.has(j.key)&&!j.running);const neu=l.filter(j=>!done.has(j.key)&&!schon.has(j.key)&&j.grams>0);
  const leer=l.filter(j=>!(j.grams>0)).length,doppelt=l.length-neu.length-leer;
  if(!neu.length)return toast(doppelt?"Diese Drucke sind schon abgebucht.":"Creality meldet für diese Drucke kein Gewicht.");
  bucht=true;try{const r=await buchenListe(neu);toast(`${r.ab} Filament${r.ab===1?"":"e"} abgebucht${r.offen?`, ${r.offen} unter „Nicht zugeordnet“ im Lager – dort zuordnen`:""}${doppelt?`, ${doppelt} waren schon abgebucht`:""}`)}
  catch(e){toast("Abbuchen fehlgeschlagen: "+(e.message||e))}finally{bucht=false;gbC=null;rerender()}}
let gbC=null,gbT=0;
const istGebucht=k=>{if(!gbC||Date.now()-gbT>2000){gbC=new Set(gebucht());try{if(window.LGN&&LGN._book&&LGN._book.ready())LGN._book.quellen().forEach(x=>gbC.add(x))}catch(e){}gbT=Date.now()}return gbC.has(k)};

        :p.cfs.length?`<div class="cfs">CFS ${p.cfs.map(s=>`<i style="background:${esc(s.color)}" title="${esc(s.name+(s.type&&s.type!==s.name?" · "+s.type:""))}"></i>`).join("")}</div>`

/* Rohdaten ohne Schlüssel, Seriennummern und Netzwerkangaben */
const GEHEIM=/^(keyFileToken|deviceSecret|macAddress|wifiSsid|netIP|factorySn|productionSn|userId|ownerUserId|tbId|syLicense|syDid|iotId|token)$/i;

<script>
/* ===== Sync zwischen Geräten (ohne Home Assistant) und „Handy als Scanner“ =====
   Daten werden im Browser mit AES-GCM verschlüsselt. Der Schlüssel steckt im Sync-Code bzw. im Kopplungs-QR-Code
   und geht nie an den Server. Server: functions/sync (Cloudflare KV „SYNC“). */
(function(){
"use strict";
const SK="schichtlohn_sync",PK="schichtlohn_handys";
const BASE=(/\.pages\.dev$/i.test(location.hostname)?location.origin:"https://schichtlohn.pages.dev");
const ST={busy:false,err:"",pushT:null,key:null,keyFor:"",renderLater:false,lastOk:0,paarT:null,paarAktiv:false};

/* --- Verschlüsselung --- */
const te=new TextEncoder(),td=new TextDecoder();
const b64=u=>{u=new Uint8Array(u);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(String(s).replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
const b64url=u=>b64(u).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const sha=async t=>new Uint8Array(await crypto.subtle.digest("SHA-256",te.encode(t)));
const hex=u=>[...u].map(x=>x.toString(16).padStart(2,"0")).join("");
const keyOf=raw=>crypto.subtle.importKey("raw",raw,"AES-GCM",false,["encrypt","decrypt"]);
async function encr(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const c=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,te.encode(JSON.stringify(obj))));const o=new Uint8Array(12+c.length);o.set(iv);o.set(c,12);return b64(o)}
async function decr(key,s){const u=unb64(s);return JSON.parse(td.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},key,u.slice(12))))}

/* --- Sync-Code: 20 Zeichen (100 Bit), daraus Datensatz-ID und Schlüssel --- */
const ALPH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const norm=c=>String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
function neuerCode(){const r=crypto.getRandomValues(new Uint8Array(20));return [...r].map(x=>ALPH[x%32]).join("").match(/.{4}/g).join("-")}
async function ableiten(code){const n=norm(code);return {sid:hex(await sha("schichtlohn-sid|"+n)).slice(0,40),key:await keyOf(await sha("schichtlohn-key|"+n))}}
function conf(){try{const c=JSON.parse(localStorage.getItem(SK)||"null");return c&&c.code?c:null}catch(e){return null}}
function setConf(c){try{c?localStorage.setItem(SK,JSON.stringify(c)):localStorage.removeItem(SK)}catch(e){}}
async function schluessel(c){if(ST.keyFor!==c.code){ST.key=(await ableiten(c.code)).key;ST.keyFor=c.code}return ST.key}
const aktiv=()=>S.backend==="local"&&!!conf();

/* Konto (Creality oder Bambu), falls der Sync daran gebunden ist oder gebunden werden soll */
function kontoInfo(){
  try{const a=JSON.parse(localStorage.getItem("schichtlohn_creality")||"null");if(a&&a.token&&a.uid)return {art:"creality",token:a.token,uid:a.uid,region:a.region||"global"}}catch(e){}
  try{const a=JSON.parse(localStorage.getItem("schichtlohn_bambu")||"null");if(a&&a.token)return {art:"bambu",token:a.token,region:a.region==="cn"?"cn":"global"}}catch(e){}
  return null}
async function call(path,body){
  let r;try{r=await fetch(BASE+"/sync/"+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})}catch(e){throw new Error("Sync-Server nicht erreichbar. Prüfe die Internetverbindung.")}
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){const e=new Error((d&&d.message)||("HTTP "+r.status));e.status=r.status;e.d=d;throw e}
  return d||{}}

/* --- Datenteile: Einstellungen, Lager, Logos, je Auftrag und je Portfolio-Teil einzeln --- */
function teile(){const c=Object.assign({},S.cfg||{});const lager=c.lagerLokal,logos=c.logos;delete c.lagerLokal;delete c.logos;
  const o={cfg:c};if(lager)o.lager=lager;if(logos&&Object.keys(logos).length)o.logos=logos;
  (S.portfolio||[]).forEach(p=>{if(p&&p.id)o["p_"+p.id]=p});(S.orders||[]).forEach(x=>{if(x&&x.id)o["o_"+x.id]=x});return o}
const hash=v=>{const s=JSON.stringify(v);let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)+"."+s.length};
function anwenden(n,val){
  if(n==="cfg"){const keep={lagerLokal:S.cfg&&S.cfg.lagerLokal,logos:S.cfg&&S.cfg.logos};S.cfg=Object.assign({},val);if(keep.lagerLokal)S.cfg.lagerLokal=keep.lagerLokal;if(keep.logos)S.cfg.logos=keep.logos}
  else if(n==="lager")S.cfg.lagerLokal=val;
  else if(n==="logos")S.cfg.logos=val;
  else if(/^[po]_/.test(n)){const list=n[0]==="p"?S.portfolio:S.orders;const i=list.findIndex(x=>x&&x.id===val.id);if(i>=0)list[i]=val;else list.push(val)}}
function entfernen(n){
  if(/^[po]_/.test(n)){const id=n.slice(2);const list=n[0]==="p"?S.portfolio:S.orders;const i=list.findIndex(x=>x&&x.id===id);if(i>=0)list.splice(i,1)}
  else if(n==="logos"&&S.cfg)delete S.cfg.logos}
function lokalSpeichern(){LS.set("cfg",S.cfg);LS.set("portfolio",S.portfolio);LS.set("orders",S.orders)}
function neuZeichnen(){
  try{if(window.LGN&&LGN._lokPush)LGN._lokPush()}catch(e){}
  const ae=document.activeElement;const tippt=ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)&&!ae.closest("#modal");
  if(tippt||document.querySelector("#modal.open,#modal[open],.modal.open")){ST.renderLater=true;return}
  ST.renderLater=false;if(window.render)window.render()}
document.addEventListener("focusout",()=>{if(ST.renderLater)setTimeout(()=>{if(ST.renderLater)neuZeichnen()},400)});

/* --- Abgleich --- */
async function push(){
  const c=conf();if(!c||S.backend!=="local"||!S.cfg)return;const key=await schluessel(c);const t=teile(),jetzt=Date.now();
  const put={},del=[],neu={};
  for(const [n,v] of Object.entries(t)){const h=hash(v);if(c.synced[n]!==h){put[n]={t:jetzt,d:await encr(key,v)};neu[n]=h}}
  for(const n of Object.keys(c.synced))if(!(n in t))del.push({n,t:jetzt});
  if(!Object.keys(put).length&&!del.length)return;
  const r=await call("push",{sid:c.sid,put,del,konto:c.gebunden?kontoInfo():undefined});
  const c2=conf();if(!c2||c2.sid!==c.sid)return;Object.assign(c2.synced,neu);del.forEach(x=>delete c2.synced[x.n]);c2.owner=r.owner||null;c2.dirtyAt=0;setConf(c2)}
async function pull(voll){
  const c=conf();if(!c||S.backend!=="local"||!S.cfg)return false;const key=await schluessel(c);
  const r=await call("pull",{sid:c.sid,v:voll?0:c.v,since:voll?0:c.since,konto:c.gebunden||c.owner?kontoInfo():undefined});
  if(r.same)return false;
  if(!voll&&r.v<(c.since||0))return pull(true);
  const lokal=teile();let geaendert=false;
  for(const [n,doc] of Object.entries(r.docs||{})){let val;try{val=await decr(key,doc.d)}catch(e){console.warn("Sync: Teil nicht lesbar",n);continue}
    const h=hash(val);if(c.synced[n]===h)continue;
    const lh=n in lokal?hash(lokal[n]):null;
    if(lh===h){c.synced[n]=h;continue}
    // hier geändert und noch nicht hochgeladen, und neuer als der Stand vom Server: eigener Stand gewinnt
    if(lh!==null&&c.synced[n]!==undefined&&lh!==c.synced[n]&&(c.dirtyAt||0)>doc.t)continue;
    anwenden(n,val);c.synced[n]=h;geaendert=true}
  const idx=r.idx||{};
  for(const n of Object.keys(c.synced))if(!(n in idx)&&(r.del||{})[n]){const lh=n in lokal?hash(lokal[n]):null;if(lh===null||lh===c.synced[n]){entfernen(n);geaendert=true}delete c.synced[n]}
  c.v=r.v;c.since=r.v;c.owner=r.owner||null;if(r.owner)c.gebunden=true;setConf(c);
  if(geaendert){lokalSpeichern();neuZeichnen()}
  return geaendert}
async function abgleichen(){
  if(!aktiv()||ST.busy)return;ST.busy=true;
  try{await pull(false);await push();ST.err="";ST.lastOk=Date.now()}
  catch(e){ST.err=e.status===403?String(e.message):String(e&&e.message||e);console.warn("Sync",e)}
  finally{ST.busy=false;statusZeigen()}}
function bald(){if(!aktiv())return;const c=conf();if(c&&!c.dirtyAt){c.dirtyAt=Date.now();setConf(c)}clearTimeout(ST.pushT);ST.pushT=setTimeout(abgleichen,2500)}
/* Nach jedem Speichern im Browser kurz danach hochladen */
["saveCfg","saveItem","delItem"].forEach(f=>{const alt=Store[f].bind(Store);Store[f]=async function(...a){const r=await alt(...a);try{bald()}catch(e){}return r}});
setInterval(()=>{if(aktiv()&&!document.hidden)abgleichen()},20000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&aktiv())abgleichen()});
window.addEventListener("focus",()=>{if(aktiv())abgleichen()});
function statusZeigen(){try{if(typeof setSync==="function")setSync(ST.err?"err":ST.busy?"busy":"ok")}catch(e){}const el=document.getElementById("syst");if(!el)return;el.className="syst"+(ST.err?" bad":"");el.textContent=statusText()}
function statusText(){if(ST.err)return "Fehler: "+ST.err;if(ST.busy)return "Gleicht ab …";if(!ST.lastOk)return "Noch nicht abgeglichen";const s=Math.round((Date.now()-ST.lastOk)/1000);return "Abgeglichen "+(s<10?"gerade eben":s<120?"vor "+s+" s":"vor "+Math.round(s/60)+" min")}

/* --- Einschalten, Beitreten, Ausschalten --- */
async function einschalten(){
  const code=neuerCode();const {sid}=await ableiten(code);
  setConf({code,sid,v:0,since:0,synced:{},owner:null,gebunden:false,dirtyAt:Date.now()});
  try{await abgleichen();toast("Sync ist eingeschaltet");geraetModal()}catch(e){toast("Fehler: "+e.message)}
  window.render&&window.render()}
async function beitreten(code,ohneFrage){
  code=norm(code);if(code.length!==20){toast("Der Sync-Code hat 20 Zeichen.");return}
  code=code.match(/.{4}/g).join("-");const {sid,key}=await ableiten(code);
  let r;try{r=await call("pull",{sid,since:0,konto:kontoInfo()||undefined})}catch(e){toast(e.message);return}
  const n=Object.keys(r.idx||{}).length;
  const los=async()=>{
    const synced={};
    if(n){const neu={cfg:null,lager:null,logos:null,p:[],o:[]};
      for(const [name,doc] of Object.entries(r.docs||{})){let val;try{val=await decr(key,doc.d)}catch(e){toast("Der Sync-Code passt nicht zu den Daten.");return}synced[name]=hash(val);
        if(name==="cfg")neu.cfg=val;else if(name==="lager")neu.lager=val;else if(name==="logos")neu.logos=val;else if(name.startsWith("p_"))neu.p.push(val);else if(name.startsWith("o_"))neu.o.push(val)}
      if(neu.cfg)S.cfg=neu.cfg;if(neu.lager)S.cfg.lagerLokal=neu.lager;else delete S.cfg.lagerLokal;if(neu.logos)S.cfg.logos=neu.logos;
      S.portfolio=neu.p;S.orders=neu.o;lokalSpeichern()}
    setConf({code,sid,v:r.v,since:r.v,synced,owner:r.owner||null,gebunden:!!r.owner,dirtyAt:n?0:Date.now()});
    try{if(window.LGN&&LGN._lokPush)LGN._lokPush()}catch(e){}
    await abgleichen();closeModal&&closeModal();toast(n?"Verbunden – Daten übernommen":"Verbunden – deine Daten werden hochgeladen");window.render&&window.render()};
  if(n&&!ohneFrage)confirmBox(`Mit diesem Sync verbinden? Die Daten auf diesem Gerät (Lager, Aufträge, Portfolio, Einstellungen) werden durch die Daten aus dem Sync ersetzt.`,"Verbinden",los);
  else await los()}
function ausschalten(){confirmBox("Sync auf diesem Gerät ausschalten? Die Daten bleiben hier und auf den anderen Geräten erhalten, werden aber nicht mehr abgeglichen.","Ausschalten",()=>{setConf(null);setAutoAus(true);ST.lastOk=0;ST.err="";statusZeigen();window.render&&window.render();toast("Sync ausgeschaltet")})}
async function binden(los){const c=conf();const k=kontoInfo();if(!c||!k)return;
  try{const r=await call("push",{sid:c.sid,put:{},del:[],konto:k,binden:!los,loesen:!!los});c.owner=r.owner||null;c.gebunden=!!r.owner;setConf(c);toast(los?"Bindung gelöst":"Sync ist jetzt an dein "+(k.art==="creality"?"Creality":"Bambu")+"-Konto gebunden");window.render&&window.render()}
  catch(e){toast("Fehler: "+e.message)}}

/* --- Automatisch über die Anmeldung (Creality oder Bambu) ---
   Gleiches Konto = gleicher Sync. Kein Code, kein QR-Code nötig. */
const AK="schichtlohn_sync_auto";
const autoAus=()=>{try{return localStorage.getItem(AK)==="aus"}catch(e){return false}};
const setAutoAus=v=>{try{v?localStorage.setItem(AK,"aus"):localStorage.removeItem(AK)}catch(e){}};
const kontoId=k=>k.art+":"+(k.uid||hash(k.token));
function hatDaten(){return (S.orders||[]).length>0||(S.portfolio||[]).length>0||Object.values((S.cfg&&S.cfg.lagerLokal)||{}).some(a=>Array.isArray(a)&&a.length>0)}
async function fernHatDaten(code){const {sid,key}=await ableiten(code);const r=await call("pull",{sid,since:0});
  for(const [n,doc] of Object.entries(r.docs||{})){if(/^[po]_/.test(n))return true;
    if(n==="lager"){try{const v=await decr(key,doc.d);if(Object.values(v||{}).some(a=>Array.isArray(a)&&a.length))return true}catch(e){return true}}}
  return false}
async function autoKonto(){
  if(ST.autoLaeuft||S.backend!=="local"||!S.cfg||!window.confirmBox||autoAus())return;
  const k=kontoInfo();if(!k)return;const id=kontoId(k);const c=conf();
  if(c&&c.konto===id)return;if(ST.autoGefragt===id)return;
  ST.autoLaeuft=true;
  try{
    const r=await call("konto",{konto:k,code:c?c.code:neuerCode()});
    if(!r.code)return;
    if(c&&norm(c.code)===norm(r.code)){c.konto=id;setConf(c);window.render&&window.render();return}
    if(c){ST.autoGefragt=id;return} // schon mit einem anderen Sync verbunden: nichts überschreiben
    if(r.neu){const {sid}=await ableiten(r.code);
      setConf({code:r.code,sid,v:0,since:0,synced:{},owner:null,gebunden:false,dirtyAt:Date.now(),konto:id});
      await abgleichen();toast("Sync ist an – über dein "+(k.art==="creality"?"Creality":"Bambu")+"-Konto");window.render&&window.render();return}
    // Für das Konto gibt es schon einen Sync von einem anderen Gerät
    const nimm=async()=>{await beitreten(r.code,true);const c2=conf();if(c2){c2.konto=id;setConf(c2)}window.render&&window.render()};
    // Wenn auf dem Konto noch nichts Wichtiges liegt (nur Einstellungen), gewinnt dieses Gerät ohne Frage
    const fern=await fernHatDaten(r.code);
    if(!fern&&hatDaten()){const {sid}=await ableiten(r.code);
      setConf({code:r.code,sid,v:0,since:0,synced:{},owner:null,gebunden:false,dirtyAt:Date.now(),konto:id});
      await push();await abgleichen();toast("Sync ist an – über dein "+(k.art==="creality"?"Creality":"Bambu")+"-Konto");window.render&&window.render();return}
    if(!hatDaten())await nimm();
    else{ST.autoGefragt=id;confirmBox(`Für dein ${k.art==="creality"?"Creality":"Bambu"}-Konto gibt es schon Daten von einem anderen Gerät. Sollen sie hier übernommen werden? Lager, Aufträge, Portfolio und Einstellungen auf diesem Gerät werden dabei ersetzt.`,"Übernehmen",nimm)}
  }catch(e){if(e.status!==401&&e.status!==503)console.warn("Sync-Konto",e)}
  finally{ST.autoLaeuft=false}}
setTimeout(autoKonto,1500);setInterval(()=>{if(!document.hidden)autoKonto()},15000);
window.addEventListener("focus",()=>autoKonto());

/* --- QR-Code --- */
let qrLib=null;
function loadQr(){if(window.qrcode)return Promise.resolve(window.qrcode);if(qrLib)return qrLib;
  qrLib=new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js";s.onload=()=>window.qrcode?ok(window.qrcode):no(new Error("QR fehlt"));s.onerror=()=>{qrLib=null;no(new Error("QR-Code konnte nicht geladen werden"))};document.head.appendChild(s)});return qrLib}
async function qrSvg(text){const qrcode=await loadQr();const q=qrcode(0,"M");q.addData(text);q.make();const n=q.getModuleCount();let p="";for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))p+=`M${x} ${y}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="QR-Code"><path d="${p}" fill="#000"/></svg>`}
const appUrl=()=>"https://schichtlohn.pages.dev/";
async function geraetModal(){const c=conf();if(!c)return;const link=appUrl()+"#sync="+norm(c.code);
  modal("Gerät hinzufügen",`<div class="stack"><p class="muted" style="margin:0">Auf dem anderen Gerät (z. B. Handy) diesen QR-Code mit der Kamera scannen oder den Link öffnen. SchichtLohn fragt dann, ob es sich verbinden soll.</p>
    <div class="syqr"><div class="box">${await qrSvg(link)}</div><div class="hint">Oder in SchichtLohn unter Einstellungen → Sync → „Mit Sync-Code verbinden“ eingeben:</div><div class="sycode">${esc(c.code)}</div></div>
    <div class="note"><b>Wie ein Passwort behandeln:</b> Wer den Code hat, kommt an deine Daten. Er ist zugleich der Schlüssel – ohne ihn lassen sich die verschlüsselten Daten nicht öffnen.</div></div>`,
    `<button class="btn" data-act="syCopy">Code kopieren</button><button class="btn pri" data-act="close">Fertig</button>`)}
function codeModal(){modal("Mit Sync-Code verbinden",`<div class="stack"><p class="muted" style="margin:0">Den 20-stelligen Code findest du auf dem anderen Gerät unter Einstellungen → Sync → „Gerät hinzufügen“.</p>
  <label class="field"><span>Sync-Code</span><input type="text" id="sy_code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" style="font-family:ui-monospace,monospace;letter-spacing:.05em"></label>
  <div class="note">Die Daten auf diesem Gerät werden durch die Daten aus dem Sync ersetzt.</div></div>`,`<button class="btn ghost" data-act="close">Abbrechen</button><button class="btn pri" data-act="syJoin">Verbinden</button>`);setTimeout(()=>{const i=document.getElementById("sy_code");i&&i.focus()},50)}

      <div class="syst" id="syst">${esc(statusText())}</div>

/* ===== Handy als Scanner ===== */
function paare(){try{const a=JSON.parse(localStorage.getItem(PK)||"[]");return Array.isArray(a)?a.filter(p=>p&&p.pid&&p.k&&(p.dauer||p.bis>Date.now())):[]}catch(e){return []}}
function setPaare(a){try{localStorage.setItem(PK,JSON.stringify(a))}catch(e){}}
function paarHTML(){const l=paare().filter(p=>p.dauer);
  return `<div class="field"><span>Handy als Scanner</span>${l.length?l.map(p=>`<div class="sypaar"><b>${esc(p.name||"Handy")}</b><span class="hint">gekoppelt ${new Date(p.seit||Date.now()).toLocaleDateString("de-DE")}</span><button class="btn ghost sm danger" data-act="syPaarWeg" data-pid="${esc(p.pid)}">Entfernen</button></div>`).join(""):`<div class="hint">Noch kein Handy dauerhaft gekoppelt. Im Lager auf „Handy“ tippen.</div>`}</div>`}
const scanUrl=p=>"https://schichtlohn.pages.dev/scan.html#p="+p.pid+"&k="+p.k+(p.name?"&n="+encodeURIComponent(p.name):"");
async function handyModal(){
  let p=paare().find(x=>!x.dauer&&x.bis>Date.now()+60000);
  if(!p){p={pid:hex(crypto.getRandomValues(new Uint8Array(16))),k:b64url(crypto.getRandomValues(new Uint8Array(16))),dauer:false,bis:Date.now()+30*60000,seq:0,seit:Date.now(),name:""};setPaare(paare().concat(p))}
  ST.paarAktiv=true;starteAbruf();

    <div class="syqr"><div class="box">${await qrSvg(scanUrl(p))}</div><div class="hint" id="sy_pstat">Wartet auf das Handy … (gilt 30 Minuten)</div></div>
    <label class="field"><span>Dauerhaft koppeln (optional)</span><div class="row" style="gap:8px"><input type="text" id="sy_pname" placeholder="Name, z. B. Bennys iPhone" style="flex:1"><button class="btn" data-act="syPaarDauer" data-pid="${p.pid}">Dauerhaft koppeln</button></div>
      <small class="hint">Dann vor dem Scannen des QR-Codes koppeln und auf dem Handy die Scanner-Seite zum Home-Bildschirm hinzufügen. Gekoppelte Handys siehst und entfernst du unter Einstellungen → Sync.</small></label></div>`,
    `<button class="btn pri" data-act="close">Fertig</button>`)}
/* Abruf der Codes vom Handy: alle 2,5 s, solange eine Kopplung gilt und SchichtLohn sichtbar ist */
const keyCache={};
async function paarKey(p){if(!keyCache[p.pid])keyCache[p.pid]=await keyOf(unb64(p.k));return keyCache[p.pid]}
function starteAbruf(){if(ST.paarT)return;ST.paarT=setInterval(abruf,2500);abruf()}
let abrufLaeuft=false;
async function abruf(){
  const l=paare();if(!l.length){clearInterval(ST.paarT);ST.paarT=null;return}
  if(document.hidden||abrufLaeuft)return;
  // dauerhafte Kopplungen nur abfragen, solange das Lager offen ist; einmalige solange gültig
  const jetzt=l.filter(p=>!p.dauer||S.tab==="lager");if(!jetzt.length)return;
  abrufLaeuft=true;
  try{for(const p of jetzt){let r;try{r=await call("scan/poll",{pid:p.pid,after:p.seq||0})}catch(e){continue}

let fdbT;function fdbSuche(q){clearTimeout(fdbT);fdbT=setTimeout(async()=>{const box=document.getElementById("lgdbres");if(!box)return;q=String(q||"").trim();if(box.dataset.pick)box.hidden=!q;

/* --- Spule per Foto erkennen: Etikett-Leser (Container auf der Synology) liest Text und Barcode, die Farbe tippt man im Foto an, Vorschläge kommen aus Lager und Filament-Datenbank --- */
const CAMI=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>`;
const ET_KEY="schichtlohn_etikett_url";
function etUrl(){let u="";try{u=localStorage.getItem(ET_KEY)||""}catch(e){}
  if(!u&&location.protocol==="http:"&&location.hostname)u=`http://${location.hostname}:8093`;return u.replace(/\/+$/,"")}
function etUrlSetzen(u){u=String(u||"").trim().replace(/\/+$/,"");if(u&&!/^https?:\/\//i.test(u))u="http://"+u;try{if(u)localStorage.setItem(ET_KEY,u);else localStorage.removeItem(ET_KEY)}catch(e){}return u}
const etMixed=u=>location.protocol==="https:"&&/^http:/i.test(u);
async function etTest(u){if(!u)throw new Error("Keine Adresse eingetragen");if(etMixed(u))throw new Error("Diese Seite läuft über https, der Etikett-Leser über http. Das blockiert der Browser. Etikett-Leser per https erreichbar machen (Synology-Reverse-Proxy) oder das Lager über http öffnen.");
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),5000);try{const r=await fetch(u+"/",{signal:ctl.signal});const d=await r.json();if(!d.ok)throw 0;return d}catch(e){throw new Error("Etikett-Leser unter "+u+" nicht erreichbar")}finally{clearTimeout(t)}}

const fwords=s=>String(s||"").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"").split(/[^a-z0-9]+/).filter(Boolean);
const fnorm=s=>fwords(s).join("");
const F_GENERIC=new Set(["filament","formerly","the","and","3d","plus","de","by","mm","kg","g"]);
function fdbIdx(){const d=G.fdb;if(d.fi)return d.fi;
  const bw=d.b.map(b=>({n:fnorm(b),w:fwords(b).filter(w=>!F_GENERIC.has(w))}));
  d.fi=d.c.map((c,i)=>{const l=d.l[c[0]];const bws=new Set(bw[l[0]].w),mat=fnorm(l[1]);const al=fwords(l[8]||"").filter(w=>!F_GENERIC.has(w));
    const lw=[...new Set(fwords(l[2]).filter(w=>!F_GENERIC.has(w)&&w.length>1&&!bws.has(w)&&w!==mat))];
    return {i,b:l[0],lw,al,mat,cw:fwords(c[1]).filter(w=>w.length>1&&!bws.has(w)&&!al.includes(w)),hex:c[2]}});
  d.bw=bw;return d.fi}
function fdbEan(i){const d=G.fdb;if(!d.rev){d.rev={};Object.entries(d.g).forEach(([k,v])=>{const c=d.c[v[0]];const alt=d.rev[v[0]];const gut=v[1]===c[3]&&!v[2];if(!alt||(gut&&!alt.gut))d.rev[v[0]]={k,gut}})}
  const r=d.rev[i];if(!r)return "";return r.k.length<13?r.k.padStart(13,"0"):r.k}
const hexRgb=h=>[1,3,5].map(i=>parseInt(fHex(h).slice(i,i+2),16));
/* Farbabstand in Lab, Helligkeit schwächer gewichtet: Fotos sind oft dunkler oder heller als die Herstellerfarbe */
function hexLab(h){const [r,g,b]=hexRgb(h).map(v=>{v/=255;return v>.04045?((v+.055)/1.055)**2.4:v/12.92});
  const f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;const x=f((r*.4124+g*.3576+b*.1805)/.95047),y=f(r*.2126+g*.7152+b*.0722),z=f((r*.0193+g*.1192+b*.9505)/1.08883);
  return [116*y-16,500*(x-y),200*(y-z)]}
const farbAbst=(a,b)=>{const u=hexLab(a),v=hexLab(b);return Math.sqrt(((u[0]-v[0])*.3)**2+(u[1]-v[1])**2+(u[2]-v[2])**2)*2.2};
function fotoWoerter(f){const roh=(f.text||[]).map(x=>x.t);const W=new Set();
  roh.forEach(t=>{fwords(t).forEach(w=>W.add(w));fwords(String(t).replace(/([a-z])([A-Z])/g,"$1 $2").replace(/([A-Z]+)([A-Z][a-z])/g,"$1 $2")).forEach(w=>W.add(w))});
  return {W,T:roh.map(fnorm).join(" ")}}
function fotoTreffer(f){const d=G.fdb;const out={db:[],lager:[]};if(!d)return out;const idx=fdbIdx();const {W,T}=fotoWoerter(f);
  const has=w=>W.has(w)||(w.length>=4&&T.includes(w));
  /* Barcode direkt */
  const vorne=[];(f.codes||[]).forEach(c=>{const x=d.g[fdbCodeKey(c)];if(x&&!vorne.includes(x[0]))vorne.push(x[0])});
  const marken=new Set();d.bw.forEach((b,i)=>{if(b.n.length>=4?T.includes(b.n):(b.n.length>=2&&W.has(b.n)))marken.add(i)});
  const sc=[];const leer=!W.size&&!f.hex;
  const mNorm=new Set([...marken].map(i=>d.bw[i].n));
  if(!leer)idx.forEach(e=>{let s=0;const bh=marken.has(e.b)||e.al.some(w=>mNorm.has(w));if(marken.size&&!bh)return;if(bh)s+=6;
    let lh=0;[...e.lw,...e.al.filter(w=>!mNorm.has(w))].forEach(w=>{if(has(w))lh++});s+=lh*3;if(e.lw.length&&e.lw.every(has))s+=2;if(e.mat&&has(e.mat))s+=1;
    if(e.cw.length){const n=e.cw.filter(has).length;s+=n===e.cw.length?5+n:n}
    if(f.hex)s+=8*Math.max(0,1-farbAbst(e.hex,f.hex)/200);
    if(marken.size?s>=7:(lh>=1&&s>=6))sc.push([s,e.i])});
  out.marke=marken.size>0||vorne.length>0;sc.sort((a,b)=>b[0]-a[0]);out.db=[...vorne,...sc.map(x=>x[1]).filter(i=>!vorne.includes(i))].slice(0,14);
  /* eigenes Lager */
  const top=out.db.slice(0,5).map(i=>fdbK(i)).filter(Boolean);
  out.lager=entries().map(e=>{if((f.codes||[]).some(c=>e.codes.includes(c)))return [100,e];
      let s=0;const hw=fwords(e.hersteller);if(hw.length&&hw.every(has))s+=6;else if(top.some(k=>fnorm(k.hersteller)===fnorm(e.hersteller)))s+=4;
      if(has(fnorm(e.material)))s+=1;const fw=fwords(e.farbe);if(fw.length&&fw.every(has))s+=5;(e.besonderheiten||[]).forEach(b=>{if(has(fnorm(b)))s+=1});
      if(top.some(k=>fnorm(k.hersteller)===fnorm(e.hersteller)&&fnorm(k.material)===fnorm(e.material)&&fnorm(k.farbe)===fnorm(e.farbe)))s+=8;
      if(f.hex)s+=6*Math.max(0,1-farbAbst(e.hex,f.hex)/220);return [s,e]})
    .filter(x=>x[0]>=10).sort((a,b)=>b[0]-a[0]).slice(0,4).map(x=>x[1]);
  return out}

/* Bild laden, verkleinern */
function bildLaden(file){return new Promise((ok,err)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const m=1600,s=Math.min(1,m/Math.max(im.naturalWidth,im.naturalHeight));
    const cv=document.createElement("canvas");cv.width=Math.round(im.naturalWidth*s);cv.height=Math.round(im.naturalHeight*s);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);ok(cv)};
  im.onerror=()=>{URL.revokeObjectURL(u);err(new Error("Bild ließ sich nicht öffnen"))};im.src=u})}
const cvBlob=cv=>new Promise(ok=>cv.toBlob(b=>ok(b),"image/jpeg",.88));
async function browserCodes(cv){try{if("BarcodeDetector" in window){const r=await new BarcodeDetector().detect(cv);if(r&&r.length)return r.map(x=>x.rawValue).filter(Boolean)}}catch(e){}
  try{const m=await import("https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm");const r=new m.BrowserMultiFormatReader().decodeFromCanvas(cv);const t=r&&r.getText();if(t)return [t]}catch(e){}return []}
function farbeAn(cv,x,y){const r=Math.max(3,Math.round(Math.min(cv.width,cv.height)/80));const g=cv.getContext("2d",{willReadFrequently:true});
  const x0=Math.max(0,Math.round(x-r)),y0=Math.max(0,Math.round(y-r));const p=g.getImageData(x0,y0,Math.min(cv.width-x0,2*r),Math.min(cv.height-y0,2*r)).data;const ch=[[],[],[]];
  for(let i=0;i<p.length;i+=4){ch[0].push(p[i]);ch[1].push(p[i+1]);ch[2].push(p[i+2])}const med=a=>{a.sort((u,v)=>u-v);return a[a.length>>1]||0};
  return "#"+ch.map(med).map(v=>v.toString(16).padStart(2,"0")).join("")}

G.fotos=[];
function fotoWahl(){const i=document.createElement("input");i.type="file";i.accept="image/*";i.multiple=true;i.style.display="none";document.body.appendChild(i);
  i.addEventListener("change",()=>{const fs=[...i.files];i.remove();if(fs.length)fotoVerarbeiten(fs)});i.click()}
async function fotoVerarbeiten(files){G.fotos=files.slice(0,40).map((file,id)=>({id,file,status:"wartet",text:[],codes:[],hex:"",done:false}));fotoListe();
  try{await fdbLaden()}catch(e){}const url=etUrl();let etFehler="";
  for(const f of G.fotos){f.status="liest";fotoListeAuffrischen();
    try{f.cv=await bildLaden(f.file);const t=document.createElement("canvas");const s=Math.min(1,240/Math.max(f.cv.width,f.cv.height));t.width=Math.round(f.cv.width*s);t.height=Math.round(f.cv.height*s);t.getContext("2d").drawImage(f.cv,0,0,t.width,t.height);f.thumb=t.toDataURL("image/jpeg",.8);
      if(url&&!etFehler){try{if(etMixed(url))throw new Error("https/http");const r=await fetch(url+"/lesen",{method:"POST",headers:{"Content-Type":"image/jpeg"},body:await cvBlob(f.cv)});const d=await r.json();if(!r.ok)throw new Error(d.fehler||"Fehler "+r.status);f.text=d.text||[];f.codes=d.codes||[]}
        catch(e){etFehler=etMixed(url)?"Die Seite läuft über https, der Etikett-Leser über http. Das blockiert der Browser.":"Etikett-Leser nicht erreichbar ("+url+")."}}
      if(!f.codes.length)f.codes=await browserCodes(f.cv);
      f.tr=fotoTreffer(f);f.status="fertig"}catch(e){f.status="fehler";f.fehler=e.message||String(e)}
    f.etFehler=etFehler;fotoListeAuffrischen()}
  G.fotoEtFehler=etFehler||(url?"":"kein");if(G.fotos.length===1&&G.fotos[0].status==="fertig")fotoModal(0);else fotoListe()}
function fotoName(f){if(!f)return "";if(f.status==="liest"||f.status==="wartet")return "wird gelesen …";if(f.status==="fehler")return f.fehler||"Fehler";
  const e=f.tr&&f.tr.lager[0];if(e)return summary(e)+" (im Lager)";const i=f.tr&&f.tr.db[0];if(i!=null){const k=fdbK(i);if(!k)return "";if(f.codes.length||f.hex)return `${k.hersteller} ${k.linie} · ${k.farbe}`;return f.tr.marke?`${k.hersteller} · Farbe im Foto antippen`:"Marke nicht lesbar · Foto öffnen"}
  return f.codes.length?"Code "+f.codes[0]:"Nichts erkannt, bitte suchen"}
function fotoListeHtml(){return G.fotos.map(f=>`<div class="lgr lgfrow" data-act="lgFotoOpen" data-id="${f.id}">${f.thumb?`<img class="lgfthumb" src="${f.thumb}" alt="">`:`<div class="lgfthumb"></div>`}<div style="min-width:0"><div class="lgn">${esc(fotoName(f))}</div><div class="lgs">${esc([f.codes.length?"Barcode "+f.codes[0]:"",f.tr&&f.tr.db.length>1?f.tr.db.length+" Vorschläge":""].filter(Boolean).join(" · "))}</div></div><div class="lgrt">${f.done?`<span class="lgsrc" style="color:var(--good)">✓ erledigt</span>`:f.status==="liest"?`<span class="lgsrc">…</span>`:""}</div></div>`).join("")}

    `<button class="btn ghost" data-act="lgFoto">${CAMI} Weitere Fotos</button><span class="sp"></span><button class="btn pri" data-act="close">Fertig</button>`)}

  f.hex=farbeAn(f.cv,x,y);f.tr=fotoTreffer(f);const dot=document.getElementById("lgfdot");if(dot){dot.hidden=false;dot.style.left=(ev.clientX-r.left)+"px";dot.style.top=(ev.clientY-r.top)+"px";dot.style.background=f.hex}

/* Kamera im Browser: BarcodeDetector, sonst ZXing */
let cam={on:false,token:0,stream:null,timer:null,zx:null,watch:null};
const camMsg=t=>{const m=document.getElementById("lgsmsg");if(m)m.textContent=t};
function camStop(){cam.on=false;cam.token++;clearTimeout(cam.timer);clearInterval(cam.watch);cam.timer=null;cam.watch=null;
  if(cam.zx){try{cam.zx.stop()}catch(e){}cam.zx=null}if(cam.stream){cam.stream.getTracks().forEach(t=>t.stop());cam.stream=null}}
async function camStart(onHit){
  const v=document.getElementById("lgvid");if(!v)return;camStop();cam.on=true;const token=cam.token;
  const alive=()=>cam.on&&token===cam.token&&document.getElementById("lgvid")===v;
  cam.watch=setInterval(()=>{if(!alive())camStop()},400);
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camMsg("Die Kamera ist hier nicht verfügbar (nur über https). Code bitte unten eintippen.");camStop();return}
  try{
    if("BarcodeDetector" in window){
      cam.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
      if(!alive())return camStop();v.srcObject=cam.stream;await v.play();
      const det=new window.BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39","qr_code","data_matrix"]});camMsg("Suche Code …");
      const loop=async()=>{if(!alive())return;try{const r=await det.detect(v);if(r&&r.length)onHit(r[0].rawValue)}catch(e){}if(cam.on&&token===cam.token)cam.timer=setTimeout(loop,250)};loop();
    }else{
      camMsg("Lade Scanner …");const m=await import("https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm");if(!alive())return camStop();
      const reader=new m.BrowserMultiFormatReader();camMsg("Suche Code …");
      cam.zx=await reader.decodeFromConstraints({video:{facingMode:"environment"},audio:false},v,res=>{if(res&&alive())onHit(res.getText())});
      if(!alive())camStop();
    }
  }catch(e){camMsg(/import|fetch/i.test(String(e&&e.message))?"Der Scanner konnte nicht geladen werden (keine Internetverbindung?). Code bitte unten eintippen.":"Kamera nicht nutzbar: "+(e.message||e.name||e)+". Code bitte unten eintippen.");camStop()}}

/* Scanner der Home-Assistant-App (iPhone/Android) */
function extern(){const h=window.__hass;const x=h&&h.auth&&h.auth.external;return x&&x.config&&x.config.hasBarCodeScanner&&typeof x.fireMessage==="function"?x:null}
function busWin(){try{if(window.parent&&window.parent!==window&&window.parent.document)return window.parent}catch(e){}return window}
function nativScan(titel,text,alt,onCode,onAbort){
  const ext=extern(),W=busWin(),orig=W.externalBus;let fertig=false;
  const restore=()=>{if(!fertig){fertig=true;if(W.externalBus===hook)W.externalBus=orig}};
  const hook=msg=>{let m=msg;try{if(typeof m==="string")m=JSON.parse(m)}catch(e){}
    if(m&&m.type==="command"&&(m.command==="bar_code/scan_result"||m.command==="bar_code/aborted")){
      try{ext.fireMessage({id:m.id,type:"result",success:true,result:null})}catch(e){}restore();
      if(m.command==="bar_code/scan_result"){try{ext.fireMessage({type:"bar_code/close"})}catch(e){}onCode(m.payload&&m.payload.rawValue)}
      else onAbort(m.payload&&m.payload.reason);return}
    return typeof orig==="function"?orig(msg):undefined};
  W.externalBus=hook;
  try{ext.fireMessage({type:"bar_code/scan",payload:{title:titel,description:text,alternative_option_label:alt}})}catch(e){restore();return false}
  return true}

function serieStart(){fdbVorladen();G.serieAktiv=true;G.serieLetzt="";G.serieZuletzt=null;if(extern())return serieNativ();scanModal(true)}
function serieAdd(raw,vonHand){const code=String(raw||"").trim();if(!code)return null;const jetzt=Date.now();
  if(!vonHand&&G.serieZuletzt&&G.serieZuletzt.code===code&&jetzt-G.serieZuletzt.t<3000){G.serieZuletzt.t=jetzt;return null}
  G.serieZuletzt={code,t:jetzt};let x=G.serie.find(y=>y.code===code);if(x)x.n+=1;else{x={code,n:1};G.serie.push(x)}serieSichern();brumm();
  const e=codeSorte(code),k=kBekannt(code);const nm=e?summary(e):k?summary(k)+" (neu)":"Unbekannter Code "+code;
  G.serieLetzt=`Zuletzt: ${nm} · ${x.n}× · insgesamt ${serieSumme()}`;G.serieInfo={name:nm,n:x.n,bekannt:!!e};
  const a=document.getElementById("lgletzt"),c=document.getElementById("lgscount");if(a)a.textContent=G.serieLetzt;if(c)c.textContent=serieSumme();
  const fl=document.getElementById("lgflash"),cm=document.getElementById("lgcam");
  if(fl){fl.className="lgflash "+(e?"ok":"neu");fl.innerHTML=(e?"✓ Bekannt, Code erfasst":"NEU, zur Seite legen")+`<small>${esc(nm)} · ${x.n}×</small>`}
  if(cm){cm.classList.remove("ok","neu");cm.classList.add(e?"ok":"neu")}
  clearTimeout(G.blinkT);G.blinkT=setTimeout(()=>{const f2=document.getElementById("lgflash"),c2=document.getElementById("lgcam");if(f2){f2.className="lgflash";f2.textContent="Bereit für den nächsten Karton"}if(c2)c2.classList.remove("ok","neu")},3000);
  draw(0);return G.serieLetzt}
function serieNativ(){
  const ende=()=>{G.serieAktiv=false;clearTimeout(G.reopenT);G.serie.length?serieModal():closeModal();draw(0)};
  const ok=nativScan("Serienscan","Einen Karton nach dem anderen scannen. Zum Schluss schließen oder „Fertig“ tippen.","Fertig, Liste zeigen",c=>{
    const t=serieAdd(c,true);if(!t)return serieNativ();serieBlitz()},()=>ende());

async function serieUebernehmen(codes){const {bekannt}=serieGruppen();const je={};

  try{for(const j of Object.values(je)){await write(j.e,{spulen:Math.max(0,j.e.spulen)+j.n,refills:j.e.refills+j.rf});j.codes.forEach(c=>serieWeg(c))}}
  catch(err){msg("Speichern fehlgeschlagen: "+(err.message||err));return}

const amsName=n=>Number(n)>=128?"AMS HT "+(Number(n)-127):"AMS "+("ABCDEFGH"[Number(n)-1]||n);
const normPre=p=>{const t=String(p).split("_");return t.length>2&&t[0]===t[1]?t.slice(1).join("_"):p};
function druckerNr(prefix){const p=normPre(prefix).split("_").slice(0,2).join("_");const name=druckerName(p);const m=p.split("_")[0];
  const alle=[...new Set(Object.keys(states()).map(id=>{const x=id.match(/^sensor\.(.+?)_ams_\d+_(luftfeuchtigkeit|humidity)/);return x?normPre(x[1]).split("_").slice(0,2).join("_"):null}).filter(x=>x&&x.split("_")[0]===m))].sort();

function amsFeuchte(){const st=states();return Object.keys(st).map(id=>({id,m:id.match(/^sensor\.(.+)_ams_(\d+)_(luftfeuchtigkeit|humidity)(?:_\d+)?$/)})).filter(x=>x.m).map(({id,m})=>{
  const v=fNum(st[id].state),key=m[1]+"_ams_"+m[2];const tid=["trocknen","drying"].map(s=>`binary_sensor.${key}_${s}`).find(x=>st[x])||null;
  const pre=normPre(m[1]).split("_").slice(0,2).join("_");return {id,key,tid,prefix:pre,drucker:druckerNr(m[1]),nr:Number(m[2]),name:amsName(m[2]),wert:v==null?null:Math.round(v)}})
  .sort((a,b)=>a.drucker.localeCompare(b.drucker,"de")||a.prefix.localeCompare(b.prefix)||a.nr-b.nr)}
const silicaItem=()=>G.meta.find(i=>desc(i).typ==="silica_plus")||null;

const fStufe=(v,e)=>v==null?"na":v<e.feuchte_gruen?"ok":v<e.feuchte_warnung?"mid":"hi";
const komma=(v,n=1)=>Number(v).toLocaleString("de-DE",{maximumFractionDigits:n});
const plusMinus=d=>d===0?"±0 %":(d>0?"+":"−")+Math.abs(d)+" %";
function datumTage(z){const d=new Date(z);if(isNaN(d))return "";const h=new Date();const t=Math.round((new Date(h.getFullYear(),h.getMonth(),h.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);
  return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit"})+" · "+(t<=0?"heute":t===1?"gestern":"vor "+t+" Tagen")}
function trockner(f){if(!f.tid)return null;const st=states();const g=n=>{for(const s of n){const x=st[`sensor.${f.key}_${s}`];if(x&&!["unknown","unavailable",""].includes(String(x.state)))return x.state}return null};
  return {an:st[f.tid].state==="on",rest:fNum(g(["verbleibende_trocknungszeit","remaining_drying_time"])),temp:g(["trocknungstemperatur","drying_temperature"]),fil:g(["trocknendes_filament","drying_filament"]),dauer:g(["trocknungsdauer","drying_duration"])}}
const laufText=(fil,temp,dauer)=>{const t=[fil,temp!=null&&temp!==""?komma(temp,0)+" °C":"",dauer!=null&&dauer!==""?komma(dauer)+" h":""].filter(Boolean);return t.length?` (${t.join(", ")})`:""};
function silicaVerlauf(f,x,e){const st=(G.sStats||{})[f.key];let tief=st&&st.tief!=null?st.tief:null,tiefZeit=st?st.zeit:null;
  if(f.wert!=null&&(tief==null||f.wert<=tief)){tief=f.wert;tiefZeit=Date.now()}
  if(tief==null)return f.wert==null?" · Drucker aus":"";
  const tr=x.art==="trocknung";const std=(Date.now()-new Date(x.zeit).getTime())/36e5,phase=tr?e.silica_nachlauf_h:e.silica_trocknung_h;
  const dat=z=>new Date(z).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});
  if(std<phase){const rest=Math.max(1,Math.round(phase-std)),wort=tr?"kühlt ab":"trocknet";const start=x.feuchte!=null?x.feuchte+" % → ":"";
    if(f.wert==null)return ` · ${wort}, bisher tiefster Wert ${tief} % · Drucker aus`;
    if(f.wert<=tief)return ` · ${wort}: ${start}${f.wert} %, fällt noch (noch ca. ${rest} h)`;
    return ` · ${wort}: ${start}${f.wert} % · Tiefpunkt bisher ${tief} %, steigt wieder (noch ca. ${rest} h)`}
  const trocken=x.feuchte!=null?` (von ${x.feuchte} %)`:"";
  if(f.wert==null)return ` · Tiefpunkt ${tief} %${trocken} am ${dat(tiefZeit)} · Drucker aus`;
  return ` · Tiefpunkt ${tief} %${trocken} am ${dat(tiefZeit)} · seitdem ${plusMinus(f.wert-tief)}`}
const ws=m=>window.__hass&&window.__hass.callWS?window.__hass.callWS(m):Promise.reject(new Error("keine Verbindung"));
async function trockenLaeufe(feu){const st=states(),ids=[];const extra={fil:["trocknendes_filament","drying_filament"],temp:["trocknungstemperatur","drying_temperature"],dauer:["trocknungsdauer","drying_duration"]};
  const eid=(f,n)=>n.map(s=>`sensor.${f.key}_${s}`).find(x=>st[x])||null;
  feu.forEach(f=>{ids.push(f.tid,f.id);Object.keys(extra).forEach(k=>{const x=eid(f,extra[k]);if(x)ids.push(x)})});
  const r=await ws({type:"history/history_during_period",start_time:new Date(Date.now()-30*864e5).toISOString(),entity_ids:ids,minimal_response:true,no_attributes:true,significant_changes_only:false});
  const pts=id=>((r&&id&&r[id])||[]).map(p=>({s:String(p.s??p.state??""),t:p.lc!=null?p.lc*1000:p.lu!=null?p.lu*1000:new Date(p.last_changed||p.last_updated).getTime()})).sort((a,b)=>a.t-b.t);
  const out={};feu.forEach(f=>{let an=null,lauf=null;pts(f.tid).forEach(p=>{if(p.s==="on"){if(an==null)an=p.t}else if(p.s==="off"&&an!=null){lauf={start:an,ende:p.t};an=null}});if(!lauf)return;
    let vorher=null;pts(f.id).forEach(p=>{const n=fNum(p.s);if(p.t<=lauf.start&&n!=null)vorher=Math.round(n)});
    const imLauf=id=>{let v=null;pts(id).forEach(p=>{if(p.t>=lauf.start-120000&&p.t<=lauf.ende&&!["unknown","unavailable",""].includes(p.s))v=p.s});return v};
    out[f.key]=Object.assign({},lauf,{feuchte:vorher,fil:imLauf(eid(f,extra.fil)),temp:imLauf(eid(f,extra.temp)),dauer:imLauf(eid(f,extra.dauer))})});return out}
async function silicaStatsLaden(force){if(G.sLaden)return;const w=silica(),sig=JSON.stringify(w);
  if(!force&&G.sStatsSig===sig&&Date.now()-(G.sStatsAt||0)<600000)return;G.sLaden=true;
  try{const tfeu=amsFeuchte().filter(f=>f.tid);
    if(tfeu.length){try{const runs=await trockenLaeufe(tfeu),w2=Object.assign({},w);let neu=false;
      Object.keys(runs).forEach(k=>{const r=runs[k],alt=w2[k],altT=alt&&alt.zeit?new Date(alt.zeit).getTime():0;if(altT>=r.ende-60000)return;
        w2[k]={zeit:new Date(r.ende).toISOString(),feuchte:r.feuchte,art:"trocknung",start:new Date(r.start).toISOString(),filament:r.fil||"",temp:fNum(r.temp),dauer:fNum(r.dauer)};neu=true});
      if(neu){await silicaSpeichern(w2);return}}catch(x){}}
    const feu=amsFeuchte().filter(f=>w[f.key]&&w[f.key].zeit);const neu={};
    await Promise.all(feu.map(async f=>{const r=await ws({type:"recorder/statistics_during_period",start_time:new Date(w[f.key].zeit).toISOString(),statistic_ids:[f.id],period:"hour",types:["min"]});
      let tief=null,zeit=null;((r&&r[f.id])||[]).forEach(p=>{const m=fNum(p.min);if(m!=null&&(tief==null||m<tief)){tief=Math.round(m);zeit=new Date(p.start).getTime()}});neu[f.key]={tief,zeit}}));

  if(a==="lgEtSave"){const i=document.getElementById("lgeturl");const u=etUrlSetzen(i?i.value:"");try{const d=await etTest(u);toast("Etikett-Leser verbunden (Version "+d.version+")");G.fotoEtFehler="";if(G.fotos.length)fotoVerarbeiten(G.fotos.map(x=>x.file))}catch(err){toast(err.message)}return}
  if(a==="lgSerie"){serieStart();return}

  if(a==="lgSerieEnde"){clearTimeout(G.reopenT);G.serieAktiv=false;camStop();if(G.serie.length)serieModal();else{closeModal();draw(0)}return}
  if(a==="lgCodeOk"){const t=document.getElementById("lgctxt");const v=t?t.value.replace(/\s+/g,""):"";if(!v)return;if(G.serieAktiv){serieAdd(v,true);t.value="";return}onCode(v);return}
  if(a==="lgHitEdit"){const x=entries().find(y=>G.hit&&y.uid===G.hit.uid);if(x)formModal(x);return}
  if(a==="lgHitPlus"){const x=entries().find(y=>G.hit&&y.uid===G.hit.uid);if(!x)return;const ref=x.codes_refill.includes(G.hit.code);
    try{await write(x,{spulen:Math.max(0,x.spulen)+1,refills:x.refills+(ref?1:0)});closeModal();toast(`${ref?"Refill":"Spule"} dazugezählt: ${summary(x)}`)}catch(err){msg("Speichern fehlgeschlagen: "+(err.message||err))}return}
  if(a==="lgNcDb"){const n=G.neu;const k=fdbK(+b.dataset.i);if(!n||!k)return;const rb=document.getElementById("lgncref");const refill=(rb&&rb.checked)||k.ausfuehrung==="refill";
    formModal(null,Object.assign({},k,{besonderheiten:[...k.besonderheiten],codes:[n.code],codes_refill:refill?[n.code]:[],spulen:n.anzahl,refills:refill?n.anzahl:0,serieCode:n.serie?n.code:undefined,

  if(a==="lgNcNeu"){const n=G.neu;if(!n)return;const rb=document.getElementById("lgncref");const refill=rb?rb.checked:n.refill;const k=n.k||{};
    formModal(null,Object.assign({},k,{besonderheiten:[...(k.besonderheiten||[])],codes:[n.code],codes_refill:refill?[n.code]:[],spulen:n.anzahl,refills:refill?n.anzahl:0,serieCode:n.serie?n.code:undefined,

  if(a==="lgNcPick"){const n=G.neu;const x=entries().find(y=>y.uid===b.dataset.uid);if(!n||!x)return;const rb=document.getElementById("lgncref");const refill=rb?rb.checked:n.refill;
    const anz=n.anzahl||1,art=refill?(anz===1?"Refill":"Refills"):(anz===1?"Rolle":"Rollen");
    confirmBox(`Code ${n.code} bei „${summary(x)}“ speichern und ${anz} ${art} dazuzählen?`,"Speichern",async()=>{

        toast("Code gespeichert, "+anz+" "+art+" dazugezählt");if(n.serie){serieWeg(n.code);setTimeout(()=>serieModal(),250)}draw(0)}catch(err){toast("Speichern fehlgeschlagen")}});return}
  if(a==="lgSrPlus"||a==="lgSrMinus"){const x=G.serie.find(y=>y.code===b.dataset.c);if(x){x.n=Math.max(1,x.n+(a==="lgSrPlus"?1:-1));serieSichern()}serieModal();return}
  if(a==="lgSrOk"){await serieUebernehmen([b.dataset.c]);return}
  if(a==="lgSrAlle"){await serieUebernehmen(serieGruppen().bekannt.map(x=>x.code));return}
  if(a==="lgSrNeu"){const x=G.serie.find(y=>y.code===b.dataset.c);if(x)neuModal(x.code,x.n,true);return}
  if(a==="lgSrWeg"){serieWeg(b.dataset.c);serieModal();draw(0);return}
  if(a==="lgSrWegUnb"){const unb=serieGruppen().unbekannt;if(!unb.length)return;confirmBox(`${plural(unb.length,"unbekannten Code","unbekannte Codes")} verwerfen?`,"Verwerfen",()=>{unb.forEach(x=>serieWeg(x.code));serieModal();draw(0)});return}
  if(a==="lgSrLeer"){confirmBox("Ganze Serienscan-Liste verwerfen? Es wird nichts übernommen.","Verwerfen",()=>{G.serie=[];serieSichern();toast("Liste verworfen");draw(0)});return}
  if(a==="lgEdit"){const x=entries().find(y=>y.uid===b.dataset.uid);if(x)formModal(x);return}
  if(a==="lgDot"){const f=collect();f.hex=b.dataset.x;if(!f.farbe||FARBEN.some(([n])=>n===f.farbe))f.farbe=b.dataset.n;const hx=document.getElementById("lf_hex"),fn=document.getElementById("lf_f");if(hx)hx.value=f.hex;if(fn)fn.value=f.farbe;
    document.querySelectorAll(".lgdots button").forEach(x=>x.classList.toggle("on",x===b));return}
  if(a==="lgBes"){const f=G.form;const v=b.dataset.b,i=f.besonderheiten.indexOf(v);if(i>=0)f.besonderheiten.splice(i,1);else f.besonderheiten.push(v);b.classList.toggle("on",i<0);return}
  if(a==="lgCode"){const f=collect();const c=b.dataset.c;f.codes=f.codes.filter(x=>x!==c);f.codes_refill=f.codes_refill.filter(x=>x!==c);b.closest(".chip").remove();return}
  if(a==="lgSave"){const f=collect();await save(f);return}
  if(a==="lgPlus"){const f=collect();f.spulen=(f.spulen||0)+1;await save(f);return}
  if(a==="lgMinus"){const f=collect();const n=f.spulen||0;const rs=fReste(f.reste,Number(f.gewicht));const voll=n-rs.length;
    if(!rs.length||(rs.length===1&&voll<=0)){f.spulen=Math.max(0,n-1);f.reste=[];await save(f);return}
    const box=document.getElementById("lf_ask");if(box)box.innerHTML=`<div class="lgask"><b>Welche Rolle nimmst du raus?</b><div class="lghint">Bestand: ${n} Rollen, ${voll} voll, ${rs.length} angebrochen (${rs.map(r=>r+" g").join(", ")}).</div>
      <div class="row" style="flex-wrap:wrap">${voll>0?`<button class="btn sm" data-act="lgMinusVoll">Volle Rolle rausnehmen</button>`:""}${rs.map((r,i)=>`<button class="btn sm danger" data-act="lgMinusRest" data-i="${i}">Rest ${r} g ist leer</button>`).join("")}</div></div>`;return}
  if(a==="lgMinusVoll"||a==="lgMinusRest"){const f=collect();f.spulen=Math.max(0,(f.spulen||0)-1);if(a==="lgMinusRest"){const rs=fReste(f.reste,Number(f.gewicht));rs.splice(Number(b.dataset.i),1);f.reste=rs}await save(f);return}
  if(a==="lgCopy"){const f=collect();closeModal();formModal(null,Object.assign({},f,{uid:null,raw:{},codes:[],codes_refill:[],spulen:1,refills:0,reste:[],besonderheiten:[...f.besonderheiten],hinweis:`Kopie von „${summary(f)}“. Farbe, Gewicht usw. anpassen und speichern`}));return}
  if(a==="lgDel"){const f=G.form;closeModal();confirmBox(`„${name(f)}“ wirklich löschen?`,"Löschen",async()=>{try{await svc("remove_item",{item:[f.uid]});toast("Gelöscht")}catch(err){toast("Löschen fehlgeschlagen")}});return}

    const patch=abbuchen(x,g0);const mk=document.getElementById("lo_m");if(mk&&mk.checked){patch.bambu_id=o.fid;if(hexOk(o.hex)&&o.hex!=="#888888")patch.ams_farben=[...new Set([...x.ams_farben,o.hex])]}
    try{await write(x,patch);await svc("remove_item",{item:[o.uid]});await logVerbrauch(x,o,g0);closeModal();toast(`${String(g0).replace(".",",")} g von ${name(x)} abgebucht`)}catch(err){msg("Speichern fehlgeschlagen: "+(err.message||err))}return}
  if(a==="lgFzu"){fzuModal(b.dataset.id);return}
  if(a==="lgFneu"){const s=G.fzu;closeModal();if(s)fromSlot(s);return}

    if(x.bambu_id&&x.bambu_id!==s.fid){closeModal();confirmBox(`„${summary(x)}“ hat schon die Bambu-ID ${x.bambu_id}. Durch ${s.fid} aus dem Fach ersetzen?`,"Ersetzen",go)}else await go();return}

/* Handscanner per USB/Bluetooth: er „tippt“ den Code sehr schnell und drückt Enter. Im Lager ohne Klick ins Feld erkennen. */
const HS={buf:"",t0:0,last:0};
document.addEventListener("keydown",e=>{
  if(S.tab!=="lager"||e.ctrlKey||e.metaKey||e.altKey)return;
  const t=e.target;const feld=t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
  if(feld&&!(t.id==="lgq"||t.id==="lgctxt"))return;
  const now=performance.now();
  if(e.key==="Enter"||e.key==="Tab"){const b=HS.buf.trim(),dauer=HS.last-HS.t0;HS.buf="";
    if(b.length>=6&&dauer<=b.length*35){e.preventDefault();e.stopPropagation();
      if(t&&t.id==="lgq"&&t.value.endsWith(b)){t.value=t.value.slice(0,-b.length);G.q=t.value;draw()}
      if(t&&t.id==="lgctxt"&&t.value.endsWith(b))t.value=t.value.slice(0,-b.length);
      if(G.serieAktiv)serieAdd(b,true);else onCode(b)}
    return}
  if(e.key.length!==1)return;
  if(now-HS.last>60){HS.buf="";HS.t0=now}
  HS.buf+=e.key;HS.last=now},true);
/* Für die Creality-Cloud: fertige Drucke im Lager abbuchen (gleiche Logik wie beim Zuordnen von Hand) */
const normMat=x=>String(x||"").toUpperCase().replace(/[\s_-]+/g,"");
const BOOK={ready:()=>!!G.loaded&&(lokal()||!!window.__hass),start:()=>{start()},
  quellen(){const s=new Set();G.items.concat(G.meta||[]).forEach(i=>{const d=desc(i);if(d&&d.quelle)s.add(String(d.quelle))});return s},
  finde(type,hex){const t=normMat(type);if(!t)return null;const l=entries().filter(e=>e.spulen>0&&normMat(e.material)===t);if(!l.length)return null;
    if(!hexOk(hex||""))return l.length===1?l[0]:null;let best=null,bd=1e15;l.forEach(e=>{const d=Math.min(...[e.hex,...e.ams_farben].map(x=>dist(x,hex)));if(d<bd){bd=d;best=e}});return bd<=TOL?best:null},
  abbuchen,write:(e,p)=>write(e,p),log:(e,o,g0)=>logVerbrauch(e,Object.assign({},o,{auto:true}),g0),
  offen:o=>{const gs=String(Math.round(o.gramm*10)/10).replace(".",",");return svc("add_item",{item:`⚠ Nicht zugeordnet: ${gs} g · ${o.drucker} · ${o.ort}`,
    description:JSON.stringify({typ:"offen",v:1,gramm:Math.round(o.gramm*10)/10,drucker:o.drucker,ort:o.ort,fid:"",farbe:o.farbe||"",name:o.name||"",material:o.material||"",grund:o.grund||"",anlass:o.anlass||"",zeit:o.zeit||new Date().toISOString(),quelle:o.quelle||""})})}};
window.LGN={render,onStates,_G:G,besOf,spool,_book:BOOK,_lokPush:()=>{lokPush(ENT);lokPush(META)},scanCode:c=>{start();if(G.serieAktiv)serieAdd(c,true);else onCode(c)},marken:()=>{start();return [...new Set(entries().map(e=>e.hersteller).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"de",{sensitivity:"base"}))},
  einInfo(){start();return {e:einVoll(),ok:!!G.metaOk,meta:metaDa(),sorts:SORTS,zahlen:EIN_ZAHLEN}}};
})();
