<style>
/* Layout: Kopfzeile mit Reitern, darunter zweispaltig – links Eingaben (Auftrag, Teile), rechts klebend das Ergebnis. Mobil einspaltig. Glas-Paneele auf Schwarz wie das HA-Theme. */
:root{
  --bg:#050706;
  --glass:rgba(255,255,255,.045);
  --glass-2:rgba(255,255,255,.075);
  --line:rgba(190,255,215,.10);
  --line-2:rgba(190,255,215,.18);
  --fg:#eef4f0;
  --fg-2:#a9b7ae;
  --fg-3:#6f7d74;
  --accent:#3fd47f;
  --accent-ink:#04140a;
  --accent-soft:rgba(63,212,127,.14);
  --warn:#f2b84b;
  --bad:#ff6b5e;
  --c-mat:#3fd47f;--c-en:#f2b84b;--c-mach:#6aa9ff;--c-lab:#c58bff;--c-fee:#ff8a6b;--c-pkg:#8fa39a;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;--r-s:9px;
  --good:var(--accent);--solid:#0b100d;--header-bg:rgba(5,7,6,.78);--strip:rgba(255,255,255,.06);--sunken:rgba(0,0,0,.35);--track:rgba(255,255,255,.16);
  --body-bg:radial-gradient(1200px 600px at 85% -10%,rgba(63,212,127,.09),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(63,212,127,.05),transparent 60%),var(--bg);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font:15px/1.5 var(--f-body);margin:0;min-height:100vh;
  background:var(--body-bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--header-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em}
.brand svg{width:32px;height:32px;color:var(--accent)}
.mpick{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:6px}.mpick select:only-child{grid-column:1/-1}
.brand small{display:block;font:500 11px/1 var(--f-body);color:var(--fg-3);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
nav.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none;max-width:100%}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:1px solid transparent;border-radius:999px;padding:7px 14px;color:var(--fg-2);cursor:pointer;white-space:nowrap;font-weight:500}
nav.tabs button:hover{color:var(--fg);background:var(--glass)}
nav.tabs button[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-3);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--fg-3)}
.sync.ok i{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.sync.busy i{background:var(--warn)}
.syncs{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
button.sync{background:none;cursor:pointer;font:inherit;font-size:12px;color:var(--fg-3)}
button.sync:hover{color:var(--fg);border-color:var(--line-2)}
.sync.err i{background:var(--bad)}
main{padding-top:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:26px}h2{font-size:18px}h3{font-size:15px}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.muted{color:var(--fg-2)}.dim{color:var(--fg-3)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pad{padding:16px}
.grid-calc{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cols4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12px;color:var(--fg-2)}
input[type=text],input[type=search],input[type=url],input[type=email],select,textarea{width:100%;background:var(--sunken);border:1px solid var(--line-2);border-radius:var(--r-s);padding:9px 11px;outline:none;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--fg-2) 50%),linear-gradient(135deg,var(--fg-2) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
select option{background:var(--solid);color:var(--fg)}
.unit{position:relative}
.unit input{padding-right:42px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.unit em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;color:var(--fg-3);pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--glass-2);border-radius:var(--r-s);padding:9px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--fg)}
.btn:focus-visible,nav.tabs button:focus-visible,.chip:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{color:var(--fg);background:var(--glass)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.icon{padding:7px;width:34px;height:34px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn svg{width:16px;height:16px;flex:none}
.seg{display:flex;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-s);padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;background:none;border:0;border-radius:7px;padding:7px 10px;color:var(--fg-2);cursor:pointer;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--glass-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--sunken);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--fg-2)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.setup{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.part{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:14px;border-top:1px solid var(--line)}
.part:first-child{border-top:0}
.thumb{width:64px;height:64px;border-radius:10px;background:var(--sunken) center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--fg-3)}
.thumb svg{width:26px;height:26px}
.part-head{display:flex;gap:8px;align-items:center}
.part-head input{font-weight:600}
.part-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.mats{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.matline{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px;align-items:end}.matline:has(.matdel){grid-template-columns:minmax(0,1fr) 110px 40px}.matline .matdel{margin-bottom:2px}
.part-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--fg-2);gap:8px;flex-wrap:wrap}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:22px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:30px;height:30px;color:var(--accent)}
.result{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.price{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;letter-spacing:.01em}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.kpi b{display:block;font:500 17px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;margin-top:3px}
.good{color:var(--good)}.bad{color:var(--bad)}.warnc{color:var(--warn)}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--sunken)}
.bar span{display:block;height:100%}
.brk{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:4px 8px;align-items:center;font-size:13px}
.brk .sw{width:10px;height:10px;border-radius:3px}
.brk .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.brk .tot{border-top:1px solid var(--line);padding-top:6px;margin-top:2px;font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
.empty{padding:34px 16px;text-align:center;color:var(--fg-2)}
.empty h3{color:var(--fg);margin-bottom:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pcard{overflow:hidden;display:flex;flex-direction:column}
.pcard .img{aspect-ratio:4/3;max-width:100%;background:var(--sunken) center/cover no-repeat;display:grid;place-items:center;color:var(--fg-3);border-bottom:1px solid var(--line)}
.pcard .img svg{width:40px;height:40px}
.pcard .body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.pcard .acts{display:flex;gap:6px;margin-top:auto;padding-top:6px}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
table.list td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:last-child td{border-bottom:0}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:var(--glass)}
.tscroll{overflow-x:auto}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:999px;padding:3px 9px;border:1px solid currentColor;white-space:nowrap}
.st-angebot{color:#9fb0a6}.st-angenommen{color:#6aa9ff}.st-druck{color:#f2b84b}.st-fertig{color:#c58bff}.st-versendet{color:#5fd0d6}.st-bezahlt{color:#3fd47f}.st-storniert{color:#ff6b5e}
.chart{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.chart .stackb{width:100%;max-width:46px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 2px 2px;overflow:hidden;min-height:2px;background:var(--sunken)}
.chart .stackb i{display:block}
.chart small{font-size:11px;color:var(--fg-3)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(5vh,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));overflow:auto}
.modal{width:min(640px,100%);background:var(--solid);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal .mb{padding:16px;display:flex;flex-direction:column;gap:12px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.pick{display:flex;flex-direction:column;max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.pick button{display:flex;gap:10px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;cursor:pointer}
.pick button:hover{background:var(--glass)}
.pick button:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--solid);border:1px solid var(--accent);color:var(--fg);padding:10px 16px;border-radius:999px;z-index:60;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100vw - 32px)}
.setlist{display:flex;flex-direction:column}
.setrow{display:grid;gap:8px;align-items:end;padding:10px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.sr-pr{grid-template-columns:minmax(120px,1.4fr) repeat(5,minmax(70px,1fr)) 34px}
.sr-mt{grid-template-columns:44px minmax(140px,1.6fr) minmax(80px,.8fr) repeat(2,minmax(80px,1fr)) 34px}
.sr-ch{grid-template-columns:minmax(100px,1.5fr) repeat(2,minmax(70px,1fr)) 34px}
.grid-biz{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.grid-2p{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sec-title{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.note{font-size:13px;color:var(--fg-2);background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.hint{font-size:12px;color:var(--fg-3)}
@media (max-width:980px){.grid-calc,.grid-biz,.grid-2p{grid-template-columns:minmax(0,1fr)}.sr-pr{grid-template-columns:repeat(3,minmax(0,1fr)) 34px}.sr-pr>label:first-child{grid-column:1/-1}.result{position:static}.setup{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){
  .part-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols3,.cols4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .price{font-size:38px}
  nav.tabs{margin-left:0;width:100%}
  .brand{flex:1}
  h1{font-size:22px}
  .part{grid-template-columns:minmax(0,1fr)}
  .part .thumb{display:none}
  .sr-pr{grid-template-columns:repeat(2,minmax(0,1fr))}.sr-mt{grid-template-columns:44px minmax(0,1fr) minmax(0,1fr)}.sr-mt>label:nth-child(n+3){grid-column:auto}.sr-ch{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.sr-ch>label:first-child{grid-column:1/-1}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:400px){.setup,.cols2{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
"use strict";
/* ---------- Hilfen ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const num=v=>{if(typeof v==="number")return isFinite(v)?v:0;const n=parseFloat(String(v??"").replace(/\s/g,"").replace(",","."));return isFinite(n)?n:0};
const r2=v=>Math.round(v*100)/100;
const EUR=new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"});
const eur=v=>EUR.format(r2(v||0));
const N1=new Intl.NumberFormat("de-DE",{maximumFractionDigits:1});
const N0=new Intl.NumberFormat("de-DE",{maximumFractionDigits:0});
const g=v=>v>=1000?N1.format(v/1000)+" kg":N0.format(Math.round(v))+" g";

function calc(q){
  const c=S.cfg;const out={parts:[],material:0,energy:0,machine:0,scrap:0,labor:0,pkg:0,extra:num(q.extra),grams:0,minutes:0,pieces:0};
  for(const p of q.parts){
    const qty=Math.max(1,Math.round(num(p.qty)));const pr=printerOf(p,q);const hours=num(p.time)/60;
    let matCost=0,grams=0;
    p.mats.forEach((m,i)=>{const mt=matOf(m,q);const gg=num(m.g)+(i===0?num(p.purge):0);grams+=gg;matCost+=gg*num(mt.price)/1000});
    const energy=num(p.kwh)>0?num(p.kwh)*num(c.kwh):hours*num(pr.watt)/1000*num(c.kwh);
    const machine=hours*(num(pr.price)/Math.max(1,num(pr.life))+num(pr.maint));
    const raw=matCost+energy+machine;const scrap=raw*num(c.scrap)/100;
    const labor=(num(c.prepMin)+num(c.postMin)*qty)/60*num(c.rate);
    const line={id:p.id,qty,unit:raw+scrap,mat:matCost*qty,energy:energy*qty,machine:machine*qty,scrap:scrap*qty,labor,grams:grams*qty,minutes:num(p.time)*qty};
    line.total=line.mat+line.energy+line.machine+line.scrap+line.labor;
    out.parts.push(line);
    out.material+=line.mat;out.energy+=line.energy;out.machine+=line.machine;out.scrap+=line.scrap;out.labor+=line.labor;out.grams+=line.grams;out.minutes+=line.minutes;out.pieces+=qty;
  }
  out.pkg=q.parts.length?num(c.pkg):0;
  out.cost=out.material+out.energy+out.machine+out.scrap+out.labor+out.pkg+out.extra;
  const ch=byId(c.channels,q.channelId)||{pct:0,fix:0},pay=byId(c.payments,q.paymentId)||{pct:0,fix:0};
  const rate=(num(ch.pct)+num(pay.pct))/100,fixed=num(ch.fix)+num(pay.fix);
  const v=c.vat?num(c.vatRate)/(100+num(c.vatRate)):0;
  const ship=num(q.shipping);
  const target=out.cost*(1+num(q.markup)/100);
  let goods;
  const ov=String(q.override??"").trim();
  if(ov!==""&&num(ov)>0){goods=num(ov);out.manual=true}
  else{const T=(target+ship+fixed)/Math.max(.05,1-rate-v);goods=roundPrice(Math.max(0,T-ship),q.rounding)}
  if(!q.parts.length)goods=0;
  const T=goods+ship;
  out.goods=goods;out.ship=ship;out.total=T;
  out.fees=q.parts.length?T*rate+fixed:0;out.vatAmt=T*v;out.net=T-out.vatAmt;
  out.profit=T-out.fees-out.vatAmt-ship-out.cost;
  out.margin=out.net>0?out.profit/(out.net-0)*100:0;
  out.realMarkup=out.cost>0?out.profit/out.cost*100:0;
  return out;
}
function roundPrice(p,mode){
  if(p<=0)return 0;
  switch(mode){case "10":return Math.ceil(p*10-1e-9)/10;case "50":return Math.ceil(p*2-1e-9)/2;case "100":return Math.ceil(p-1e-9);
    case "90":{const b=Math.ceil(p-0.9-1e-9)+0.9;return b<p-1e-9?b+1:b}
    case "99":{const b=Math.ceil(p-0.99-1e-9)+0.99;return b<p-1e-9?b+1:b}
    default:return r2(p)}
}

/* Ergebnis aktualisieren, ohne den Aufschlag-Regler neu zu bauen (sonst bricht das Ziehen nach dem ersten Schritt ab) */
function patchResult(el,html){
  const old=el.querySelector("#markup");
  if(!old){el.innerHTML=html;return}
  const t=document.createElement("div");t.innerHTML=html;
  const nk=[...t.children],ok=[...el.children];
  const sliderBox=ok.find(c=>c.contains(old));
  nk.forEach((n,i)=>{
    if(n.querySelector("#markup")&&sliderBox){
      const nb=n.querySelector("b"),ob=sliderBox.querySelector("b");if(nb&&ob)ob.textContent=nb.textContent;
      const ns=n.querySelector("#markup");old.disabled=ns.disabled;if(document.activeElement!==old)old.value=ns.value;
      if(ok[i]!==sliderBox)el.insertBefore(sliderBox,ok[i]||null);
      return}
    const o=el.children[i];
    if(o&&o!==sliderBox){if(o.outerHTML!==n.outerHTML&&!o.contains(document.activeElement))o.replaceWith(n)}else el.insertBefore(n,o||null);
  });
  while(el.children.length>nk.length)el.lastElementChild.remove();
}

/* ---------- Datei-Import ---------- */
function parseDur(s){if(!s)return 0;let m=0;const re=/(\d+(?:\.\d+)?)\s*([dhms])/g;let x,found=false;while((x=re.exec(s))){found=true;const v=parseFloat(x[1]);m+={d:1440,h:60,m:1,s:1/60}[x[2]]*v}return found?m:0}
function splitList(s){return String(s||"").split(/[;,]/).map(x=>x.trim()).filter(Boolean)}
function parseGcodeText(t){
  const r={minutes:0,grams:[],lengths:[],types:[],colors:[],densities:[]};let mm;
  if((mm=t.match(/total estimated time:\s*([^;\n]+)/i)))r.minutes=parseDur(mm[1]);
  if(!r.minutes&&(mm=t.match(/estimated printing time \(normal mode\)\s*=\s*([^\n]+)/i)))r.minutes=parseDur(mm[1]);
  if(!r.minutes&&(mm=t.match(/model printing time:\s*([^;\n]+)/i)))r.minutes=parseDur(mm[1]);
  if(!r.minutes&&(mm=t.match(/;\s*TIME:\s*(\d+)/)))r.minutes=parseInt(mm[1])/60;
  if(!r.minutes&&(mm=t.match(/;\s*PRINT\.TIME\s*:\s*(\d+)/i)))r.minutes=parseInt(mm[1])/60;
  if((mm=t.match(/total filament weight \[g\]\s*:\s*([^\n]+)/i)))r.grams=splitList(mm[1]).map(Number);
  else if((mm=t.match(/filament used \[g\]\s*=\s*([^\n]+)/i)))r.grams=splitList(mm[1]).map(Number);
  if((mm=t.match(/filament used \[mm\]\s*=\s*([^\n]+)/i))||(mm=t.match(/total filament length \[mm\]\s*:\s*([^\n]+)/i)))r.lengths=splitList(mm[1]).map(Number);
  else if((mm=t.match(/;\s*Filament used:\s*([\d.,\sm]+)/i)))r.lengths=splitList(mm[1].replace(/m/g,"")).map(v=>Number(v)*1000);
  if((mm=t.match(/;\s*filament_type\s*=\s*([^\n]+)/i)))r.types=splitList(mm[1]);
  if((mm=t.match(/;\s*filament_colou?r\s*=\s*([^\n]+)/i)))r.colors=splitList(mm[1]);
  if((mm=t.match(/;\s*filament_density\s*[=:]\s*([^\n]+)/i)))r.densities=splitList(mm[1]).map(Number);
  if(!r.grams.length&&r.lengths.length){r.grams=r.lengths.map((L,i)=>L*Math.PI*0.875*0.875*(r.densities[i]||1.24)/1000)}
  return r;
}
function gcodeToMats(r){
  const out=[];r.grams.forEach((gg,i)=>{if(!(gg>0))return;out.push({g:r2(gg),type:r.types[i]||r.types[0]||"",color:r.colors[i]||""})});return out;
}
function hexDist(a,b){const p=h=>{h=String(h||"").replace("#","");if(h.length===8)h=h.slice(0,6);if(h.length!==6)return null;return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};const x=p(a),y=p(b);if(!x||!y)return 999;return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])}
function mapMaterial(type,color){
  const tk=typeKey(type);const same=S.cfg.materials.filter(m=>typeKey(m.type)===tk);
  if(!type)return S.quote.matId?"":S.cfg.materials[0]?.id||"";
  if(!same.length)return "";
  if(color){let best=same[0],bd=1e9;same.forEach(m=>{const d=hexDist(m.hex,color);if(d<bd){bd=d;best=m}});return best.id}
  return same[0].id;
}
function matsFromFile(list){
  if(!list.length)return [{matId:"",g:0}];
  return list.map(x=>({matId:mapMaterial(x.type,x.color),g:x.g,label:[x.type,x.color].filter(Boolean).join(" ")||"",color:x.color||""}));
}
async function blobToThumb(blob,max=240){
  return new Promise(res=>{const url=URL.createObjectURL(blob);const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);const x=c.getContext("2d");x.fillStyle="#0b100d";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.78))};img.onerror=()=>{URL.revokeObjectURL(url);res("")};img.src=url});
}
function meshStats(tris){ // tris: Float32Array, 9 Werte je Dreieck
  let vol=0,area=0;
  for(let i=0;i<tris.length;i+=9){const ax=tris[i],ay=tris[i+1],az=tris[i+2],bx=tris[i+3],by=tris[i+4],bz=tris[i+5],cx=tris[i+6],cy=tris[i+7],cz=tris[i+8];
    vol+=(ax*(by*cz-bz*cy)-ay*(bx*cz-bz*cx)+az*(bx*cy-by*cx))/6;
    const ux=bx-ax,uy=by-ay,uz=bz-az,vx=cx-ax,vy=cy-ay,vz=cz-az;area+=Math.hypot(uy*vz-uz*vy,uz*vx-ux*vz,ux*vy-uy*vx)/2}
  return {vol:Math.abs(vol),area};
}
function parseStl(buf){
  const dv=new DataView(buf);
  if(buf.byteLength>84){const n=dv.getUint32(80,true);if(84+n*50===buf.byteLength){const t=new Float32Array(n*9);for(let i=0;i<n;i++){const o=84+i*50+12;for(let j=0;j<9;j++)t[i*9+j]=dv.getFloat32(o+j*4,true)}return meshStats(t)}}
  const txt=new TextDecoder().decode(buf);const v=[...txt.matchAll(/vertex\s+([-\d.eE+]+)\s+([-\d.eE+]+)\s+([-\d.eE+]+)/g)].map(m=>[+m[1],+m[2],+m[3]]);
  const t=new Float32Array(Math.floor(v.length/3)*9);for(let i=0;i+2<v.length;i+=3){t.set([...v[i],...v[i+1],...v[i+2]],(i/3)*9)}return meshStats(t);
}
function estimate(stats,matId){
  const c=S.cfg;const mt=byId(c.materials,matId||S.quote.matId)||c.materials[0]||{density:1.24};const pr=byId(c.printers,S.quote.printerId)||c.printers[0]||{gph:25};
  const vcm=stats.vol/1000;const shell=Math.min(vcm,stats.area*num(c.estWall)/1000);
  const grams=(shell+(vcm-shell)*num(c.estInfill)/100)*num(mt.density||1.24);
  const minutes=grams/Math.max(1,num(pr.gph))*60+8;
  return {grams:r2(grams),minutes:Math.round(minutes)};
}
async function parse3mf(file){
  const zip=await JSZip.loadAsync(file);const base=file.name.replace(/\.gcode\.3mf$|\.3mf$/i,"");
  const parts=[];
  const si=zip.file("Metadata/slice_info.config");
  let plateNames={};
  const ms=zip.file("Metadata/model_settings.config");
  if(ms){try{const d=new DOMParser().parseFromString(await ms.async("string"),"text/xml");$$("plate",d).forEach(pl=>{const md={};$$(":scope>metadata",pl).forEach(e=>md[e.getAttribute("key")]=e.getAttribute("value"));if(md.plater_id)plateNames[md.plater_id]=md.plater_name||""})}catch(e){}}
  if(si){
    const d=new DOMParser().parseFromString(await si.async("string"),"text/xml");
    for(const pl of $$("plate",d)){
      const md={};$$(":scope>metadata",pl).forEach(e=>md[e.getAttribute("key")]=e.getAttribute("value"));
      const idx=md.index||"1";const sec=num(md.prediction);
      let mats=$$("filament",pl).map(f=>({g:r2(num(f.getAttribute("used_g"))),type:f.getAttribute("type")||"",color:(f.getAttribute("color")||"").slice(0,7)})).filter(x=>x.g>0);
      if(!mats.length&&num(md.weight)>0)mats=[{g:r2(num(md.weight)),type:"",color:""}];
      if(!sec&&!mats.length)continue;
      const objs=$$("object",pl).map(o=>o.getAttribute("name")).filter(Boolean);
      const thumbF=zip.file(`Metadata/plate_${idx}.png`)||zip.file(`Metadata/plate_${idx}_small.png`)||zip.file("Metadata/thumbnail.png");
      const thumb=thumbF?await blobToThumb(await thumbF.async("blob")):"";
      const nm=plateNames[idx]||(objs.length===1?objs[0]:"")||base;
      parts.push({name:nm+(($$("plate",d).length>1&&!plateNames[idx])?` · Platte ${idx}`:""),minutes:sec/60,mats,thumb,src:"3MF geslict"});
    }
  }
  if(!parts.length){
    const gf=Object.keys(zip.files).filter(n=>/^Metadata\/plate_\d+\.gcode$/i.test(n));
    for(const n of gf){const t=await zip.file(n).async("string");const r=parseGcodeText(t.slice(0,300000)+"\n"+t.slice(-300000));if(r.minutes||r.grams.length){const idx=n.match(/plate_(\d+)/)[1];const tf=zip.file(`Metadata/plate_${idx}.png`);parts.push({name:base+(gf.length>1?` · Platte ${idx}`:""),minutes:r.minutes,mats:gcodeToMats(r),thumb:tf?await blobToThumb(await tf.async("blob")):"",src:"G-Code"})}}
  }
  if(!parts.length){
    // ungeslict: Volumen aus dem Netz
    const files=Object.keys(zip.files).filter(n=>/\.model$/i.test(n));const objects={};let build=[];
    for(const n of files){
      const d=new DOMParser().parseFromString(await zip.file(n).async("string"),"text/xml");
      const path="/"+n.replace(/^\//,"");
      d.querySelectorAll("object").forEach(o=>{const id=o.getAttribute("id");const mesh=o.getElementsByTagName("mesh")[0];
        if(mesh){const vs=[...mesh.getElementsByTagName("vertex")].map(v=>[+v.getAttribute("x"),+v.getAttribute("y"),+v.getAttribute("z")]);const ts=[...mesh.getElementsByTagName("triangle")];const t=new Float32Array(ts.length*9);ts.forEach((tr,i)=>{const a=vs[+tr.getAttribute("v1")],b=vs[+tr.getAttribute("v2")],c=vs[+tr.getAttribute("v3")];if(a&&b&&c)t.set([...a,...b,...c],i*9)});objects[path+"#"+id]={stats:meshStats(t),name:o.getAttribute("name")}}
        else{const comps=[...o.getElementsByTagName("component")].map(cp=>(cp.getAttribute("p:path")||path)+"#"+cp.getAttribute("objectid"));objects[path+"#"+id]={comps,name:o.getAttribute("name")}}});
      if(/3dmodel\.model$/i.test(n))build=[...d.getElementsByTagName("item")].map(it=>path+"#"+it.getAttribute("objectid"));
    }
    const statOf=(k,depth=0)=>{const o=objects[k]||objects[k.replace(/^\/+/,"/")];if(!o||depth>8)return {vol:0,area:0};if(o.stats)return o.stats;return o.comps.reduce((a,c)=>{const s=statOf(c,depth+1);return {vol:a.vol+s.vol,area:a.area+s.area}},{vol:0,area:0})};
    const tot=build.reduce((a,k)=>{const s=statOf(k);return {vol:a.vol+s.vol,area:a.area+s.area}},{vol:0,area:0});
    if(tot.vol>0){const e=estimate(tot);const tf=zip.file("Metadata/thumbnail.png")||zip.file("Metadata/plate_1.png");parts.push({name:base,minutes:e.minutes,mats:[{g:e.grams,type:"",color:""}],thumb:tf?await blobToThumb(await tf.async("blob")):"",src:"Schätzung aus Modell"})}
  }
  return parts;
}
async function importFiles(files,target="quote"){
  const added=[];
  for(const f of files){
    try{
      const n=f.name.toLowerCase();let parts=[];
      if(n.endsWith(".3mf"))parts=await parse3mf(f);
      else if(n.endsWith(".stl")){const st=parseStl(await f.arrayBuffer());if(st.vol>0){const e=estimate(st);parts=[{name:f.name.replace(/\.stl$/i,""),minutes:e.minutes,mats:[{g:e.grams,type:"",color:""}],src:"Schätzung aus STL"}]}}
      else if(n.endsWith(".bgcode")){toast("Binärer G-Code (.bgcode) wird nicht unterstützt. Exportiere als .gcode.");continue}
      else{const big=f.size>1.2e6;const t=big?(await f.slice(0,600000).text())+"\n"+(await f.slice(Math.max(0,f.size-600000)).text()):await f.text();const r=parseGcodeText(t);if(r.minutes||r.grams.length)parts=[{name:f.name.replace(/\.(gcode|gco)$/i,""),minutes:r.minutes,mats:gcodeToMats(r),src:"G-Code"}]}
      if(!parts.length){toast(`In „${f.name}“ wurden keine Druckdaten gefunden.`);continue}
      for(const p of parts)added.push(newPart({name:p.name,time:Math.round(p.minutes),thumb:p.thumb||"",src:p.src,mats:matsFromFile(p.mats)}));
    }catch(e){console.error(e);toast(`„${f.name}“ konnte nicht gelesen werden.`)}
  }
  if(!added.length)return [];
  if(target==="quote"){S.quote.parts.push(...added);saveDraft();if(S.tab!=="rechner")S.tab="rechner";render();toast(added.length===1?"Teil übernommen":`${added.length} Teile übernommen`)}
  return added;
}

/* ---------- PDF ---------- */
function buildPdf(q){
  const r=calc(q),c=S.cfg;const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4"});
  const L=20,R=190;let y=22;const green=[30,150,85];
  doc.setFont("helvetica","bold");doc.setFontSize(18);doc.text("Angebot",L,y);
  doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(90);
  const co=[c.company.name,...String(c.company.address||"").split("\n"),c.company.email,c.company.phone].filter(Boolean);
  co.forEach((l,i)=>doc.text(l,R,y-4+i*4.2,{align:"right"}));
  y+=8;doc.setTextColor(0);doc.setFontSize(10);
  doc.text(`Angebotsnummer: ${q.no||"Entwurf"}`,L,y);doc.text(`Datum: ${dDE(q.date||today())}`,L,y+5);
  const vu=new Date(q.date||today());vu.setDate(vu.getDate()+num(c.validDays));doc.text(`Gültig bis: ${vu.toLocaleDateString("de-DE")}`,L,y+10);
  if(q.customer){doc.setFont("helvetica","bold");doc.text("Für",120,y);doc.setFont("helvetica","normal");doc.text([q.customer,...String(q.customerAddr||"").split("\n").filter(Boolean)],120,y+5)}
  y=Math.max(y+22,22+co.length*4.2+8);
  if(q.name){doc.setFont("helvetica","bold");doc.setFontSize(12);doc.text(q.name,L,y);y+=7}
  doc.setDrawColor(...green);doc.setLineWidth(.6);doc.line(L,y,R,y);y+=6;
  doc.setFontSize(9);doc.setFont("helvetica","bold");doc.text("Pos.",L,y);doc.text("Bezeichnung",L+12,y);doc.text("Menge",128,y,{align:"right"});doc.text("Einzelpreis",158,y,{align:"right"});doc.text("Gesamt",R,y,{align:"right"});
  y+=3;doc.setDrawColor(200);doc.setLineWidth(.2);doc.line(L,y,R,y);y+=6;doc.setFont("helvetica","normal");
  // Preis anteilig nach Kosten auf die Positionen verteilen
  const base=r.parts.reduce((a,p)=>a+p.total,0)||1;let rest=r.goods;
  r.parts.forEach((p,i)=>{const part=q.parts.find(x=>x.id===p.id);let lineTot=i===r.parts.length-1?rest:r2(r.goods*p.total/base);rest=r2(rest-lineTot);
    const unit=lineTot/p.qty;const mats=part.mats.map(m=>matOf(m,q)).map(m=>m.name).filter((v,j,a)=>a.indexOf(v)===j).join(", ");
    const nameLines=doc.splitTextToSize(part.name||"Teil",95);
    doc.text(String(i+1),L,y);doc.text(nameLines,L+12,y);doc.text(String(p.qty),128,y,{align:"right"});doc.text(eur(unit),158,y,{align:"right"});doc.text(eur(lineTot),R,y,{align:"right"});
    y+=nameLines.length*4.4;doc.setTextColor(120);doc.setFontSize(8);doc.text(`3D-Druck, ${mats}`,L+12,y);doc.setTextColor(0);doc.setFontSize(9);y+=7;
    if(y>250){doc.addPage();y=24}});
  if(r.ship>0){doc.text(String(r.parts.length+1),L,y);doc.text("Versand",L+12,y);doc.text("1",128,y,{align:"right"});doc.text(eur(r.ship),158,y,{align:"right"});doc.text(eur(r.ship),R,y,{align:"right"});y+=8}
  doc.setDrawColor(200);doc.line(110,y,R,y);y+=6;
  if(c.vat){doc.text("Nettobetrag",150,y,{align:"right"});doc.text(eur(r.total-r.vatAmt),R,y,{align:"right"});y+=5;doc.text(`zzgl. ${N0.format(c.vatRate)} % USt`,150,y,{align:"right"});doc.text(eur(r.vatAmt),R,y,{align:"right"});y+=6}
  doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text("Gesamtbetrag",150,y,{align:"right"});doc.text(eur(r.total),R,y,{align:"right"});doc.setFont("helvetica","normal");doc.setFontSize(9);y+=10;
  if(!c.vat){doc.setTextColor(90);doc.text("Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.",L,y);doc.setTextColor(0);y+=7}
  if(q.notes){doc.text(doc.splitTextToSize(q.notes,R-L),L,y);y+=doc.splitTextToSize(q.notes,R-L).length*4.4+4}
  if(c.company.footer){doc.text(doc.splitTextToSize(c.company.footer,R-L),L,y)}
  return doc;
}
async function deliverFile(name,blob){
  if(S.backend==="claude"||(!window.__PW_HA&&window.claude)){
    try{const dl=await window.claude.use("downloads");if(dl){await dl.save({filename:name,data:blob});return}}catch(e){if(e&&e.code==="declined")return}
  }
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>{URL.revokeObjectURL(url)},30000);
}
async function pdfFor(q){if(!window.jspdf){toast("PDF-Modul nicht geladen. Prüfe die Internetverbindung.");return}
  const doc=buildPdf(q);const nm=`Angebot_${q.no||"Entwurf"}_${(q.customer||q.name||"").replace(/[^\wäöüÄÖÜß-]+/g,"_").slice(0,40)}.pdf`.replace(/_+\.pdf$/,".pdf");
  await deliverFile(nm,doc.output("blob"))}

    case "delRow":{const k=b.dataset.list;if(S.cfg[k].length<=1){toast("Mindestens ein Eintrag muss bleiben.");break}S.cfg[k].splice(+b.dataset.i,1);saveCfgSoon();fixRefs();renderSettings($("#main"));break}
    case "lager":await lagerModal();break;
    case "lagerAdd":{const x=S.lager.find(l=>l.uid===b.dataset.uid);if(!x)break;if(S.cfg.materials.some(m=>m.lagerUid===x.uid)){toast("Schon übernommen");break}
      const tk=typeKey(x.type);const td=TYPE_DEFAULTS[tk]||{p:20,d:1.24};
      S.cfg.materials.push({id:uid(),name:x.name,type:x.type||tk,hex:x.hex,price:x.price?r2(x.price/x.weight*1000):td.p,density:td.d,lagerUid:x.uid});saveCfgSoon();drawLager($("#lagerSearch").value);renderSettings($("#main"));toast(`${x.name} übernommen`);break}
    case "exportJson":{const data={app:"SchichtLohn",v:1,exported:new Date().toISOString(),cfg:S.cfg,portfolio:S.portfolio,orders:S.orders};await deliverFile(`SchichtLohn_Backup_${today()}.json`,new Blob([JSON.stringify(data,null,1)],{type:"application/json"}));break}
    case "importJson":$("#backupIn").click();break;
    case "resetCfg":confirmBox("Kosten, Drucker, Materialien, Kanäle und Zahlungsarten auf die Standardwerte zurücksetzen? Portfolio und Aufträge bleiben erhalten.","Zurücksetzen",async()=>{const co=S.cfg.company,no=S.cfg.nextNo;S.cfg=defaultCfg();S.cfg.company=co;S.cfg.nextNo=no;await Store.saveCfg();fixRefs();render();toast("Standardwerte wiederhergestellt")});break;
  }
});
function fixRefs(){const c=S.cfg,q=S.quote;if(!byId(c.printers,q.printerId))q.printerId=c.printers[0].id;if(!byId(c.materials,q.matId))q.matId=c.materials[0].id;if(!byId(c.channels,q.channelId))q.channelId=c.channels[0].id;if(!byId(c.payments,q.paymentId))q.paymentId=c.payments[0].id;
  q.parts.forEach(p=>{if(p.printerId&&!byId(c.printers,p.printerId))p.printerId="";p.mats.forEach(m=>{if(m.matId&&!byId(c.materials,m.matId))m.matId=""})});saveDraft()}

/* Dateien */
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();if((e.key==="Enter"||e.key===" ")&&e.target.id==="drop"){e.preventDefault();$("#fileIn").click()}});
document.addEventListener("click",e=>{if(e.target.closest("#drop")){S._fileTarget="quote";$("#fileIn").click()}});
document.addEventListener("dragover",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d)d.classList.remove("over")});

$("#fileIn").addEventListener("change",async e=>{const files=[...e.target.files];e.target.value="";
  if(S._fileTarget==="portfolio"){const parts=await importFiles(files,"none");for(const p of parts){p.mats=p.mats.map(m=>({matId:m.matId||S.cfg.materials[0].id,g:m.g}));S.portfolio.push(p);await Store.saveItem("p",p)}if(parts.length){render();toast(`${parts.length} Produkt${parts.length>1?"e":""} angelegt`)}S._fileTarget="quote"}
  else await importFiles(files,"quote")});
$("#imgIn").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f||!S._pfEdit)return;S._pfEdit.thumb=await blobToThumb(f,320);const t=$("#pfThumb");if(t){t.style.backgroundImage=`url('${S._pfEdit.thumb}')`;t.innerHTML=""}});
$("#backupIn").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const d=JSON.parse(await f.text());if(!d.cfg||!Array.isArray(d.orders))throw 0;
    confirmBox(`Backup vom ${dDE((d.exported||"").slice(0,10))} einspielen? Es ersetzt Einstellungen, ${d.portfolio?.length||0} Produkte und ${d.orders.length} Aufträge.`,"Einspielen",async()=>{
      if(S.backend==="claude"){for(const p of S.portfolio)await Store.delItem("p",p.id);for(const o of S.orders)await Store.delItem("o",o.id)}
      S.cfg=Object.assign(defaultCfg(),d.cfg);S.portfolio=d.portfolio||[];S.orders=d.orders;await Store.saveAll();fixRefs();render();toast("Backup eingespielt")})}
  catch(err){toast("Das ist keine gültige SchichtLohn-Sicherung.")}});

/* ---------- Start ---------- */
function startTabPref(){const st=(S.cfg&&S.cfg.startTab)||LS.get("starttab")||"lager";return st==="last"?(LS.get("lasttab")||"lager"):st}
async function start(){
  S.cfg=defaultCfg();S.quote=newQuote();S.tab=startTabPref();render();setSync("busy");
  await Store.init();
  try{
    const d=await Store.load();
    if(d.cfg)S.cfg=Object.assign(defaultCfg(),d.cfg);
    S.portfolio=d.portfolio||[];S.orders=d.orders||[];
    if(!d.cfg||Store._migrate)await Store.saveAll();
  }catch(e){console.error(e);toast("Gespeicherte Daten konnten nicht geladen werden.")}
  const dr=LS.get("draft");
  const isExample=dr&&!dr.id&&dr.name==="Beispiel: Wandhalter"&&dr.parts&&dr.parts.length===1&&dr.parts[0].name==="Wandhalter (Beispiel)";
  S.quote=(dr&&dr.parts&&!isExample)?Object.assign(newQuote(),dr):newQuote();
  LS.set("starttab",S.cfg.startTab||"lager");S.tab=startTabPref();
  fixRefs();setSync("ok");render();
  if(window.HAP)HAP.init();
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start);else start();
</script>

<script>
/* ===== Home Assistant: Drucker, AMS, Strom, Auftragsstatus ===== */
(function(){
"use strict";
const CONN_KEY="schichtlohn_haconn";
const ROLE={
  status:/_(druckstatus|print_status)$/, progress:/_(druckfortschritt|print_progress)$/,
  weight:/_(gewicht_des_drucks|print_weight)$/, remaining:/_(verbleibende_zeit|remaining_time)$/,
  start:/_(startzeit|start_time)$/, end:/_(endzeit|end_time)$/, task:/_(name_der_aufgabe|task_name)$/,
  gcode:/_(gcode_dateiname|gcode_filename|gcode_file)$/, pname:/_(name_des_druckers|printer_name)$/
};
const COVER=/_(titelbild|cover_image)$/;
const BAD=new Set(["unknown","unavailable","","none","?"]);
const RUN=new Set(["running","prepare","pause","slicing","init"]);
let reg=null,regAt=0,wsStates=null,timer=null;

/* --- WebSocket-Verbindung für die Online-Version --- */
class HAWS{
  constructor(url,token){this.url=url.replace(/\/+$/,"");this.token=token;this.n=0;this.pend={};this.subs={};this.ws=null;this.ready=null}
  open(){
    if(this.ready)return this.ready;
    this.ready=new Promise((res,rej)=>{
      let ws;try{ws=new WebSocket(this.url.replace(/^http/i,"ws")+"/api/websocket")}catch(e){this.ready=null;return rej(new Error("Adresse ungültig"))}
      const to=setTimeout(()=>{try{ws.close()}catch(e){}this.ready=null;rej(new Error("Zeitüberschreitung beim Verbinden"))},8000);
      ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
        if(m.type==="auth_required")ws.send(JSON.stringify({type:"auth",access_token:this.token}));
        else if(m.type==="auth_ok"){clearTimeout(to);this.ws=ws;res(this)}
        else if(m.type==="auth_invalid"){clearTimeout(to);this.ready=null;rej(new Error("Zugangsschlüssel ungültig"))}
        else if(m.type==="event"&&this.subs[m.id]){try{this.subs[m.id](m.event)}catch(e){console.error(e)}}
        else if(m.type==="result"&&this.pend[m.id]){const p=this.pend[m.id];delete this.pend[m.id];m.success?p.res(m.result):p.rej(new Error(m.error&&m.error.message||"Fehler"))}};
      ws.onerror=()=>{};
      ws.onclose=()=>{clearTimeout(to);this.ws=null;this.ready=null;Object.values(this.pend).forEach(p=>p.rej(new Error("Verbindung getrennt")));this.pend={};this.subs={};};
    });
    return this.ready;
  }
  async callWS(msg){await this.open();const id=++this.n;return new Promise((res,rej)=>{this.pend[id]={res,rej};this.ws.send(JSON.stringify(Object.assign({},msg,{id})))})}
  async subscribe(msg,cb){await this.open();const id=++this.n;this.subs[id]=cb;
    await new Promise((res,rej)=>{this.pend[id]={res,rej};this.ws.send(JSON.stringify(Object.assign({},msg,{id})))}).catch(e=>{delete this.subs[id];throw e});
    return async()=>{delete this.subs[id];try{await this.callWS({type:"unsubscribe_events",subscription:id})}catch(e){}}}
}
function savedConn(){try{const v=JSON.parse(localStorage.getItem(CONN_KEY)||"null");return v&&v.url&&v.token?v:null}catch(e){return null}}

function printers(){

  reg.ents.filter(e=>e.pl==="bambu_lab"&&e.dev).forEach(e=>{(by[e.dev]=by[e.dev]||[]).push(e.id)});
  const out=[];
  for(const [dev,ids] of Object.entries(by)){
    const roles={};let cover=null;const trays=[];let ext=null;
    ids.forEach(id=>{const oid=id.split(".")[1];
      if(id.startsWith("sensor.")){for(const [k,re] of Object.entries(ROLE))if(!roles[k]&&re.test(oid))roles[k]=id;
        const m=oid.match(/_ams_(\d+)_(?:slot|tray)_(\d+)/);if(m)trays.push({id,ams:+m[1],slot:+m[2]});
        if(/external_?spool/.test(oid)&&!/aktiv|active/.test(oid))ext=id}
      if(id.startsWith("image.")&&COVER.test(oid))cover=id});
    if(!roles.status)continue;
    const d=reg.devs[dev]||{};const model=(roles.status.split(".")[1].split("_")[0]||"").toLowerCase();
    const mp=(S.cfg.haMap&&S.cfg.haMap[dev]&&S.cfg.haMap[dev].printerId)?byId(S.cfg.printers,S.cfg.haMap[dev].printerId):null;
    const name=val(roles.pname)||d.name_by_user||(mp&&mp.name)||d.name||model.toUpperCase();
    out.push({dev,roles,cover,trays,ext,model,name});
  }
  const off=p=>BAD.has(String((st(p.roles.status)||{}).state||"").toLowerCase())?1:0;
  return out.sort((a,b)=>off(a)-off(b)||a.name.localeCompare(b.name));
}
function trayInfo(p,key){
  let id=null;const m=String(key).match(/AMS\s*(\d+)\s*Tray\s*(\d+)/i);
  if(m){const t=p.trays.find(t=>t.ams===+m[1]&&t.slot===+m[2]);id=t&&t.id}else if(/ext/i.test(key))id=p.ext;
  const a=(st(id)||{}).attributes||{};
  return {type:a.type&&a.type!=="?"?a.type:"",color:String(a.color||"").slice(0,7),filament_id:a.filament_id||"",name:a.name&&a.name!=="?"?a.name:""};
}
function snapshot(p){
  const status=String((st(p.roles.status)||{}).state||"unknown").toLowerCase();
  const w=st(p.roles.weight);const weight=w&&!BAD.has(w.state)?num(w.state):0;
  const mats=[];if(w&&w.attributes)for(const [k,v] of Object.entries(w.attributes)){if(/AMS\s*\d+\s*Tray\s*\d+/i.test(k)||/^ext/i.test(k)){const g=num(v);if(g>0)mats.push(Object.assign({g:r2(g)},trayInfo(p,k)))}}
  if(!mats.length&&weight>0)mats.push({g:r2(weight),type:"",color:"",filament_id:"",name:""});
  const task=val(p.roles.task)||(val(p.roles.gcode)||"").replace(/\.(gcode|3mf)$/gi,"").split("/").pop()||"";
  const start=val(p.roles.start),end=val(p.roles.end);
  return {status,running:RUN.has(status),progress:num(val(p.roles.progress)),remaining:num(val(p.roles.remaining)),weight,mats,task,start,end,
    cover:p.cover&&st(p.cover)&&st(p.cover).attributes?st(p.cover).attributes.entity_picture:null};
}
async function lastValues(ids,days=14){
  const h=window.__hass;const start=new Date(Date.now()-days*864e5).toISOString();
  const r=await h.callWS({type:"history/history_during_period",start_time:start,entity_ids:ids.filter(Boolean),minimal_response:true,no_attributes:true,significant_changes_only:false});
  const out={};for(const id of ids){if(!id)continue;const arr=(r&&r[id])||[];for(let i=arr.length-1;i>=0;i--){const v=arr[i].s;if(v!=null&&!BAD.has(String(v).toLowerCase())){out[id]=v;break}}}
  return out;
}
async function job(p){
  const s=snapshot(p);
  if(!s.running&&(!s.start||!s.end||!s.task||new Date(s.end)<new Date(s.start))){
    try{const lv=await lastValues([p.roles.start,p.roles.end,p.roles.task]);s.start=s.start||lv[p.roles.start]||null;s.end=(s.end&&new Date(s.end)>=new Date(s.start||0))?s.end:(lv[p.roles.end]||null);s.task=s.task||lv[p.roles.task]||""}catch(e){}
  }
  let minutes=0;const t0=s.start?new Date(s.start).getTime():NaN;
  if(s.running&&isFinite(t0))minutes=(Date.now()-t0)/60000+s.remaining*60;
  else if(s.running)minutes=s.remaining*60/Math.max(.01,1-s.progress/100);
  else if(isFinite(t0)&&s.end){const t1=new Date(s.end).getTime();if(t1>t0)minutes=(t1-t0)/60000}
  s.minutes=Math.round(minutes);return s;
}
function cfgMap(dev){S.cfg.haMap=S.cfg.haMap||{};return S.cfg.haMap[dev]=S.cfg.haMap[dev]||{}}
function energySensors(){

function autoMap(list){

  for(const p of list){const m=cfgMap(p.dev);const tok=p.model.replace(/[^a-z0-9]/g,"");
    if(m.printerId===undefined){const want=tok.replace("mini"," mini");const pr=S.cfg.printers.find(x=>x.name.toLowerCase().replace(/\s+/g,"").startsWith(tok))||S.cfg.printers.find(x=>x.name.toLowerCase().includes(want.split(" ")[0])&&(tok.includes("mini")===x.name.toLowerCase().includes("mini")));m.printerId=pr?pr.id:"";changed=true}

async function kwhFor(dev,start,end){

  const t0=new Date(new Date(start).getTime()-120000).toISOString(),t1=new Date((end?new Date(end).getTime():Date.now())+120000).toISOString();
  try{const r=await window.__hass.callWS({type:"history/history_during_period",start_time:t0,end_time:t1,entity_ids:[m.energy],minimal_response:true,no_attributes:true,significant_changes_only:false});
    const arr=((r&&r[m.energy])||[]).map(x=>num(x.s)).filter(v=>isFinite(v)&&v>0);if(arr.length<2)return 0;
    let d=arr[arr.length-1]-arr[0];const u=(energySensors().find(x=>x.id===m.energy)||{}).unit||"kWh";if(/^wh$/i.test(u))d/=1000;return d>0&&d<50?d:0}catch(e){return 0}

/* --- AMS-Fach -> Material --- */
async function mapAms(m){
  S.cfg.amsMap=S.cfg.amsMap||{};const key=(m.filament_id||m.type||"?")+"|"+(m.color||"").toLowerCase();
  const known=S.cfg.amsMap[key];if(known&&byId(S.cfg.materials,known))return known;
  let id="";
  try{if(m.filament_id){S.lager=S.lager||await loadLager();
    const c=S.lager.filter(x=>x._bid===m.filament_id||x.bambu_id===m.filament_id);
    if(c.length){let best=c[0],bd=1e9;c.forEach(x=>{const d=hexDist(x.hex,m.color);if(d<bd){bd=d;best=x}});
      if(bd<90){const have=S.cfg.materials.find(x=>x.lagerUid===best.uid);if(have)id=have.id;else{const tk=typeKey(best.type||m.type);const td=TYPE_DEFAULTS[tk]||{p:20,d:1.24};
        const nm={id:uid(),name:best.name,type:best.type||tk,hex:best.hex,price:best.price?r2(best.price/best.weight*1000):td.p,density:td.d,lagerUid:best.uid};S.cfg.materials.push(nm);id=nm.id}}}}}catch(e){}
  if(!id)id=bestMaterial(m)||mapMaterial(m.type,m.color)||"";
  if(id){S.cfg.amsMap[key]=id;saveCfgSoon()}
  return id;
}
const SUB=["basic","matt","silk","tough","cf","gf","hf","galaxy","metal","marmor","marble","sparkle","glitzer","holz","wood","transparent","translucent","plus","lite"];
function subTokens(t){t=String(t||"").toLowerCase().replace(/matte/g,"matt").replace(/seide/g,"silk").replace(/[+]/g," plus ").replace(/[-_()]/g," ");return SUB.filter(x=>new RegExp("(^|\\s)"+x+"(\\s|$)").test(t))}
function bestMaterial(m){
  const tk=typeKey(m.type);const same=S.cfg.materials.filter(x=>typeKey(x.type)===tk);if(!same.length)return "";
  const want=subTokens((m.name||"")+" "+(m.type||""));
  let best=null,bs=-1e9;
  for(const x of same){const have=subTokens(x.name+" "+x.type);let sc=0;
    want.forEach(w=>{if(have.includes(w))sc+=10});have.forEach(h=>{if(!want.includes(h))sc-=6});
    sc-=hexDist(x.hex,m.color)/60;if(sc>bs){bs=sc;best=x}}
  return best?best.id:"";
}

/* --- Auftragsstatus automatisch --- */
let syncing=false;
async function syncOrders(){
  if(syncing||S.backend!=="ha")return;syncing=true;
  try{
    const watched=S.orders.filter(o=>["angebot","angenommen","druck"].includes(o.status)&&o.parts.some(p=>p.watch&&!p.watch.done));
    const qWatched=S.quote.parts.some(p=>p.watch&&!p.watch.done);
    if(!watched.length&&!qWatched)return;
    await loadRegistry(false);list=printers();
    const evalPart=async p=>{const pr=list.find(x=>x.dev===p.watch.dev);if(!pr)return null;const s=snapshot(pr);const since=new Date(p.watch.since).getTime()-90000;
      let start=s.start?new Date(s.start).getTime():NaN;
      if(s.running&&(!isFinite(start)||start>=since))return {state:"running"};
      if(s.status==="finish"){if(!isFinite(start)){const lv=await lastValues([pr.roles.start,pr.roles.end]);s.start=lv[pr.roles.start];s.end=s.end||lv[pr.roles.end];start=s.start?new Date(s.start).getTime():NaN}
        if(isFinite(start)&&start>=since){const j=await job(pr);const kwh=await kwhFor(pr.dev,j.start,j.end);return {state:"done",j,kwh}}}
      return null};
    let changed=[];
    for(const o of watched){let anyRun=false,allDone=true,touched=false;
      for(const p of o.parts){if(!p.watch||p.watch.done){continue}const r=await evalPart(p);
        if(r&&r.state==="done"){p.watch.done=true;p.watch.end=r.j.end;if(r.j.minutes)p.time=r.j.minutes;if(r.kwh>0)p.kwh=r2(r.kwh*1000)/1000;touched=true}
        else{allDone=false;if(r&&r.state==="running")anyRun=true}}
      let ns=o.status;
      if(allDone&&o.status!=="angebot")ns="fertig";else if(anyRun&&o.status==="angenommen")ns="druck";
      if(ns!==o.status||touched){if(ns!==o.status)changed.push(`${o.no}: ${statusName(ns)}`);o.status=ns;await Store.saveItem("o",o);
        if(S.quote.id===o.id){S.quote.status=o.status;S.quote.parts=clone(o.parts);saveDraft()}}}
    for(const p of S.quote.parts){if(p.watch&&!p.watch.done&&!watched.some(o=>o.id===S.quote.id)){const r=await evalPart(p);if(r&&r.state==="done"){p.watch.done=true;if(r.j.minutes)p.time=r.j.minutes;if(r.kwh>0)p.kwh=r2(r.kwh*1000)/1000;saveDraft();changed.push("Kalkulation: Druck fertig")}}}
    if(changed.length){toast(changed.join(" · "));render()}
  }catch(e){console.warn("Statusabgleich",e)}finally{syncing=false}
}

      <div class="cols2"><label class="field"><span>Adresse von Home Assistant</span><input type="url" id="ha_url" placeholder="https://abcdef.ui.nabu.casa" value="${esc(conn?conn.url:"")}"></label>

  }

      <label class="field"><span>Kosten wie Drucker</span><select data-hamap="${esc(p.dev)}" data-k="printerId">${opt(S.cfg.printers,m.printerId,"nicht zugeordnet")}</select></label>
      <label class="field"><span>Energiezähler</span><select data-hamap="${esc(p.dev)}" data-k="energy"><option value="">keiner</option>${ens.map(e=>`<option value="${esc(e.id)}"${e.id===m.energy?" selected":""}>${esc(e.name)}</option>`).join("")}</select></label></div>`}).join("")}</div>
    <div class="hint" style="margin-top:8px">Teilen sich zwei Drucker eine Steckdose, misst der Zähler beide zusammen. Druckt dann nur einer, stimmt der Wert trotzdem.</div>`:`<div class="hint">Drucker werden geladen… Falls hier nichts erscheint, tippe auf „Neu einlesen“.</div>`}
  </section>

    <div class="hint" style="margin-bottom:6px">Übernimmst du einen Druck vom Drucker, rechnet SchichtLohn das verbrauchte Filament mit einem Preis aus deiner Materialliste. Hier siehst du, welches Material (und damit welcher Preis) für das Filament in jedem AMS-Fach genommen wird. Das passiert automatisch über dein FilamentLager. Ändern musst du hier nur etwas, wenn ein Preis nicht stimmt.</div>

      <select data-amskey="${esc(key)}"><option value="">automatisch</option>${S.cfg.materials.map(x=>`<option value="${esc(x.id)}"${x.id===cur?" selected":""}>${esc(x.name)}${x.price?` · ${String(r2(+x.price)).replace(".",",")} €/kg`:""}</option>`).join("")}</select></div>`)}
  return rows.length?`<div>${rows.join("")}</div>`:`<div class="hint">Keine belegten AMS-Fächer gefunden.</div>`;
}

    catch(err){msg.textContent="Verbindung fehlgeschlagen: "+(err&&err.message||err)}}

});

<script>
/* ===== Druckaufträge: Druckprotokoll aus Home Assistant und Druckhistorie aus der Bambu-Cloud ===== */
(function(){
"use strict";
const BK="schichtlohn_bambu",TODO="todo.druckprotokoll";
const PROXY=(/\.pages\.dev$/i.test(location.hostname)?location.origin:"https://schichtlohn.pages.dev")+"/bambu";
const J={ha:[],cloud:[],haAt:0,cloudAt:0,haLoading:false,cloudLoading:false,haErr:"",cloudErr:"",sel:new Set(),src:"alle",printer:"",q:"",open:true,login:null,more:false};

/* --- Bambu-Konto (nur in diesem Browser) --- */
function acct(){try{const v=JSON.parse(localStorage.getItem(BK)||"null");return v&&v.token?v:null}catch(e){return null}}
function setAcct(v){try{v?localStorage.setItem(BK,JSON.stringify(v)):localStorage.removeItem(BK)}catch(e){}}
async function api(path,o={}){
  const u=new URL(PROXY+"/"+path);if(o.region==="cn")u.searchParams.set("region","cn");
  for(const [k,v] of Object.entries(o.query||{}))if(v!=null&&v!=="")u.searchParams.set(k,v);
  const h={};if(o.body)h["Content-Type"]="application/json";if(o.token)h.Authorization="Bearer "+o.token;
  let r;try{r=await fetch(u,{method:o.body?"POST":"GET",headers:h,body:o.body?JSON.stringify(o.body):undefined})}catch(e){throw new Error("Bambu-Cloud nicht erreichbar. Prüfe die Internetverbindung.")}
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){const e=new Error((d&&(d.message||d.error||d.msg))||("HTTP "+r.status));e.status=r.status;throw e}
  return d||{};
}
function saveToken(d,login){const exp=Date.now()+(num(d.expiresIn)||7776000)*1000;setAcct({token:d.accessToken,region:login.region,account:login.account,exp});J.login=null;J.cloud=[];J.cloudAt=0;J.cloudErr="";cloudStatus()}
function cloudStatus(){const el=document.getElementById("cloudst");if(!el)return;const a=acct();
  const st=J.cloudLoading?"busy":J.cloudErr?"err":a?"ok":"off";el.className="sync "+st;
  el.title=st==="busy"?"Bambu Cloud: lädt…":st==="err"?"Bambu Cloud: "+J.cloudErr:a?`Bambu Cloud verbunden (${a.account}) · antippen für die Druckaufträge`:"Bambu Cloud nicht verbunden · antippen zum Verbinden"}
async function loginStep(kind,vals){
  const L=J.login;
  if(kind==="pw"){L.account=vals.account;L.region=vals.region;
    const d=await api("user/login",{region:L.region,body:{account:L.account,password:vals.password}});
    if(d.accessToken){saveToken(d,L);return "ok"}
    if(d.loginType==="verifyCode"){await api("user/sendemail/code",{region:L.region,body:{email:L.account,type:"codeLogin"}});L.step="code";return "code"}
    if(d.loginType==="tfa"){L.tfaKey=d.tfaKey;L.step="tfa";return "tfa"}
    throw new Error("Anmeldung nicht möglich"+(d.loginType?` (${d.loginType})`:""));}
  if(kind==="code"){const d=await api("user/login",{region:L.region,body:{account:L.account,code:vals.code}});if(!d.accessToken)throw new Error("Code nicht angenommen");saveToken(d,L);return "ok"}
  if(kind==="resend"){await api("user/sendemail/code",{region:L.region,body:{email:L.account,type:"codeLogin"}});return "code"}
  if(kind==="tfa"){const d=await api("tfa",{region:L.region,body:{tfaKey:L.tfaKey,tfaCode:vals.code}});if(!d.accessToken)throw new Error("Code nicht angenommen");saveToken(d,L);return "ok"}
}
function loginModal(){
  const L=J.login||(J.login={step:"pw",account:"",region:"global"});
  const step=L.step;
  const body=step==="pw"?`<p class="muted" style="margin:0">Melde dich mit deinem Bambu-Lab-Konto an, um die Druckhistorie deiner Drucker abzurufen. Das Passwort wird nur für die Anmeldung gesendet und nicht gespeichert. In diesem Browser bleibt danach nur der Anmeldeschlüssel (rund drei Monate gültig).</p>
      <label class="field"><span>E-Mail</span><input type="email" id="bb_acc" autocomplete="username" value="${esc(L.account)}"></label>
      <label class="field"><span>Passwort</span><input type="password" id="bb_pw" autocomplete="current-password"></label>
      <label class="field"><span>Region</span><select id="bb_reg"><option value="global"${L.region!=="cn"?" selected":""}>Europa und Welt (bambulab.com)</option><option value="cn"${L.region==="cn"?" selected":""}>China (bambulab.cn)</option></select></label>
      <div class="hint">Bambu bietet dafür keine offizielle Schnittstelle. Der Abruf läuft über eine kleine Weiterleitung auf schichtlohn.pages.dev, weil die Bambu-Cloud direkte Aufrufe aus dem Browser sperrt. Ändert Bambu etwas, kann der Abruf ausfallen.</div>`
    :`<p class="muted" style="margin:0">${step==="code"?`Bambu hat einen Bestätigungscode an <b>${esc(L.account)}</b> geschickt. Gib ihn hier ein.`:"Gib den Code aus deiner Authenticator-App ein."}</p>
      <label class="field"><span>Code</span><input type="text" id="bb_code" inputmode="numeric" autocomplete="one-time-code" maxlength="8"></label>
      ${step==="code"?`<button class="btn ghost sm" data-act="bbResend" style="align-self:flex-start">Code neu senden</button>`:""}`;
  modal("Bambu-Cloud verbinden",`<div class="stack">${body}<div class="hint" id="bb_msg" role="status"></div></div>`,
    `<button class="btn ghost" data-act="close">Abbrechen</button><button class="btn pri" data-act="bbNext">${step==="pw"?"Anmelden":"Bestätigen"}</button>`);
}
async function loginSubmit(kind){
  const msg=$("#bb_msg");const btn=$('[data-act="bbNext"]');
  try{let vals={};
    if(kind==="pw"){vals={account:$("#bb_acc").value.trim(),password:$("#bb_pw").value,region:$("#bb_reg").value};if(!/.+@.+/.test(vals.account)||!vals.password){msg.textContent="Gib E-Mail und Passwort ein.";return}}
    else if(kind!=="resend"){vals={code:$("#bb_code").value.trim()};if(vals.code.length<4){msg.textContent="Gib den Code ein.";return}}
    if(btn)btn.disabled=true;msg.textContent=kind==="resend"?"Sende Code…":"Prüfe…";
    const r=await loginStep(kind,vals);
    if(r==="ok"){closeModal();toast("Bambu-Cloud verbunden");loadCloud(true);render()}
    else if(kind==="resend"){msg.textContent="Neuer Code ist unterwegs."}
    else loginModal();
  }catch(e){if(msg)msg.textContent=e.status===401||e.status===400?"Anmeldung abgelehnt: "+e.message:"Fehler: "+e.message}

}

/* --- Normalisieren --- */
const hex=c=>{c=String(c||"").replace("#","");return c.length>=6?"#"+c.slice(0,6).toLowerCase():""};
function fromCloud(t){
  const st=t.startTime?new Date(t.startTime):null,en=t.endTime?new Date(t.endTime):null;
  let minutes=st&&en&&en>st?(en-st)/60000:0;if(!minutes&&t.costTime)minutes=num(t.costTime)/60;
  const mats=(t.amsDetailMapping||[]).filter(m=>num(m.weight)>0).map(m=>({g:r2(num(m.weight)),type:m.filamentType||m.targetFilamentType||"",color:hex(m.sourceColor||m.targetColor),filament_id:m.filamentId||"",name:m.filamentType||""}));
  if(!mats.length&&num(t.weight)>0)mats.push({g:r2(num(t.weight)),type:"",color:"",filament_id:"",name:""});
  return {key:"c:"+t.id,src:"cloud",id:String(t.id),title:t.title||t.designTitle||"Druck",printer:t.deviceName||t.deviceId||"",serial:String(t.deviceId||""),model:t.deviceModel||"",
    start:st?st.toISOString():"",end:en?en.toISOString():"",minutes:Math.round(minutes),failed:+t.status===3,running:![2,3].includes(+t.status),grams:num(t.weight)||mats.reduce((a,m)=>a+m.g,0),mats,cover:t.cover||"",plate:t.plateIndex||""};
}
function fromHa(i){
  let d={};try{d=JSON.parse(i.description||"{}")}catch(e){}
  const minutes=d.start&&d.ende?(new Date(d.ende)-new Date(d.start))/60000:0;
  const failed=d.status==="failed";const share=failed&&num(d.fortschritt)>0?Math.min(1,num(d.fortschritt)/100):1;
  const mats=(d.faecher||[]).map(f=>({g:r2(num(f.g)*share),type:f.typ||"",color:hex(f.farbe),filament_id:f.fid||"",name:f.name||f.typ||"",ort:f.ort||""}));
  if(!mats.length&&num(d.gramm)>0)mats.push({g:r2(num(d.gramm)*share),type:"",color:"",filament_id:"",name:""});
  const serial=String(d.drucker||"").split("_").pop().toUpperCase();

async function loadCloud(force,more){
  const a=acct();if(!a||J.cloudLoading)return;if(!force&&!more&&J.cloudAt&&Date.now()-J.cloudAt<300000)return;
  J.cloudLoading=true;J.cloudErr="";redraw();cloudStatus();

function usedMap(){const m={};const add=(p,where)=>{if(p&&p.job)(p.job.keys||[p.job.key]).filter(Boolean).forEach(k=>{if(!m[k])m[k]=where})};
  S.orders.forEach(o=>(o.parts||[]).forEach(p=>add(p,"Auftrag "+(o.no||""))));(S.quote&&S.quote.parts||[]).forEach(p=>add(p,"Kalkulation"));return m}
function all(){
  const ha=J.ha.map(x=>Object.assign({},x)),out=[];const used=new Set();
  for(const h of ha){const t=new Date(h.end).getTime();
    const c=J.cloud.find(c=>!used.has(c.id)&&c.serial&&c.serial.toUpperCase()===h.serial&&c.end&&Math.abs(new Date(c.end).getTime()-t)<15*60000);
    if(c){used.add(c.id);h.cloud=c;h.cover=c.cover;if(!h.minutes)h.minutes=c.minutes;if(h.title==="Druck"&&c.title)h.title=c.title;if(!h.start)h.start=c.start}
    out.push(h)}
  J.cloud.forEach(c=>{if(!used.has(c.id))out.push(c)});
  if(window.CRE)CRE.jobs().forEach(c=>out.push(c));
  const tv=j=>{const t=new Date(j.end||j.start||0).getTime();return isNaN(t)?0:t};
  return out.sort((a,b)=>tv(b)-tv(a));
}
const keysOf=j=>[j.key].concat(j.cloud?[j.cloud.key]:[]);
function visible(list,used){
  const q=J.q.trim().toLowerCase();
  return list.filter(j=>{if(j.running)return false;
    if(J.src==="ha"&&j.src!=="ha")return false;if(J.src==="cloud"&&!(j.src==="cloud"||j.cloud))return false;if(J.src==="creality"&&j.src!=="creality")return false;
    if(J.printer&&j.printer!==J.printer)return false;
    if(J.open&&(j.done||keysOf(j).some(k=>used[k])))return false;
    if(q&&!(j.title+" "+j.printer+" "+j.mats.map(m=>m.name+" "+m.type).join(" ")).toLowerCase().includes(q))return false;
    return true});
}
const dayKey=iso=>{if(!iso)return "";const d=new Date(iso);return isNaN(d)?String(iso).slice(0,10):d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
function dayLabel(iso){if(!iso)return "Ohne Datum";const d=new Date(iso);const t=new Date();const y=new Date(Date.now()-864e5);
  if(d.toDateString()===t.toDateString())return "Heute";if(d.toDateString()===y.toDateString())return "Gestern";
  return d.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long",year:d.getFullYear()===t.getFullYear()?undefined:"numeric"})}
const hm=iso=>iso?new Date(iso).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}):"";

/* --- Übernehmen --- */
async function partFromJob(j){
  const isHa=S.backend==="ha"&&window.HAP;let pr=null;
  if(isHa){try{await HAP.ensure();pr=HAP.bySerial(j.serial)}catch(e){}}
  const mats=[];for(const m of j.mats){let id="";try{id=await HAP.mapAms(m)}catch(e){id=mapMaterial(m.type,m.color)}mats.push({matId:id,g:m.g,label:[m.name||m.type,m.ort].filter(Boolean).join(" · "),color:m.color})}
  let printerId=pr?(HAP.cfgMap(pr.dev).printerId||""):"";
  if(!printerId){const nm=String(j.printer||"").toLowerCase().replace(/[\s_-]+/g,"");const md=String(j.model||"").toLowerCase().replace(/[\s_-]+/g,"");
    const hit=S.cfg.printers.find(x=>{const n=x.name.toLowerCase().replace(/[\s_-]+/g,"");return n===nm||(md&&n.startsWith(md)&&(md.includes("mini")===n.includes("mini")))});printerId=hit?hit.id:""}
  let kwh=0;if(pr&&j.start&&j.end){try{kwh=await HAP.kwhFor(pr.dev,j.start,j.end)}catch(e){}}
  const thumb=await thumbFor(j.cover);
  return newPart({name:j.title+(j.failed?" (abgebrochen)":""),time:j.minutes||60,thumb,src:(j.src==="ha"?"Druckprotokoll":j.src==="creality"?"Creality-Cloud":"Bambu-Cloud")+(j.printer?" · "+j.printer:""),printerId,kwh:kwh>0?r2(kwh*1000)/1000:0,
    mats:mats.length?mats:[{matId:"",g:0}],job:{key:j.key,keys:keysOf(j),printer:j.printer,start:j.start,end:j.end,failed:j.failed,cover:j.cover||""}});
}
async function markHa(jobs){if(S.backend!=="ha")return;for(const j of jobs)if(j.src==="ha"&&j.uid&&!j.done){try{await hass().callWS({type:"call_service",domain:"todo",service:"update_item",target:{entity_id:TODO},service_data:{item:j.uid,status:"completed"}});j.done=true;const o=J.ha.find(x=>x.uid===j.uid);if(o)o.done=true}catch(e){console.warn("Druckprotokoll",e)}}}
async function take(mode,orderId,ok){
  const sel=J_list.filter(j=>J.sel.has(j.key)).sort((a,b)=>(a.end||"").localeCompare(b.end||""));if(!sel.length)return;
  if(!ok&&S.quote.parts.length&&!S.quote.id&&mode!=="quote"){confirmBox(mode==="new"?"Die aktuelle Kalkulation ist nicht gespeichert und wird ersetzt. Weiter?":"Die aktuelle Kalkulation ist nicht gespeichert und wird durch den Auftrag ersetzt. Weiter?",mode==="new"?"Ersetzen":"Weiter",()=>take(mode,orderId,true));return}
  toast(sel.length>1?`${sel.length} Drucke werden übernommen…`:"Druck wird übernommen…");
  const parts=[];for(const j of sel){try{parts.push(await partFromJob(j))}catch(e){console.error(e)}}
  if(!parts.length){toast("Übernehmen fehlgeschlagen");return}
  const latest=sel[sel.length-1];
  if(mode==="new"){
    S.quote=newQuote();S.quote.name=sel.length===1?sel[0].title:`${sel[0].title} und ${sel.length-1} weitere`;S.quote.status="fertig";
    if(latest.end)S.quote.date=latest.end.slice(0,10);S.quote.parts=parts;fixRefs();
  }else if(mode==="order"){
    const o=byId(S.orders,orderId);if(!o)return;
    S.quote=clone(o);delete S.quote.sum;S.quote.parts.push(...parts);fixRefs();
  }else{S.quote.parts.push(...parts)}
  J.sel.clear();saveDraft();S.tab="rechner";render0();
  if(mode==="order"){await saveOrder();toast(`${parts.length} Druck${parts.length>1?"e":""} zu Auftrag ${S.quote.no} hinzugefügt`)}
  else toast(mode==="new"?"Neuer Auftrag vorbereitet. Prüfe Preis und Kunde, dann „Als Auftrag speichern“.":`${parts.length} Druck${parts.length>1?"e":""} in die Kalkulation übernommen`);
  markHa(sel);
}

/* Vorschaubild holen: direkt, sonst über die Weiterleitung (Bambu-Bilder erlauben keinen Abruf aus dem Browser) */
async function thumbFor(url){
  if(!url)return "";
  try{const r=await fetch(url);if(r.ok){const t=await blobToThumb(await r.blob());if(t)return t}}catch(e){}
  const cu=window.CRE?CRE.coverUrl(url):"";
  try{const r=await fetch(cu||(PROXY+"/cover?u="+encodeURIComponent(url)));if(r.ok){const t=await blobToThumb(await r.blob());if(t)return t}else console.warn("Vorschaubild:",r.status,await r.text().catch(()=>""),url)}catch(e){console.warn("Vorschaubild:",e,url)}
  return "";
}
/* Teile ohne Bild nachträglich mit dem Bild aus der Druckhistorie versehen */
let fixing=false;const failed=new Set();
async function fixThumbs(){
  if(fixing||!S.quote)return;
  const need=S.quote.parts.filter(p=>!p.thumb&&p.job);if(!need.length)return;
  fixing=true;let n=0;
  try{
    if(acct()&&need.some(p=>(p.job.keys||[p.job.key]).some(k=>String(k).startsWith("c:")))){
      const miss=()=>need.some(p=>{const k=(p.job.keys||[p.job.key]).find(x=>String(x).startsWith("c:"));return k&&!J.cloud.some(c=>c.key===k)});
      if(!J.cloudAt)await loadCloud(true);
      for(let i=0;i<9&&miss()&&J.more&&!J.cloudErr;i++)await loadCloud(true,true);
    }
    for(const p of need){
    if(failed.has(p.id))continue;
    const k=(p.job.keys||[p.job.key]).find(x=>String(x).startsWith("c:"));const c=k&&J.cloud.find(x=>x.key===k);
    let url=c&&c.cover||"";if(!url){const h=all().find(x=>(p.job.keys||[p.job.key]).includes(x.key));url=h&&h.cover||p.job.cover||""}
    if(!url){failed.add(p.id);continue}const t=await thumbFor(url);if(t){p.thumb=t;p.job.cover=url;n++}else failed.add(p.id)}}
  finally{fixing=false}
  if(n){saveDraft();if(S.tab==="rechner")renderCalc($("#main"))}
}
/* Druckhistorie vollständig laden (Druckprotokoll und bis zu 1000 Cloud-Drucke) */
let ensP=null;
function ensure(){

    const ps=[];if(S.backend==="ha")ps.push(loadHa(false));

}

function jobsFor(serial){serial=String(serial||"").toUpperCase();if(!serial)return [];return all().filter(j=>!j.running&&String(j.serial||"").toUpperCase()===serial)}

}
window.JOBS={render,settingsHTML,cloudStatus,coverFor,ensure,jobsFor,usedOf,takeKeys,busy,thumbFor,fixThumbs,_J:J,_fromCloud:fromCloud,_fromHa:fromHa};

<script>
/* ===== Creality-Cloud: Druckerstatus, Druckhistorie und Abbuchen im Lager (in den Einstellungen abschaltbar) ===== */
(function(){
"use strict";
const CK="schichtlohn_creality",DONE_K="schichtlohn_creality_gebucht";
const PROXY=(/\.pages\.dev$/i.test(location.hostname)?location.origin:"https://schichtlohn.pages.dev")+"/creality";
const C={printers:[],jobs:[],at:0,stAt:0,loading:false,stLoading:false,err:"",login:null,poll:null,raw:{devices:null,history:null,rpc:null},cfsAt:{},cfsFail:{}};
const on=()=>S.cfg.creality!==false;

/* --- Konto (nur in diesem Browser; das Passwort wird nie gespeichert) --- */
function acct(){try{const v=JSON.parse(localStorage.getItem(CK)||"null");return v&&v.token&&v.uid?v:null}catch(e){return null}}
