name: SchichtLohn
options:
  bundleIdPrefix: de.mitkiprogrammieren
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: de
targets:
  SchichtLohn:
    type: application
    platform: iOS
    sources:
      - SchichtLohn
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.mitkiprogrammieren.schichtlohn
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SchichtLohn/Info.plist
        CODE_SIGN_STYLE: Automatic
    info:
      path: SchichtLohn/Info.plist
      properties:
        CFBundleDisplayName: SchichtLohn
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: SchichtLohn verbindet sich mit deinem SchichtLohn-Server im Heimnetz.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
