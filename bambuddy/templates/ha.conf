# Hersteller-Logos aus Home Assistant (Ordner /config/www/hersteller) – dieselben wie auf der großen Seite.
# Home Assistant liefert /local/ ohne Anmeldung aus. Andere Adresse von Home Assistant? Hier ändern, Projekt neu starten.
location /ha-local/ {
    proxy_pass http://192.168.1.66:8123/local/;
    proxy_connect_timeout 3s;
    proxy_intercept_errors on;
    error_page 502 503 504 =404 /404-logo;
    expires 1h;
}
location = /404-logo { return 404; }
