[package]
name = "formwerk"
version = "0.1.0"
edition = "2024"
description = "Formwerk – große Modelle aufs Druckbett zerlegen, mit Verbindern, im Bambu-Studio-Look"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
geo = "0.31"
earcutr = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 2
