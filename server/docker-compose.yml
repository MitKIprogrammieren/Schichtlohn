# Container Manager auf der Synology: Projekt „schichtlohn“ anlegen, diesen Inhalt einfügen, erstellen.
# Vorher in File Station den Ordner docker/schichtlohn anlegen – dort liegt die Datenbank.
services:
  schichtlohn:
    image: ghcr.io/mitkiprogrammieren/schichtlohn-server:latest
    ports:
      - "8093:8093"
    volumes:
      - /volume1/docker/schichtlohn:/daten
    environment:
      - TZ=Europe/Berlin
      # - LESEMODELL=genau   # großes Lesemodell für Ausschnitte – nur für starke Rechner, auf schwächeren Synologys sehr langsam
      # - TOKEN=ein-langes-geheimes-wort   # einschalten, wenn der Server von außen erreichbar ist
    pull_policy: always   # beim Erstellen immer die neueste Version holen
    init: true   # sauberes Stoppen
    stop_grace_period: 5s   # spätestens nach 5 s hart beenden – kein Hängenbleiben beim Aktualisieren
    restart: unless-stopped
    mem_limit: 2g
