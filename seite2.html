 use our website and cannot be switched off in our systems. Essential cookies are required to enable the basic functions of this site and guarantee the security and efficiency of the service required. These cookies are usually set in response to actions made by you which amount to a request for services, such as logging in, requesting website visual elements and pages resources, filling in forms or adding goods to the shopping cart. Without these cookies, services you have asked for cannot be properly provided.\",\"functionalTitle\":\"Functional Cookies\",\"functionalDesc\":\"These cookies are used to provide you with enhanced functionality and improve your browsing experience. These cookies may remember certain choices you have made, such as your language preference, your region, your username and password. These cookies may be set by us or by third-party providers who provide services on our pages. If you do not allow these cookies, some of these services may not function properly, and we may not be able to provide you with better personalization on user experience.\",\"analyticalTitle\":\"Analytical Cookies\",\"analyticalDesc\":\"These cookies allow us to count visits and traffic sources so we can measure and improve the performance of our site. These cookies may collect information about how you use our websites, such as which page you visit and which link you click on. These cookies help us to know which goods or pages are the most and least popular and see how visitors move around the website. These cookies also help us understand how our services are doing and improve them by developing new features. If you do not allow these cookies, we may not be able to monitor its performance and improve your experience accordingly.\",\"marketingTitle\":\"Marketing and Advertising Cookies\",\"marketingDesc\":\"These cookies can track your online activities and are used to make advertisements more relevant to you. These cookies may be set through our website by our advertising partners, which can be used to build a profile of your interests and show you relevant advertisements. If you do not allow these cookies, you will experience less targeted advertising.\",\"save\":\"Save My Settings\",\"saving\":\"Saving…\",\"confirmChoices\":\"Confirm My choices\",\"acceptEssential\":\"Accept Essential Cookies\",\"acceptAll\":\"Accept All Cookies\"},\"Newsletter\":{\"get_more\":\"Get More\",\"subscription_title\":\"Creality is a leading 3D printer manufacturer dedicated to developing 3D printers, 3D printer filament, and maker-related products. Subscribe to learn more.\",\"your_email\":\"Your Email\",\"subscription\":\"Thank you for your subscription\",\"you_have_already_subscribed\":\"You have already subscribed\",\"an_unexpected_error_occurred\":\"An unexpected error occurred\",\"please_enter_your_email_address\":\"Please enter your email address!\",\"email_cannot_contain_spaces\":\"The email cannot contain spaces.\",\"valid_email_address\":\"Please enter a valid email address!\",\"please_agree_to_privacy_policy\":\"Please agree to the privacy policy first.\"},\"About\":{\"top_title\":\"About Creality\",\"top_content\":\"Creality, is a world-leading brand of consumer 3D printers. Since our establishment in 2014, we have embraced our role as a \\\"3D Printing Evangelist\\\" committed to the innovation, application, and popularization of 3D printing technology worldwide.\",\"main_title\":\"Fast Facts\",\"main_contetn1\":\"Our forward-looking business strategy, termed \\\"One Core with Two Wings,\\\" has propelled our rapid growth. Specifically, 3D printer products are at the “Core” of our business, which is assisted by the first “Wing” of ecosystem products like 3D scanners, laser engravers, filaments, and accessories. A second “Wing” of our business is Creality Cloud, an all-in-one 3D printing platform that gathers 3D models and enables a cloud printing experience.\",\"main_contetn2\":\"Today, we are proud to manage the global brands of Creality and Ender, alongside our innovative brands, HALOT and Sermoon. With our products being shipped to over 100 countries and regions, Creality has topped global 3D printer sales charts. Our products, widely adopted by individuals, families, educational institutions, and enterprises, have received high acclaim from users and partners worldwide.\",\"main_itme1\":\"3D Printers Shipped\",\"fiunit1\":\"\",\"main_itme1_dw\":\" Million+\",\"main_itme2\":\"Annual Production Capacity\",\"fiunit2\":\"\",\"main_itme2_dw\":\" Million+\",\"main_itme3\":\"Total Production Area\",\"fiunit3\":\"\",\"main_itme3_dw\":\" m²\",\"main_itme4\":\"Global Users\",\"fiunit4\":\"\",\"main_itme4_dw\":\" Million+\",\"main_itme5\":\"Countries and Regions\",\"fiunit5\":\"\",\"main_itme5_dw\":\"+\",\"main_itme6\":\"Employees\",\"fiunit6\":\"\",\"main_itme6_dw\":\"+\",\"main_itme7\":\"R\u0026D Talents\",\"fiunit7\":\"\",\"main_itme7_dw\":\"+\",\"main_itme8\":\"3D Printer Patents\",\"fiunit8\":\"\",\"main_itme8_dw\":\"\",\"main2_title\":\"Imagine It, Make It\",\"main2_cotnent\":\"Usable, Smart, Affordable, Versatile and Enjoyable\",\"main3_title\":\"Brand Culture\",\"main3_cotnent1\":\"With the new brand slogan \\\"Imagine It, Make It,\\\" Creality remains an “Evangelist for the 3D printing industry” and resolute in harnessing the power of technology to make the world a better place and democratize the benefits of 3D printing. In line with our commitment to social responsibility, we actively promote sustainable development and support good causes like the Space Robotics Project (aka Robótica Espacial) in Brazil and a humanitarian project focusing on 3D-printed prosthetics in Tanzania.\",\"main3_cotnent2\":\"In late December 2023, Creality underwent a brand refresh to align with its core values—Usable, Smart, Affordable, Versatile, and Enjoyable. This renewal echoes Creality's commitment to making 3D printing accessible worldwide, emphasizing usability by streamlining creative processes. Smartly addressing user needs, Creality ensures continuous support throughout the evolving maker journey. Affordability remains foundational, reflecting Creality's belief in inclusive 3D printing. Versatility is ingrained in its ethos, fostering collaboration among printers, filaments, and accessories. Recognizing the joy of 3D printing, Creality creates a fun world for all creators, building happiness through learning and self-fulfillment.\",\"main4_title\":\"Milestones\",\"bottom1_title\":\"2023 Reflect and Renew.\",\"bottom1_cotnet1\":\"Operate factories in Shenzhen, Wuhan, and Huizhou, achieving a ramp-up in production.\",\"bottom1_cotnet2\":\"Launch the K1 and HALOT-MAGE flagship 3D printers, which starts the new chapter of high speed printing.\",\"bottom2_title\":\"Define the Business Strategy.\",\"bottom2_cotnet1\":\"2,000+ employees.\",\"bottom2_cotnet2\":\"1,200,000+ global users.\",\"bottom2_cotnet3\":\"Introduced the \\\"One Core with Two Wings\\\" business strategy.\",\"bottom2_cotnet4\":\"Held \\\"Create the Future\\\" 3D Printing Industry summit\",\"bottom2_cotnet5\":\"to make 7th anniversary.\",\"bottom3_title\":\"Branching Out.\",\"bottom3_cotnet1\":\"1,700+ employees.\",\"bottom3_cotnet2\":\"1,000,000+ annual shipments worldwide.\",\"bottom3_cotnet3\":\"50,000m'+ manufacturing base.\",\"bottom3_cotnet4\":\"The Creality ecosystem was formallyestablished.\",\"bottom4_title\":\"Brand Upgrade.\",\"bottom4_cotnet1\":\"1,000+ employees.\",\"bottom4_cotnet2\":\"500,000+ annual shipments worldwide.\",\"bottom4_cotnet3\":\"Sponsored 3D printing clubs in universities.\",\"bottom5_title\":\"Won the Global Population.\",\"bottom5_cotnet1\":\"270+ employees.\",\"bottom5_cotnet2\":\"100,000+ annual shipments worldwide.\",\"bottom5_cotnet3\":\"Established the Ender brand.\",\"bottom6_title\":\"The Year of Our Rise.\",\"bottom6_cotnet1\":\"90+ employees.\",\"bottom6_cotnet2\":\"17,000+ annual shipments.\",\"bottom6_cotnet3\":\"CR-10 became a global hit.\",\"bottom6_cotnet4\":\"Established the Creality brand.\",\"bottom7_title\":\"The Year of Our Rise.\",\"bottom7_cotnet1\":\"Creality was founded by four founders in a 20 m² workshop.\"},\"Blog\":{\"blog_center\":\"Blog Center\",\"no_blog\":\"No blog\"},\"Common\":{\"newest\":\"Newest\",\"oldest\":\"Oldest\",\"all\":\"All\",\"sortby\":\"Sort By\",\"sharewith\":\"Share on\",\"recent_news\":\"Recent News\",\"home\":\"Home\",\"learn_more\":\"Learn More\",\"show_less\":\"Show less\",\"show_more\":\"Show more\",\"view_all\":\"View All\",\"legal_guarantee_rights\":\"Your Legal Guarantee Rights\",\"new\":\"New\",\"no_results\":\"No Results\",\"found_for\":\"found for\",\"quick_links\":\"Quick Links\",\"my_account\":\"My Account\",\"my_order\":\"My Order\",\"buy_now\":\"Buy Now\",\"day\":\"Day\",\"hour\":\"Hour\",\"minute\":\"Minute\",\"second\":\"Second\",\"pages\":\"Pages\",\"Accessories\":\"Accessories\",\"from\":\"From {price}\",\"get_more\":\"Get More\",\"subscription_title\":\"Creality is a leading 3D printer manufacturer dedicated to developing 3D printers, 3D printer filament, and maker-related products. Subscribe to learn more.\",\"subscription\":\"Thank you for your subscription\",\"your_email\":\"Your Email\",\"show_now\":\"Shop Now\",\"your_shopping_bag_is_empty\":\"Your shopping bag is empty\",\"shopping_bag\":\"Shopping Bag\",\"add_to_cart\":\"Add To Cart\",\"add_short\":\"Add\",\"add_to_cart_success\":\"Added to cart successfully\",\"pip_video\":\"Playing in picture in picture.\",\"autoplay\":\"Autoplay\",\"photos\":\"Photos\",\"to\":\"to\",\"search\":\"Search\",\"sold_out\":\"Sold Out\",\"sold\":\"{sold} Sold\",\"next_one\":\"Change\",\"failed_to_load_messages_please_try_again_later\":\"Mensajes de carga fallidos, por favor intente nuevamente más tarde.\",\"message_sent_successfully\":\"Mensaje enviado con éxito\",\"message_sending_failed\":\"Mensaje enviado fallido\",\"send_your_blessings\":\"Send Your Blessings\",\"thanks_for_joining\":\"Thanks for joining—stay tuned for future su ates and newest offerings.\",\"no_thanks\":\"No, thanks\",\"allow\":\"Allow\"}},\"Member\":{\"hi\":\"Hi\",\"dear_member\":\"Dear Member\",\"welcome_aboard\":\"Welcome aboard! Enjoy your membership journey at Creality.\",\"welcome_to_the_creality\":\"Welcome to the Creality\\nLoyalty Program\",\"mb_welcome_to_the_creality\":\"Welcome to the\\nCreality Loyalty Program\",\"top_list3\":\"Enjoy Exclusive Benefits \u0026 Earn Multiple Reward Points\",\"join_now\":\"Join Now\",\"overview\":\"Overview\",\"introduction\":\"Introduction\",\"membership_benefits\":\"Membership Benefits\",\"lottery\":\"Lottery\",\"coupon_pack\":\"Coupon Pack\",\"reward_points\":\"Reward Points\",\"you_ll_need_to_spend_more_to_level_up\":\"You’ll need to spend €{nextLevelPoints} more to level up!\",\"you_re_already_at_the_top_level\":\"Congratulations! You're already at the top level! \",\"diamond_benefits\":\"{tierName} Benefits\",\"why_join_creality_club\":\"Why Join Creality Club?\",\"earn_redeem_with_every_purchase\":\"✨ Earn \u0026 Redeem with Every Purchase\",\"earn_redeem_with_every_purchase_description\":\"Watch your points grow into exciting rewards – every dollar brings you closer to freebies!\",\"exclusive_member_only_perks\":\"🎯 Exclusive Member - Only Perks\",\"exclusive_member_only_perks_description\":\"Be the first to grab limited deals \u0026 secret sales before everyone else.\",\"level_up_unlock_more\":\"🚀 Level Up = Unlock More\",\"level_up_unlock_more_description\":\"Reach new tiers to reveal VIP-only privileges – the higher you go, the sweeter it gets!\",\"creality_membership_levels_and_benefits\":\"Creality Membership Levels and Benefits\",\"more_benefits_coming_your_way_stay_tuned\":\"More benefits coming your way-stay tuned!\",\"benefits_in_total\":\"Benefits in Total\",\"exclusive_coupon\":\"Exclusive Coupon\",\"product_discount_coupon1\":\"Material Coupon\",\"product_discount_coupon2\":\"Accessory Coupon\",\"get_now\":\"Get Now\",\"exclusive_to_new_registered_members\":\" nation\",\"terms_text14\":\"You may cancel your membership at any time via your account on the website or by contacting Creality  customer service. Please note that canceling your membership will limit you to shopping as a guest on  store.creality.com, and any remaining points or rewards will be forfeited.\",\"terms_text15\":\"3.3 Responsibility\",\"terms_text16\":\"If the program cannot operate as intended for any reason, Creality reserves the right to modify, suspend, or terminate the terms, including adjustments to points, membership levels, and benefits. This may result in the loss of purchases and the cancellation of all rewards and benefits associated with the program. Any misuse, non-compliance, false statements, or actions that harm Creality’s interests (including fraud or attempted fraud) may result in the cancellation of your membership and disqualification from future participation.\",\"terms_text17\":\"3.4 Communication\",\"terms_text18\":\"Creality will notify you of any changes, suspensions, or terminations to the terms or rewards via the website, email, or updates on this page. If you unsubscribe from notifications, you may miss important updates, and no compensation will be provided for program changes or suspensions. However, Creality may still send essential information related to your account and the loyalty program.\",\"terms_text19\":\"3.5 Interpretation Rights\",\"terms_text20\":\"Creality reserves the right to modify, update, or terminate the loyalty program at any time, including adjustments to points, membership levels, and benefits. All final interpretation rights belong to Creality.\",\"earn_points\":\"Earn {points} points.\",\"earn_points_multiple\":\"Earn {points}×{multiple} points.\",\"how_to_use_your_points\":\"Points Guide\",\"please_login_to_join\":\"Please login to join\",\"unable_to_get_lottery_information\":\"Unable to get lottery information\",\"maximum\":\"You have reached the maximum number of spins for today\",\"maximum_black_ ions_info9\":\"I no longer wish to receive these emails.\",\"my_subscriptions_info10\":\"I didn't sign up for this subscription.\",\"my_subscriptions_info11\":\"The content isn't relevant to me.\",\"my_subscriptions_info12\":\"I'm not interested in products anymore.\",\"my_subscriptions_info13\":\"I believe these emails are spam.\",\"my_subscriptions_info14\":\"Other (please specify)\",\"got_the_points\":\"Got the Points\",\"go_complete_it\":\"Go complete it\",\"product_discount_coupon\":\"Product Discount\",\"order_discount_coupon\":\"Order Discount\",\"free_shipping_coupon\":\"Free Shipping\",\"byx_gety_discount_coupon\":\"Buy X Get Y\",\"email_subscription\":\"Email Subscription\",\"rewards_rules\":\"Rewards Rules\",\"type_your_reason\":\"Type your reason\",\"creality_rewards_rules\":\"Creality Rewards Rules\",\"creality_rewards_rules1_title\":\"1.About Creality Points\",\"creality_rewards_rules1_text\":\" Points are digital goods under the Creality Reward Program, designed to give back to Creality members. These points can be used in the Creality Points Mall or redeemed for other Creality platform products and value-added services.\",\"creality_rewards_rules2_title\":\"2.How to Earn Points\",\"creality_rewards_rules2_text\":\"Points can be earned by completing purchases on the Creality Store, completing tasks assigned by Creality,or participating in official events. Points-related tasks may change or update periodically. Please refer to the tasks displayed on the website for the most accurate information.\",\"creality_rewards_rules2_table1\":\"Category\",\"creality_rewards_rules2_table2\":\"Points Earned Per Action\",\"creality_rewards_rules2_table3\":\"Points Limit/Description\",\"creality_rewards_rules2_table4\":\"Register Account\",\"creality_rewards_rules2_table5\":\"1 time\",\"creality_rewards_rules2_table6\":\"Complete Personal Information\",\"creality_rewards_rules2_table7\":\"Join Facebook Official Group\",\"creality_rewards_rules2_table8\":\"Place an order\",\"creality_rewards_rules2_table9\":\"Earn 1 point for every $5 spent\",\"creality_rewards_rules2_table10\":\"Decimal points will be automatically rounded down.\",\"creality_rewards_rules3_title\":\"3.How to Use Points\",\"creality_rewards_rules3_text\":\"Points in your account can be spent on the Creality platform. You can visit the Points Mall to redeem a variety of products such as gift cards, coupons, and merchandise, or try your luck with the points wheel for exciting draws.\",\"creality_rewards_rules4_title\":\"4. Points Calculation Rules \",\"creality_rewards_rules4_text1\":\"4.1 Points earned through store purchases will be calculated starting from January 1, 2024. Orders placed  before this date will not be included.\",\"creality_rewards_rules4_text2\":\" 4.2 For points earned through store purchases, fractional points will be rounded down to the nearest whole number.\",\"creality_rewards_rules4_text3\":\"4.3 Points will be settled and credited 14 days after the order is shipped. However, this does not include amounts related to refunds, rejections, cancellations, or payments made using Creality gift cards. \",\"creality_rewards_rules4_text4\":\"4.4 In the case of returns and refunds, the corresponding points will automatically be deducted based on the refund amount.\",\"creality_rewards_rules5_title\":\"5.Points Validity Period\",\"creality_rewards_rules5_text\":\"Points are valid for one year from the date of acquisition. For example, if A earns 100 points on 2025-09-10, and these 100 points remain unused, they will expire and be deducted on 2026-09-10.\",\"creality_rewards_rules6_title\":\"6.Violation Rules\",\"creality_rewards_rules6_text\":\"If you engage in any behavior that violates these points rules, Creality reserves the right to impose penalties according to the points penalty terms outlined.\",\"creality_rewards_rules6_table1\":\"Type\",\"creality_rewards_rules6_table2\":\"Behaviors\",\"creality_rewards_rules6_table3\":\"Penalty Measures\",\"creality_rewards_rules6_table4\":\"Restrictions\",\"creality_rewards_rules6_table5\":\"Malicious Behavior\",\"creality_rewards_rules6_table6\":\"Making malicious comments, using uncivil language or insulting remarks\",\"creality_rewards_rules6_table7\":\"Deduct 100 points\",\"creality_rewards_rules6_table8\":\"Each time\",\"creality_rewards_rules6_table9\":\"Making malicious comments, using uncivil language or insulting remarksr\",\"creality_rewards_rules6_table10\":\" Using loopholes or illegal software to unfairly gain points is strictly prohibited. If detected, the associated account will be terminated, redemption privileges will be revoked, and all accumulated points under that account will be forfeited.\",\"creality_rewards_rules6_table11\":\"Deduct all points from the account, restrict related point activities.\",\"creality_rewards_rules6_table12\":\"Malicious Behavior\",\"creality_rewards_rules6_table13\":\"Posting illegal or illegal content (e.g., pornography, violence)\",\"creality_rewards_rules6_table14\":\"Deduct all points from the account, restrict related point activities.\",\"creality_rewards_rules6_table15\":\"Malicious Behavior\",\"creality_rewards_rules6_table16\":\"Reselling coupons/gift cards or products obtained through point activities and the Reward Store\",\"creality_rewards_rules6_table17\":\"1. All obtained coupons will be voided, and points will not be returned.\",\"creality_rewards_rules6_table18\":\"2. Deduct all points from the account.\",\"creality_rewards_rules6_table19\":\"3. Cancel any generated related orders and no shipment will be made.\",\"spend\":\"Spend\",\"birthday\":\"Birthdays cannot be changed. You might receive a birthday surprise!\",\"redemption_successful\":\"Exchange Failed!\",\"MAXIMUM_EXCHANGE\":\"Maximum exchange\",\"INSUFFICIENT_STOCK\":\"Insufficient stock\",\"PRODUCT_CANT_EXCHANGE\":\"Product can't exchange\",\"DRAW_LIMIT_REACHED\":\"Draw limit reached\",\"DEDUCTION_FAILED\":\"Deduction failed\",\"reawrd_store_
