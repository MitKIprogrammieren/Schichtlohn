[package]
name = "bauwerk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bauwerk – schlankes parametrisches CAD: Server (Browser), MCP und Kommandozeile"

[lib]
name = "bauwerk"
path = "src/lib.rs"

[[bin]]
name = "bauwerk"
path = "src/main.rs"

[dependencies]
bauwerk-kern = { path = "../kern" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
