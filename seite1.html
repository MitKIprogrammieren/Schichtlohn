\u003e"])</script><script>self.__next_f.push([1,"7e:{\"Overview\":\"Overview\",\"Specs\":\"Specs\",\"Instruction\":\"Instruction\",\"FAQ\":\"FAQ\",\"Rethink Personal Manufacturing\":\"Rethink Personal Manufacturing\",\"Bambu Lab New Product\":\"Bambu Lab H2D\",\"Watch Video\":\"Watch Video\",\"Dual-Nozzle Evolving 3D Printing\":\"Explore Dual-Nozzle Capabilities\",\"Elevate your designs by seamlessly combining different materials\":\"Flexible and rigid, low cost and exotic materials in one print\",\"Multi-material Printing\":\"Multi-material Printing\",\"Produce precise supports with minimal waste\":\"Perfect supports with minimal waste, purging and reloading\",\"Support Printing\":\"Dedicated Support Material\",\"Fast and efficient multi-color printing\":\"Fast and efficient multi-color printing\",\"Enhanced Multi-color Printing\":\"Efficient Multi-color Printing\",\"All in one Solution For Personal Manufacturing\":\"All-in-one Solution For Personal Manufacturing\",\"Laser For engraving cutting\":\"Laser\",\"Digital Cutting\":\"Digital Cutting\",\"Pen Drawing\":\"Pen Drawing\",\"Live Spatial Alignment\":\"Live Spatial Alignment\",\"What You See Is What You Get Precision\":\"What-You-See-Is-What-You-Get\",\"Live Spatial Alignment Description\":\"The H2D’s BirdsEye camera, combined with computer vision algorithms, delivers top-view alignment accuracy up to 0.3mm. This advanced spatial alignment allows users to place the tool path at the right position on the material – truly \\\"what-you-see-is-what-you-get.\\\"*\",\"Live Auto Arrangement\":\"Auto Arrangement\",\"Maximize material efficiency minimize waste\":\"Maximize material efficiency, minimize waste\",\"Live Auto Arrangement Description\":\"Leveraging real-time images from the BirdsEye camera, Bambu Suite can automatically arrange your project according to the shape of your material, i.e left over plywood from the previous project. This feature helps you to get the most out of every material.\",\"Don t Worry About Safety  We ve Got You Covered\":\"Don’t Worry About Safety – We’ve Got You Covered\",\"Laser Protective Windows\":\"Laser Safety Windows\",\"Operate and monitor description\":\"Operate and monitor laser projects safely without the need for goggles, thanks to our safety windows.\",\"Air Purifier\":\"Air Purifier\",\"An optional air purifier ensures clean air even during indoor laser operations\":\"An optional air purifier ensures clean air, even during indoor laser operations.*\",\"Don t Worry About the Settings We ve Got It Covered\":\"Don’t Worry About the Settings – We’ve Got It Covered\",\"Material CodeSync\":\"Material CodeSync\",\"Effortlessly sync settings with no manual input description\":\"The H2D automatically scans the QR code on your material to load the perfect preset.*\",\"Full-auto Calibration\":\"Full-auto Calibration\",\"Rethink\":\"Rethink\",\"Personal Manufacturing\":\"Personal Manufacturing\",\"Model created by\":\"Model created by @{author}\",\"Air Assist\":\"Air Assist\",\"Air Assist Desc\":\"Improve surface quality by directing high-speed air to cool the laser path, ensuring cleaner and more precise results.\",\"Contact less 3D Mesh\":\"Contact-less 3D Mesh*\",\"Contact less 3D Mesh Desc\":\"Advanced optical height measurement creates a detailed 3D mesh without physical contact, enabling precise laser work on curved surfaces.\",\"Go Big Go Fast Go Precise\":\"Go Big, Go Fast, Go Precise\",\"Vision Encoder Accuracy Enhancement\":\"Our Secret Weapon:Vision Encoder\",\"ultra fine motion accuracy\":\"50µm ultra-fine motion accuracy*\",\"Vision Encoder Accuracy Enhancement Desc\":\"An ultra-accurate vision encoder plate, combined with 5µm resolution optical measurements to track and correct toolhead motion, enables the H2D to achieve consistent and reliable distance-independent 50μm motion accuracy across the entire workspace, one order of magnitude better than its predecessor. (*Vision Encoder sold separately)\",\"Max\":\"Max\",\"Single nozzle\":\"Single-nozzle\",\"Dual nozzle\":\"Dual-nozzle\",\"King size Work Zone\":\"King-size Work Zone\",\"Break free from size constraints\":\"Break free from size constraints\",\"King size Work Zone Desc\":\"With a print volume up to 350mm×320mm×325mm*, creating large-scale projects has never been easier! From laser engraving on sizable objects to printing oversized models, the expanded capacity empowers you to bring even your most ambitious ideas to life.\",\"350 Hotend\":\"High-temp Hotend\",\"65 Chamber Heating\":\"Chamber Heating\",\"350 Hotend 65 Chamber Heating\":\"350°C Hotend \u0026 65°C Chamber Heating\",\"Unleash the full potential of high-performance materials\":\"Unleash the full potential of high-performance materials\",\"Hotend and Chamber Heating Desc\":\"Equipped with 65°C active chamber heating and a high-temperature hotend reaching up to 350°C, the H2D delivers precise closed-loop temperature control. This advanced system effectively eliminates warping and deformation in high-performance materials, ensuring superior layer bonding and maximizing their full potential.\",\"REAL High Flow Hotend\":\"REAL High-Flow Hotend*\",\"Consistently print at 600 with ease\":\"Consistently print at 600mm/s with ease\",\"High Flow Hotend Desc\":\"The H2D’s purpose-built high-flow hotend ensures reliable, high-speed printing at 600mm/s. Designed for consistent performance, it eliminates mid-print flow rate restrictions, enabling uninterrupted high-speed printing regardless of the print size or complexity.*\",\"DynaSense Extruder\":\"DynaSense Extruder\",\"Intelligent sensing for precise extrusion control\":\"Intelligent sensing for precise extrusion control\",\"DynaSense Extruder Desc\":\"Bambu Lab's proprietary PMSM servo architecture establishes an intelligent extrusion governance system. It executes 20kHz Torque/Resistance and position sampling to dynamically modulate electromagnetic torque vectors. Stabilizing extrusion and detecting filament grinding and clogging. \",\"A Smarter Safer Experience\":\"A Smarter, Safer Experience\",\"Spaghetti\":\"Spaghetti\",\"Nozzle Clumping\":\"Nozzle Clumping\",\"Air Printing\":\"Air Printing\",\"Nozzle Camera\":\"Nozzle Camera\",\"Detect issues early to save time and filament\":\"Monitor extrusion at the nozzle tip\",\"Nozzle Camera Desc\":\"The H2D features an AI-backed nozzle camera with macro lens. This intelligent monitoring system continuously tracks extrusion patterns, immediately detecting material accumulation, filament deviations, and extrusion failures.\",\"AI Powered Safe Start\":\"Pre-Flight Checklist by AI\",\"Peace of mind every time you print\":\"Peace of mind, every time you print\",\"AI Powered Safe Start Desc\":\"Prior to each operational cycle, H2D's vision system initiates a comprehensive pre-flight checklist: Chamber Integrity Scan – Detects debris across the entire print surface. Hardware Configuration Audit – Instantly identifies nozzle dimensions and build plate properties. Digital-Physical Alignment – Automatically verifies consistency between detected hardware specifications and active slicer parameters.\",\"Comprehensive Filament Monitoring\":\"SOTA Filament Monitoring\",\"Save your print from filament feeding issues\":\"15 sensors on one filament path\",\"Comprehensive Filament Monitoring Desc\":\"Unlike legacy systems with single filament run-out detectors, the H2D features comprehensive material flow monitoring. Throughout the AMS-to-nozzle path, 15 strategic sensors form an intelligent network, continuously tracking five key parameters: feeding velocity, tension, filament tip location, extruder thermal environment, and dynamic extrusion pressure. This establishes an industry-leading filament behavior control system.\",\"Learn More\":\"Learn More\",\"New Product Specs\":\"H2D Specs\",\"Unboxing video\":\"Unboxing video\",\"Unboxing video Note\":\"*Compliant with the requirements of GB/T 70.1-2008 standard                 [Equivalent standards: ISO 4762, ASME/ANSI B 18.3.1M - 1986                 (R1993), DIN EN ISO 12474]\",\"What in the box\":\"What's in the box\",\"Explore more about H2D\":\"Explore more about H2D\",\"New Product AMS Combo\":\"H2D AMS Combo\",\"New Product Laser Full Combo\":\"H2D Laser Full Combo\",\"Laser Edition\":\"Laser Edition\",\"Build Plate\":\"Textured PEI Build Plate\",\"Spool Holder\":\"Spool Holder\",\"Accessory Box\":\"Accessory Box\",\"New AMS\":\"AMS 2 Pro\",\"10W Laser Module\":\"10W Laser Module\",\"Optional\":\"Depending on selected combo \",\"40W Laser Module\":\"40W Laser Module\",\"Cutting Module\":\"Cutting Module (with Pen Holder)\",\"Laser Platform\":\"Laser Platform\",\"Cutting Platform\":\"Cutting Platform\",\"Emergency Stop Button\":\"Emergency Stop Button\",\"Multi material Printing\":\"Multi-material Printing\",\"Multi material Printing Description\":\"Combine flexible and rigid materials in a single print to create impressive interlocking structures and innovative designs beyond traditional manufacturing. Pairing high-performance materials with standard ones further reduces costs and boosts material efficiency by using premium materials only where necessary.\",\"Produce precise supports with minimal waste purging and reloading\":\"Perfect supports with minimal waste, purging and reloading\",\"Support Printing Description\":\"Print with support is no longer a headache. With H2D’s dual-nozzle setup, one nozzle can be reserved for dedicated support material, allowing secured print and perfect support interface.\",\"Enhanced Multi color Printing\":\"Efficient Multi-color Printing\",\"Fast and efficient multi color printing\":\"Fast and efficient multi-color printing\",\"Enhanced Multi color Printing Description\":\"Dual-nozzle printing reduces purge cycles in multi-color prints. H2D's smart algorithms optimize filament use, maximizing dual-nozzle efficiency to save time and materials.\",\"Specs Table Collapse\":\"$7f\",\"Specs Table No Collapse\":\"$80\",\"Specs Table No Collapse 110V\":\"$81\",\"Specs Table No Collapse 220V\":\"$82\",\"Physical Dimensions UK\":\"492*514*626 mm³\u003cdiv\u003e700*700*1100 mm³ (Recommended Space for Printer)\u003c/div\u003e\",\"Physical Dimensions US\":\"492*514*626 mm³\u003cdiv\u003e(Package Size: 580*605*750mm)\u003c/div\u003e\u003cdiv\u003e700*700*1100 mm³ (Recommended Space for Printer)\u003c/div\u003e\",\"Physical Dimensions Asia\":\"492*514*626 mm³\u003cdiv\u003e(Package Size:\u003cbr\u003eUS Version: 580*605*750mm\u003cbr\u003eUK and other Version: 620*620*755mm)\u003c/div\u003e\u003cdiv\u003e700*700*1100 mm³ (Recommended Space for Printer)\u003c/div\u003e\",\"Gross Weight UK\":\"31 kg\u003cbr\u003e(Gross weight: H2D: 38.5 kg; H2D AMS Combo: 42.3 kg;\u003cbr\u003eH2D Laser Full Combo: 46.2 kg)\",\"Gross Weight US\":\"31 kg\u003cbr\u003e(Gross weight: H2D: 40.6 kg; H2D AMS Combo: 44.2 kg;\u003cbr\u003eH2D Laser Full Combo: 48.2 kg)\",\"Gross Weight Asia\":\"31 kg\u003cbr\u003e(Gross weight:\u003cbr\u003eUS Version — H2D: 40.6 kg; H2D AMS Combo: 44.2 kg; H2D Laser Full Combo: 48.2 kg\u003cbr\u003eUK and other Version — H2D: 38.5 kg; H2D AMS Combo: 42.3 kg; H2D Laser Full Combo: 46.2 kg)\",\"Packaging Update Note\":\"Packaging is now updating, new and old designs may be shipped randomly. Packaging may vary, shipping costs are the same for all orders placed at the same time.\",\"Specs Table Notes\":\"* To ensure the heat bed quickly reaches the needed temperature, the printer will maintain maximum power for no more than 3 minutes .\",\"Expand table\":\"Expand table\",\"Collapse table\":\"Collapse table\",\"Download PDF\":\"Download TDS\",\"Full auto Calibration Description\":\"A single tap initiates automated laser focus verification and material measurement, eliminating manual adjustments.\",\"10W and 40W 405nm Laser for engraving cutting\":\"10W and 40W 455nm Laser for engraving \u0026 cutting\",\"Precise cutting and foiling with a variety of versatile blades\":\"Precise cutting on variety of materials\",\"Drawing and writing\":\"Drawing and writing\",\"New Product\":\"H2D\",\"Stop Button\":\"Stop Button\",\"Emergency\":\"Emergency\",\"A Serious Laser Machine\":\"A Serious Laser Machine\",\"Arrange\":\"Arrange\",\"X1C AND P1S\":\"X1C\",\"Detect issues\":\"Detect issues early to save time and filament.\",\"footnotes\":\"$83\",\"Explore More About H2D\":\"Explore More About H2D\",\"Frequently asked questions\":\"Frequently Asked Questions\",\"Quest 1\":\"1.Can H2D be upgraded to H2D Laser Edition?\",\"Answer one\":\"$84\",\"Quest 2\":\"2.Are the left and right hotends exactly the same?\",\"Answer two\":\"\u003cdiv\u003eYes, the left and right hotends have identical structures and materials, and can be used interchangeably.\u003c/div\u003e\",\"Quest 3\":\"3.What is the maximum number of AMS 2 Pro and AMS HT units that the H2D supports? How many colors can it print at most?\",\"Answer three\":\"\u003cdiv\u003eThe H2D supports a maximum of 4 AMS 2 Pro and 8 AMS HT connected simultaneously, a total of 12 units with 24 slots. \u003c/div\u003e \u003cdiv\u003eBecause H2D is a dual-hotend printer, and in the most extreme scenario, all AMS can be connected to one hotend     while the other hotend uses an external spool holder, it can support up to 25 colors. \u003c/div\u003e\",\"Quest 4\":\"4.Is H2D compatible with first generation AMS?\",\"Answer four\":\"\u003cdiv\u003eThe first-generation AMS has been confirmed to have full plug-and-play compatibility and can be used with the H2D for multi-color printing, but it does not support the AMS drying function.\u003c/div\u003e \u003cdiv\u003eDue to the fundamental differences in the feeding mechanism and buffering structure, the H2D does not support the AMS lite.\u003c/div\u003e\",\"Question 5\":\"5.AMS 2 Pro is directly connected to the printer through the 6-pin ports, so what are the two 4-pin ports on the back of the printer used for?\",\"Answer five\":\"\u003cdiv\u003eThe two 4-pin ports on the back are reserved for future expansion accessories. For example, to upgrade a non-laser version of the printer to a laser version, one of these ports can be used to connect an external air pump.\u003c/div\u003e\",\"Question 6\":\"6.Can I use the A1 series Hotend on the H2D? Conversely, can H2D hotends be used on A1 series printers?\",\"Answer six v2\":\"\u003cdiv\u003eAlthough the hotend of the H2D series is similar to the A1 hotend in structure , it is not exactly the same.\u003c/div\u003e \u003cbr /\u003e \u003cdiv\u003eThe H2D hotends are specifically designed for the H2D printer, offering optimized compatibility. For example, they support a larger maximum volumetric flow rate, lower clogging risk, more precise nozzle offset calibration between the left and right hotends, and automatic hotend type recognition via the live camera.\u003c/div\u003e \u003cbr /\u003e \u003cdiv\u003eTherefore , to ensure you get the best print quality, we strongly recommend that you do not use the A1 hotend for H2D printers.\u003c/div\u003e \u003cbr /\u003e \u003cdiv\u003ePurchasing additional H2D hotends for use on A1 printers is feasible. However, you will also need to use the H2D hotend silicone sock.\u003c/div\u003e\",\"Question 7\":\"7.What are the differences between the 10W and 40W laser modules? How should I choose?\",\"Answer seven\":\"\u003cdiv\u003eBoth the 10W and 40W laser modules are blue light lasers that support processing a variety of materials, including wood, rubber, metal sheets, leather, dark acrylic, and stone. However, due to differences in power and size, there are the following distinctions:\u003c/div\u003e \u003cbr /\u003e \u003cdiv\u003e1.Maximum cutting thickness(For Basswood Plywood): \u003c/div\u003e \u003cdiv\u003e10W laser module: 5mm; \u003c/div\u003e \u003cdiv\u003e40W laser module: 15mm;\u003c/div\u003e \u003cbr /\u003e \u003cdiv\u003e2.Maximum engraving speed(For Basswood Plywood): \u003c/div\u003e \u003cdiv\u003e10W laser module: 400mm/s ; \u003c/div\u003e \u003cdiv\u003e40W laser module: 1000mm/s ；\u003c/div\u003e \u003cbr /\u003e \u003cdiv\u003e3.Processable Area:\u003c/div\u003e \u003cdiv\u003e10W laser module: Maximum processing area X310mm * Y270mm, maximum processing height 280mm；\u003c/div\u003e \u003cdiv\u003e40W laser module: Maximum processing area X310mm * Y250mm, maximum processing height 265mm；\u003c/div\u003e\",\"Question 8\":\"8.Is a USB included as standard? What functions are affected without a USB? \",\"Answer eight\":\"\u003cdiv\u003eThe package does not include a standard USB flash drive. You can still initiate printing normally without a USB, as the printer has built-in storage space to run print files.\u003c/div\u003e \u003cdiv\u003eHowever, without a USB inserted, the following functions will be affected:\u003c/div\u003e \u003cbr /\u003e \u003cdiv\u003e1. The recording and time-lapse photography functions can't be turned on;\u003c/div\u003e \u003cdiv\u003e2. Printing cannot be initiated through the LAN;\u003c/div\u003e \u003cdiv\u003e3. Print files cannot be sent to the machine for storage through the studio;\u003c/div\u003e \u003cdiv\u003e4. Log files cannot be exported;\u003c/div\u003e \u003cbr /\u003e \u003cdiv\u003e\u003cspan style=\\\"font-weight: 700;\\\"\u003eUSB requirements: \u003c/span\u003eUSB2.0 protocol or above (actual minimum write speed needs to be greater than 10M/s), supported file formats are FAT32 and exFAT. And the printer only supports mounting one USB, and cannot connect multiple USB via a USB hub.\u003c/div\u003e\",\"Question 9\":\"9.Why can’t I freely select hotend for printing with the printer’s built-in files?\",\"Answer 9\":\"\u003cdiv\u003eThe hotend to be used for printing has already been determined when the model file is sliced. As for the built-in models, the right hotend has been selected during the slicing process, so it is impossible to change the hotend used for printing on the printer screen.\u003c/div\u003e \u003cdiv\u003eWhen you slice the file in Bambu Studio and send the print task , you can freely choose to use the left hotend or the right hotend. For some filaments, such as TPU and PPS/PPA-CF, it is recommended to use specific hotends for printing.\u003c/div\u003e \u003cbr /\u003e \u003cdiv\u003eFor more details on H2D filament printing, please check the \u003ca href=\\\"https://wiki.bambulab.com/h2/h2d-filament-printing-guide\\\"\u003ewiki\u003c/a\u003e.\u003c/div\u003e\",\"Question 10\":\"10. Will the smoke and dust generated by laser operations affect my printer's precision and lifespan?\",\"Answer 10\":\"\u003cdiv\u003eH2D is equipped with an efficient exhaust system that effectively removes smoke and dust generated by laser operations, significantly reducing contamination. During R\u0026D, we conducted rigorous testing to ensure that with regular machine cleaning, the impact of smoke and dust on performance and precision is negligible. For detailed cleaning instructions, please refer to: \u003ca href=\\\"https://wiki.bambulab.com/h2/maintenance/period-maintenance\\\"\u003ewiki\u003c/a\u003e\u003c/div\u003e\",\"Question 11\":\"11. How can I improve the success rate and quality of TPU printing?\",\"Answer 11\":\"\u003cdiv\u003eDue to the flexible nature of TPU filaments, there are some operational issues that can arise during feeding and printing. To facilitate TPU printing, we have created a dedicated Wiki guide. Simply follow the instructions in the Wiki to successfully print with TPU filaments: \u003ca href=\\\"https://wiki.bambulab.com/h2/h2d-tpu-printing-guide\\\"\u003ewiki\u003c/a\u003e\u003c/div\u003e\",\"Question 12\":\"12. Are there any special safety precautions I need to take when using the laser function?\",\"Answer 12\":\"\u003cdiv\u003eBecause laser processing involves using high-energy lasers on potentially flammable materials, we strongly advise users not to leave the machine unattended during laser operations. Please maintain constant vigilance over the machine's operational status and ensure that there are no flammable or explosive materials in the machine's surroundings. For more information please refer to: \u003ca href=\\\"https://wiki.bambulab.com/h2/laser-safety-document\\\"\u003ewiki\u003c/a\u003e \u003cbr /\u003e \u003cbr /\u003e \u003cdiv\u003eFor more information about H2D, refer to the official \u003ca href=\\\"https://wiki.bambulab.com/h2d\\\"\u003ewiki\u003c/a\u003e.\u003c/div\u003e\u003c/div\u003e\",\"Specs Table Notes2\":\"* To ensure the heat bed quickly reaches the needed temperature, the printer will maintain maximum power for no more than 3 minutes .\",\"Safety Key\":\"Safety Key\",\"Ventilation Pipe\":\"Ventilation Pipe\",\"Laser Cutting Materials\":\"Laser \u0026 Cutting Materials\"}\n"])</script><script>self.__next_f.push([1,"85:{\"step one label\":\"1. Choose a color combination\",\"Complementary\":\"Dual-color\",\"Triadic\":\"Tri-color\",\"Tetradic\":\"Quad-color\",\"step2 label\":\"2. Give it a name \",\"step2 label option\":\"(Optional)\",\"Write down here\":\"Write down here\",\"Submit\":\"Submit\",\"Suggest a New Color\":\"Suggest a New Color\",\"HEX\":\"HEX\",\"Edit Color\":\"Edit Color\",\"Saturation\":\"Saturation\",\"Luminance\":\"Luminance\",\"Hue\":\"Hue\",\"Pick a Color\":\"1. Pick a Color\"}\n86:{\"color\":\"color\",\"colors\":\"colors\",\"item\":\"item\",\"items\":\"items\",\"more\":\"more\"}\n87:{\"title\":\"Need to Know\",\"feature\":\"Feature\",\"delivery\":\"Delivery\",\"service\":\"Service\",\"payment\":\"Payment\"}\n88:{\"SubmitSN\":\"Submit\",\"title\":\"Serial Number Verification\",\"input-title\":\"Please enter the printer's serial number\",\"SN-dialog-tip\":\"The device serial number (SN) can usually be found in the printer’s screen menu. For detailed instructions, please refer to \u003cDetailLink\u003ethe following link\u003c/DetailLink\u003e. \u003cbr\u003e\u003c/br\u003e\u003cbr\u003e\u003c/br\u003eThis service is only valid in the country or region selected at the time of purchase. To ensure full coverage and benefits, the
