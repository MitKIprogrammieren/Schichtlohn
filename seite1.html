e High-performance Filaments\":\"Engineered To Better Dry \u0026 Use High-performance Filaments\",\"Faster multi-color printing\":\"Faster multi-color printing\",\"Xiaomi Su7 Ultra Prototype by 大匠\":\"Xiaomi Su7 Ultra Prototype by @大匠\",\"Active Air Vent\":\"Electro-Magnetic Air Vent\",\"Fast filament drying air-tight filament storage\":\"Fast filament drying \u0026 air-tight filament storage\",\"24-Colors\":\"24-Colors\",\"Materials\":\"Multi-material\",\"Serial connect up to 4 AMS 2 Pro 8 AMS HT total of 24 filaments\":\"Serially connect up to 4 AMS 2 Pro \u0026 8 AMS HT units, total of 24 filaments\",\"65 Drying\":\"65°C Drying\",\"Up to 65 drying temperature\":\"Up to 65°C drying temperature\",\"Brushless Motor\":\"Brushless Motor\",\"60 faster feeding speed\":\"60% faster feeding speed\",\"Automated venting facilitates dehumidification during drying and airtight sealing for weeks of quality printing\":\"Automated venting facilitates dehumidification during drying and ensures airtight sealing for weeks of high-quality printing.\",\"Auto-rotate Drying\":\"Auto-rotate Drying\",\"During the drying process the filament spools rotate automatically to provide more even drying\":\"During the drying process, the filament spools rotate automatically to ensure more even drying.\",\"RFID Sync\":\"RFID Sync\",\"AMS 2 Pro uses RFID to auto-match drying settings for Bambu official filaments no manual input needed\":\"AMS 2 Pro uses RFID to auto-match drying settings for Bambu official filaments, no manual input needed.\",\"Speed Up Faster Multi-material Printing\":\"Speed Up! Faster Multi-material Printing!\",\"Average 10min saved for 100 filament changes\":\"Saves an average of 10 minutes per 100 filament changes.\",\"Evolved Polished Design Details\":\"Evolved, Polished Design Details\",\"Easy-access Guide Rails\":\"Tool-Free Filament Tubes Access\",\"See-through filament guide rails and a quick-release feeding mechanism make removing stuck filament quicker and easier\":\"Removing snapped filament from the first-gen AMS requires extracting all spools and disassembling the shell with two screws, taking 3-5 minutes. In contrast, the AMS 2 Pro offers direct, tool-free access to filament tubes from the top.\",\"Ceramic Inlet\":\"Ceramic Inlet\",\"Accurate Temp Sensor\":\"Accurate Temp/Humidity Sensor\",\"Ceramic filament inlet offering indestructible durability\":\"Ceramic filament inlets with Vickers hardness of 1200 significantly enhance durability.\",\"Accurate temperature and humidity sensor for clearer readings\":\"Accurate temperature and humidity sensor for clearer readings\",\"Compatible With All Bambu Lab Printers\":\"Compatible With All Bambu Lab Printers\",\"The AMS 2 pro is compatible with all Bambu Labs products\":\"The AMS 2 Pro will be compatible with all Bambu Lab products.\",\"SpecificationTable\":{\"item\":\"Item\",\"specification\":\"Specification\",\"body\":\"Body\",\"dimensions\":\"Dimensions\",\"dimensionsValue\":\"372*280*226 mm³\",\"netWeight\":\"Net Weight\",\"netWeightValue\":\"2.5 kg\",\"housingMaterial\":\"Housing Material\",\"housingMaterialValue\":\"ABS/PC\",\"printing\":\"Printing\",\"filamentSupported\":\"Filament Supported\",\"filamentSupportedValue\":\"PLA, PETG, ABS, ASA, PET, PA, PC, PVA (dried), BVOH (dried), PP, POM, HIPS, Bambu PLA-CF/PAHT-CF/PETG-CF/Support for PLA/PETG, and TPU for AMS\",\"filamentNotSupported\":\"Filament Not Supported\",\"filamentNotSupportedValue\":\"TPE, generic TPU, PVA (damp), BVOH (damp),Bambu PET-CF/TPU 95A, and other filament that contains carbon fiber or glass fiber\",\"filamentDiameter\":\"Filament Diameter\",\"filamentDiameterValue\":\"1.75 mm\",\"spoolDimension\":\"Spool Dimension\",\"spoolDimensionWidth\":\"Width: 50 mm-68 mm\",\"spoolDimensionDiameter\":\"Diameter: 197 mm-202 mm\",\"rfidIdentification\":\"RFID Identification\",\"supported\":\"Supported\",\"drying\":\"Drying\",\"highestTemperature\":\"Highest Temperature\",\"highestTemperatureValue\":\"* 65 °C\",\"filamentSupportedDryingValue\":\"PLA, PETG, Support for PLA/PETG, ABS*, ASA*, PET*, PA*, PC*, PVA*, BVOH *, PP, POM*, HIPS*, Bambu PLA-CF*/ PAHT-CF*/ PETG-CF*, and TPU for AMS*\",\"activeMoistureDischarge\":\"Active Moisture Discharge\",\"sealedStorage\":\"Sealed Storage\",\"temperatureHumidityDetection\":\"Temperature \u0026 Humidity Detection\",\"temperatureHumidityDescription\":\"Supported. Real-time temperature and humidity can be displayed on the screen, Bambu Studio, and Bambu Handy.\",\"power\":\"Power\",\"input\":\"Input\",\"powerInputValue\":\"24 V 4 A\",\"filamentDryingNote\":\"* Filaments marked with * require higher drying temperature. The AMS 2 Pro cannot dry them completely. If you want better drying performance for these filaments, we recommend purchasing an AMS HT.\",\"hotTips\":\"*The maximum temperature of the drying function can only be achieved when the ambient temperature is above 25 °C. When the ambient temperature is below 25 °C, due to natural heat dissipation, the actual drying temperature may not reach the maximum value.\",\"downloadFilamentTDS\":\"Download TDS\"},\"Specs\":{\"AMS 2 Pro Specs\":\"AMS 2 Pro Specs\"},\"Whats in the Box\":\"What’s in the Box\",\"Explore more about AMS 2 Pro\":\"Explore more about AMS 2 Pro\",\"ComparisonImage\":{\"Dry\":\"Dry\",\"Undry\":\"Moist\"},\"FAQ\":{\"question1\":\"1.There is an independent power port on the AMS 2 Pro in addition to the 6-pin port. Is this necessary?\",\"answer1\":\"\u003cspan\u003eWhen the H2D is used with a single AMS 2 Pro, all functions, including automatic feeding and drying, can be utilized without an external \u003ca style='color: #00CD0A' href='/products/ams-2-pro-switching-adapter' target='_blank'\u003epower adapter\u003c/a\u003e.\u003cbr/\u003eWhen the H2D is used with more than one AMS 2 Pro, if some AMS 2 Pro units are used for multi-color printing while others are used for filament drying, then the AMS 2 Pro units used for drying require an external \u003ca style='color: #00CD0A' href='/products/ams-2-pro-switching-adapter' target='_blank'\u003epower adapter\u003c/a\u003e. The external power adapter can be purchased from the Bambu Lab official store.\u003c/span\u003e\",\"question2\":\"2.Can the AMS 2 Pro be used with all series printers?\",\"answer2\":\"Yes, AMS 2 Pro is compatible with all printers. \u003cbr /\u003e The AMS 2 Pro requires specific accessory configurations for various Bambu Lab 3D printers.\u003cbr /\u003e\u003cbr/\u003eSee the  \u003ca style='color: #00CD0A' href='https://wiki.bambulab.com/ams/manual/multi-model-AMS-compatibility-guide' target='_blank'\u003eMultiple AMS Units Connection Guide\u003c/a\u003e for detailed setup instructions.\",\"question3\":\"3.Can AMS and AMS 2 Pro be used at the same time for printing?\",\"answer3\":\"Yes, you can use both AMS and AMS 2 Pro on one H2D.\",\"question4\":\"4.Can I dry filament while printing?\",\"answer4\":\"Currently, drying is not supported for AMS 2 Pro/HT that are actively involved in the printing process, including those that may be used for automatic refill during the current print job. Printing while drying is not yet supported.\u003cbr/\u003eThe only \\\"dry while printing\\\" scenario currently supported is: the printer uses some of the connected AMS 2 Pro/HT units or an external spool holder for printing, while the AMS 2 Pro/HT units not involved in the current print job can be used for drying.\u003cbr/\u003eIf the printer is feeding or printing, and at the same time powering 1 AMS 2 pro for drying, the drying power will be automatically reduced, in order to ensure that the printing power is prioritized. So it is recommended to use the external \u003ca style='color: #00CD0A' href='/products/ams-2-pro-switching-adapter' target='_blank'\u003epower adapter\u003c/a\u003e for best drying results.\",\"answer4_v1\":\"Certain models currently support the Simultaneous Drying and Printing Function.Please refer to the \u003ca style='color: #00CD0A' href='https://wiki.bambulab.com/en/ams-2-pro/manual/drying-function' target='_blank'\u003e Wiki \u003c/a\u003e for the minimum supported firmware version and operation guidelines.\",\"question5\":\"5.Can I get power from the printer for drying?\",\"answer5_v1\":\"When using \u003cb\u003eA1/P1/X1 series \u003c/b\u003e, One Switching Adapter is required for each AMS 2 Pro unit. \u003cb\u003eH2/P2/X2D printers\u003c/b\u003e can power one AMS 2 Pro unit for drying without the switching adapter. To dry filaments in multiple units simultaneously, each additional AMS 2 Pro unit requires its own Switching Adapter.\",\"answer5\":\"The H2D printer supports powering one AMS 2 Pro for drying directly from the printer. If you need to dry filament in multiple AMS 2 Pro units simultaneously, the additional AMS 2 Pro units require power supply via a \u003ca style='color: #00CD0A' href='/products/ams-2-pro-switching-adapter' target='_blank'\u003epower adapter\u003c/a\u003e (purchased separately).\",\"question6\":\"6.Does it support standalone drying without connecting to the printer?\",\"answer6\":\"When using the AMS 2 Pro drying function, the AMS 2 Pro must be connected to the printer via a 6-pin bus cable to ensure that the printer is powered on and set to filament drying mode.\u003cbr/\u003eThe AMS 2 Pro cannot perform standalone drying without a connection to the printer.\"},\"Bambu AMS 2 Pro\":\"Bambu AMS 2 Pro\",\"Desiccant\":\"Desiccant\",\"PTFE Tube\":\"PTFE Tube (185mm*2+225mm*2+900mm*1)\",\"Bambu Bus Cable-6Pin\":\"Bambu Bus Cable-6Pin\"},\"production\":{\"ADD to cart\":\"Add to Cart\",\"Add\":\"Add\",\"Added successfully\":\"Added successfully\",\"Save\":\"Save\",\"Close\":\"Close\",\"Details\":\"Details\",\"Email address\":\"Email address\",\"NEW\":\"NEW\",\"NOTIFY ME WHEN AVAILABLE\":\"Notify Me When Available\",\"Notify me when available\":\"Notify Me When Available\",\"already registered\":\"You have already registered for a notification for that item.\",\"enter email\":\"Please enter your e printing with MakerWorld\":\"1-click printing with MakerWorld\",\"Print Like A PRO From Your Very First Use\":\"Print Like A PRO From Your Very First Use\",\"Start printing with a few clicks on your phone\":\"Start printing with a few clicks on your phone, no need to worry about the tedious settings.\",\"Browse endless selections\":\"Browse endless selections of high-quality models tailored to your printers on MakerWorld!\",\"Full auto Calibration SubTitle\":\"Full-auto Calibration\",\"Absolutely Hassle-free\":\"Absolutely Hassle-free\",\" A1 handles various calibrations all by itself\":\" A1 handles various calibrations all by itself. It meticulously calibrates the Z-offset, bed-level, vibration resonance and nozzle pressure for EVERY print job, automatically.\",\"AMS Multi-color Printing\":\"AMS Multi-color Printing\",\"The Most Reliable Multi-color System\":\"The Most Reliable Multi-color System\",\"The AMS lite description\":\"The AMS lite has been recognized as the most reliable multi-color 3D printing solution. It also features RFID-sync to automatically match the best print settings for your Bambu filaments, delivering perfect print quality without manual tuning of the filament profile.\",\"High-speed Precision\":\"High-speed Precision\",\"The High-speed You Can Truly Rely On\":\"The High-speed You Can Truly Rely On\",\"A1 description\":\"A1 is equipped with low-drag linear rails, a powerful MCU,accelerometers, a nozzle pressure sensor, and an advanced motion control system that maximizes their potential. Its high-speed performance is built on a solid foundation, ensuring consistent reliability with stable and uniform output for every print.\",\"Intelligent Print Monitoring\":\"Intelligent Print Monitoring\",\"Put Your Printing On Autopilot\":\"Put Your Printing On Autopilot\",\"3D printing description\":\"3D printing is a complex task where many things can go wrong. The A1 is equipped with a comprehensive print status monitoring system to help keep the print job in check.\",\"Full-size Print Volume\":\"Full-size Print Volume\",\"Generous Space for You to Expand Your Fantasy\":\"Generous Space for You to Expand Your Fantasy\",\"A1 features description\":\"A1 features 256mm*256mm*256mm build volume, bigger than most of the entry-level printers. Print a helmet in one go, we got you.\",\"Connected with Privacy in Mind\":\"Connected with Privacy in Mind\",\"Start Control on Whatever Device You Prefer\":\"Start \u0026 Control on Whatever Device You Prefer\",\"connect your A1 description\":\"Not only can you connect your A1 to any device you prefer through Bambu Cloud Service, but you can also do so through LAN-only mode. We offer fully customizable connection options to match your privacy preferences.\",\"Active Motor Noise Canceling\":\"Active Motor Noise Canceling\",\"Print Silently\":\"Print Silently\",\"active motor noise canceling description\":\"The A1 can calibrate parameters to match tiny individual differences between each drive motor. This compensates for the unwanted harshness of motor noise.\",\"Learn More\":\"Learn More\",\"Item\":\"Item\",\"A1 Specification\":\"A1 Specification\",\"Body\":\"Body\",\"Body Key\":\"Build Volume(W*D*H)\",\"Body Value\":\"256*256*256 mm³\",\"Toolhead\":\"Toolhead\",\"Hot End\":\"Hot End\",\"All-Metal\":\"All-Metal\",\"Nozzle\":\"Nozzle\",\"Stainless Steel\":\"Stainless Steel\",\"Max Hot End Temperature\":\"Max Hot End Temperature\",\"Max Hot Value\":\"300 °C\",\"Nozzle Diameter\":\"Nozzle Diameter\",\"Nozzle Diameter Size\":\"0.4 mm (Included) \u003cbr /\u003e\\n                            0.2 mm, 0.6 mm, 0.8 mm\",\"Heatbed\":\"Heatbed\",\"Build Plate\":\"Build Plate\",\"Build Plate Value\":\"Bambu Textured PEI Plate (Included) \u003cbr /\u003e\\n                            Bambu Smooth PEI Plate \u003cbr /\u003e\\n                            Bambu Dual-Texture PEI Plate\\n                            \u003cbr /\u003e\\n                            Bambu High Temperature Plate (Smooth PEI) \u003cbr /\u003e\\n                            Bambu Cool Plate\",\"Max Build Plate Temperature\":\"Max Build Plate Temperature\",\"Temperature Value\":\"100°C\",\"Speed\":\"Speed\",\"Max Speed of Tool Head\":\"Max Speed of Tool Head\",\"Tool Head Value\":\"500mm/s\",\"Max Acceleration of Tool Head\":\"Max Acceleration of Tool Head\",\"Acceleration Value\":\"10000mm/s²\",\"Supported Filament\":\"Supported Filament\",\"Filament Type\":\"PLA, PETG, TPU, PVA\",\"Ideal\":\"Ideal\",\"Another Filament Type\":\"ABS, ASA, PC, PA, PET, \u003cbr /\u003e\\n                            Carbon/Glass Fiber Reinforced Polymer\",\"Not Recommended\":\"Not Recommended\",\"Sensors\":\"Sensors\",\"Chamber Monitoring Camera\":\"Chamber Monitoring Camera\",\"Chamber Camera Value\":\"Low Frame Rate Camera (Up to 1080P) \u003cbr /\u003e\\n                            Timelapse Supported\",\"Filament Run Out Sensor\":\"Filament Run Out Sensor\",\"Filament Odometry\":\"Filament Odometry\",\"Yes\":\"Yes\",\"Power Loss Recover\":\"Power Loss Recover\",\"Filament Tangle Sensor\":\"Filament Tangle Sensor\",\"Physical Dimensions\":\"Physical Dimensions\",\"Physical Dimensions Value\":\"A1 : 465*410*430 mm³ , Package size : 596*536*325\\n                            mm³ , Net weight 8.3 kg , Gross weight 13 kg\\n                            \u003cbr /\u003e\\n                            A1 Combo : Package size 560*540*430 mm³ , Gross\\n                            weight (AMS lite included) 13.5 kg\",\"Download A1 TDS\":\"Download A1 TDS\",\"Unboxing Video Highlights\":\"Unboxing Video Highlights\",\"short video guides\":\"This short video guides you through a quick unboxing experience.\",\"Short Video Meta Info\":\"*Compliant with the requirements of GB/T 70.1-2008 standard\\n              [Equivalent standards: ISO 4762, ASME/ANSI B 18.3.1M - 1986\\n              (R1993), DIN EN ISO 12474]\",\"Bambu Lab A1\":\"Bambu Lab A1\",\"Purge Wiper\":\"Purge Wiper\",\"Spool Holder\":\"Spool Holder\",\"Stainless Steel Nozzle\":\"Stainless Steel Nozzle（pre-installed）\",\"PTFE Tube\":\"PTFE Tube*1\",\"Bambu Filament Samples\":\"Bambu Filament Samples-20g(Random Color)\",\"Accessory Box\":\"Accessory Box\",\"A1 Combo Add ons\":\"A1 Combo Add-ons\",\"AMS lite Body\":\"AMS lite Body\",\"AMS lite Stand\":\"AMS lite Stand\",\"AMS lite Rotary Spool Holder\":\"AMS lite Rotary Spool Holder (x4)\",\"PTFE Tubes\":\"PTFE Tubes\",\"Explore More About A1\":\"Explore More About A1\",\"The NEW Bambu Lab A1\":\"The NEW Bambu Lab A1!\",\"Bambu Lab A1 Review\":\"Bambu Lab A1 Review - ARE YOU HAPPY about this?!\",\"Hands On\":\"Hands-On: Bambu Lab A1 $400 3D Printer!\",\"Bambu Lab A1 detailed test\":\"Bambu Lab A1 detailed test - ‘Just works’ 3D printing for\\n                      a great price\",\"Bambu Lab A1 First Impressions\":\"Bambu Lab A1 - First Impressions\",\"Is The A1 Worth It\":\"Is The A1 Worth It? Diving Into Bambu Labs Newest 3d\\n                      Printer\",\"NEW Bambu Lab A1\":\"NEW 👉 Bambu Lab A1 - DETAILED REVIEW (Full Analysis \u0026amp;\\n                      Comparison with A1 Mini)\",\"Bambu Lab A1 First Looks and Amazing 3D Printing\":\"Bambu Lab A1 - First Looks and Amazing 3D Printing\\n                      Results!\",\"Frequently asked questions\":\"Frequently asked questions\",\"Do you have an official unboxing guide\":\"1. Do you have an official unboxing guide?\",\"Official Unboxing Guide Answer\":\"\u003cp\u003e\\n                      A: Yes, please refer to this\\n                      \u003ca\\n                        href='https://wiki.bambulab.com/a1/manual/unboxing-a1-combo'\\n                        target='_blank'\\n                      \u003e\\n                        wiki link\u0026nbsp;\\n                      \u003c/a\u003e\\n                      for the unboxing video guide.\\n                    \u003c/p\u003e\",\"What is the maximum print size of the A1\":\"2. What is the maximum print size of the A1?\",\"Maximum size for A1 Answer\":\"\u003cp\u003e\\n                      A: 256 * 256 *256 mm³. For more details, please check\\n                      \\n                      \u003ca\\n                        href='https://wiki.bambulab.com/a1/manual/faq'\\n                        target='_blank'\\n                      \u003e\\n                        here.\\n                      \u003c/a\u003e\\n                    \u003c/p\u003e\",\"What Filaments can A1 Print\":\"3. What Filaments can A1 Print?\",\"Filaments A1 Answer\":\"$1f\",\"Is it OK to enclose the A1\":\"4. Is it OK to enclose the A1?\",\"Enclose the a1 answer\":\"\u003cp\u003e\\n                      A: We don't recommend enclosing the A1. For more details,\\n                        please check \\n                      \u003ca\\n                        href='https://wiki.bambulab.com/a1/manual/faq'\\n                        target='_blank'\\n                      \u003e\\n                        here.\\n                      \u003c/a\u003e\\n                    \u003c/p\u003e\",\"Can you use multiple AMS lite\":\"5. Can you use multiple AMS lite units with the A1 for up to\\n                    16 color prints?\",\"ASM Lite Multiple Answer\":\"\u003cp\u003e\\n                      A: The A1 can only support one AMS lite, which means it\\n\\t\\t\\t\\t\\t\\t\\t\\t\\t\\t\\t\\tcan print with a maximum of 4 colors. For more details,\\n\\t\\t\\t\\t\\t\\t\\t\\t\\t\\t\\t\\tplease check \\n                      \u003ca\\n                        href='https://wiki.bambulab.com/a1/manual/faq'\\n                        target='_blank'\\n                      \u003e\\n                        here.\\n                      \u003c/a\u003e\\n                    \u003c/p\u003e\",\"Can I use the AMS on the A1\":\"6. Can I use the AMS on the A1?\",\"Use AMS On A1 Answer\":\"\u003cp\u003e\\n                      A: Yes. To connect the printer to the AMS, an AMS HUB (SA013) accessory is needed. The AMS hub accessory is specifically designed for A1-series 3D printers, serving as a standardized hub for seamless connectivity and integrated functionality between the AMS, AMS 2 Pro, and AMS HT.\u003c/p\u003e\",\"Can AMS lite be mounted\":\"7. Can AMS lite be mounted on the beam of the A1 to reduce\\n                    space occupation? If so,how should I proceed with the\\n                    operation?\",\"AMS Mounted Answer\":\"$20\",\"install AMS lite on the beam\":\"8. If I install AMS lite on the beam, will the filament\\n                    spool slide down, or will it affect the accuracy of\\n                    vibration compensation?\",\"Install AMS Lite Answer\":\"\u003cp\u003e\\n                      A: As long as the AMS lite is correctly installed, the\\n                      filament spool should not slide down, even if the previous\\n                      two spools have a certain forward tilt angle.\\n                      Additionally, to avoid affecting the accuracy of vibration\\n                      compensation, you can add reinforcement to the column. For\\n                      more details, please check \\n                      \u003ca\\n                        href='https://wiki.bambulab.com/a1/manual/faq'\\n                        target='_blank'\\n                      \u003e\\n                        here.\\n                      \u003c/a\u003e\\n                    \u003c/p\u003e\",\"Will you sell official refurbished A1 printers\":\"9. Will you sell official refurbished A1 printers?\",\"Sell Offical Refurbished Answer\":\"\u003cp\u003e\\n                      A: Currently, Factory Refurbished A1 units are only\\n                        available for sale within the Chinese domestic market. There\\n                        are no plans for overseas sales of Factory Refurbished units\\n                        at this time.\\n                      \u003cbr /\u003e\\n                      For your reference, all Refurbished units will have an \\\"R\\\"\\n                        mark located on the back of the Base Housing, near the power\\n                        cord plug.For more details, please check\\n                      \u003ca\\n                        href='https://wiki.bambulab.com/a1/manual/faq'\\n                        target='_blank'\\n                      \u003e\\n                        here.\\n                      \u003c/a\u003e\\n                    \u003c/p\u003e\",\"Are the A1 3D printers currently available\":\"10. Are the A1 3D printers currently available for sale from\\n                    the same batch that was recalled in January 2024?\",\"A1 Print Available Answer\":\"\u003cp\u003eA: No,they aren't. A1 3D printers sold after January 30,\\n                        2024 are not from the same batch as those recalled\\n                        before.They already contain all the necessary fixes to\\n                        mitigate the heatbed cable issue which caused the recall.\u003c/p\u003e\",\"A Colorful Gateway to 3D Printing\":\"A Colorful Gateway to 3D Printing\",\"Watch video\":\"Watch video\",\"What in the box\":\"What's in the box\",\"A1 SPECS\":\"A1 SPECS\"},\"H2D\":{\"Overview\":\"Overview\",\"Specs\":\"Specs\",\"Instruction\":\"Instruction\",\"FAQ\":\"FAQ\",\"Rethink Personal Manufacturing\":\"Rethink Personal Manufacturing\",\"Bambu Lab New Product\":\"Bambu Lab H2D\",\"Watch Video\":\"Watch Video\",\"Dual-Nozzle Evolving 3D Printing\":\"Explore Dual-Nozzle Capabilities\",\"Elevate your designs by seamlessly combining different materials\":\"Flexible and rigid, low cost and exotic materials in one print\",\"Multi-material Printing\":\"Multi-material Printing\",\"Produce precise supports with minimal waste\":\"Perfect supports with minimal waste, purging and reloading\",\"Support Printing\":\"Dedicated Support Material\",\"Fast and efficient multi-color printing\":\"Fast and efficient multi-color printing\",\"Enhanced Multi-color Printing\":\"Efficient Multi-color Printing\",\"All in one Solution For Personal Manufacturing\":\"All-in-one Solution For Personal Manufacturing\",\"Laser For engraving cutting\":\"Laser\",\"Digital Cutting\":\"Digital Cutting\",\"Pen Drawing\":\"Pen Drawing\",\"Live Spatial Alignment\":\"Live Spatial Alignment\",\"What You See Is What You Get Precision\":\"What-You-See-Is-What-You-Get\",\"Live Spatial Alignment Description\":\"The H2D’s BirdsEye camera, combined with computer vision algorithms, delivers top-view alignment accuracy up to 0.3mm. This advanced spatial alignment allows users to place the tool path at the right position on the material – truly \\\"what-you-see-is-what-you-get.\\\"*\",\"Live Auto Arrangement\":\"Auto Arrangement\",\"Maximize material efficiency minimize waste\":\"Maximize material efficiency, minimize waste\",\"Live Auto Arrangement Description\":\"Leveraging real-time images from the BirdsEye camera, Bambu Suite can automatically arrange your project according to the shape of your material, i.e left over plywood from the previous project. This feature helps you to get the most out of every material.\",\"Don t Worry About Safety  We ve Got You Covered\":\"Don’t Worry About Safety – We’ve Got You Covered\",\"Laser Protective Windows\":\"Laser Safety Windows\",\"Operate and monitor description\":\"Operate and monitor laser projects safely without the need for goggles, thanks to our safety windows.\",\"Air Purifier\":\"Air Purifier\",\"An optional air purifier ensures clean air even during indoor laser operations\":\"An optional air purifier ensures clean air, even during indoor laser operations.*\",\"Don t Worry About the Settings We ve Got It Covered\":\"Don’t Worry About the Settings – We’ve Got It Covered\",\"Material CodeSync\":\"Material CodeSync\",\"Effortlessly sync settings with no manual input description\":\"The H2D automatically scans the QR code on your material to load the perfect preset.*\",\"Full-auto Calibration\":\"Full-auto Calibration\",\"Rethink\":\"Rethink\",\"Personal Manufacturing\":\"Personal Manufacturing\",\"Model created by\":\"Model created by @{author}\",\"Air Assist\":\"Air Assist\",\"Air Assist Desc\":\"Improve surface quality by directing high-speed air to cool the laser path, ensuring cleaner and more precise results.\",\"Contact less 3D Mesh\":\"Contact-less 3D Mesh*\",\"Contact less 3D Mesh Desc\":\"Advanced optical height measurement creates a detailed 3D mesh without physical contact, enabling precise laser work on curved surfaces.\",\"Go Big Go Fast Go Precise\":\"Go Big, Go Fast, Go Precise\",\"Vision Encoder Accuracy Enhancement\":\"Our Secret Weapon:Vision Encoder\",\"ultra fine motion accuracy\":\"50µm ultra-fine motion accuracy*\",\"Vision Encoder Accuracy Enhancement Desc\":\"An ultra-accurate vision encoder plate, combined with 5µm resolution optical measurements to track and correct toolhead motion, enables the H2D to achieve consistent and reliable distance-independent 50μm motion accuracy across the entire workspace, one order of magnitude better than its predecessor. (*Vision Encoder sold separately)\",\"Max\":\"Max\",\"Single nozzle\":\"Single-nozzle\",\"Dual nozzle\":\"Dual-nozzle\",\"King size Work Zone\":\"King-size Work Zone\",\"Break free from size constraints\":\"Break free from size constraints\",\"King size Work Zone Desc\":\"With a print volume up to 350mm×320mm×325mm*, creating large-scale projects has never been easier! From laser engraving on sizable objects to printing oversized models, the expanded capacity empowers you to bring even your most ambitious ideas to life.\",\"350 Hotend\":\"High-temp Hotend\",\"65 Chamber Heating\":\"Chamber Heating\",\"350 Hotend 65 Chamber Heating\":\"350°C Hotend \u0026 65°C Chamber Heating\",\"Unleash the full potential of high-performance materials\":\"Unleash the full potential of high-performance materials\",\"Hotend and Chamber Heating Desc\":\"Equipped with 65°C active chamber heating and a high-temperature hotend reaching up to 350°C, the H2D delivers precise closed-loop temperature control. This advanced system effectively eliminates warping and deformation in high-performance materials, ensuring superior layer bonding and maximizing their full potential.\",\"REAL High Flow Hotend\":\"REAL High-Flow Hotend*\",\"Consistently print at 600 with ease\":\"Consistently print at 600mm/s with ease\",\"High Flow Hotend Desc\":\"The H2D’s purpose-built high-flow hotend ensures reliable, high-speed printing at 600mm/s. Designed for consistent performance, it eliminates mid-print flow rate restrictions, enabling uninterrupted high-speed printing regardless of the print size or complexity.*\",\"DynaSense Extruder\":\"DynaSense Extruder\",\"Intelligent sensing for precise extrusion control\":\"Intelligent sensing for precise extrusion control\",\"DynaSense Extruder Desc\":\"Bambu Lab's proprietary PMSM servo architecture establishes an intelligent extrusion governance system. It executes 20kHz Torque/Resistance and position sampling to dynamically modulate electromagnetic torque vectors. Stabilizing extrusion and detecting filament grinding and clogging. \",\"A Smarter Safer Experience\":\"A Smarter, Safer Experience\",\"Spaghetti\":\"Spaghetti\",\"Nozzle Clumping\":\"Nozzle Clumping\",\"Air Printing\":\"Air Printing\",\"Nozzle Camera\":\"Nozzle Camera\",\"Detect issues early to save time and filament\":\"Monitor extrusion at the nozzle tip\",\"Nozzle Camera Desc\":\"The H2D features an AI-backed nozzle camera with macro lens. This intelligent monitoring system continuously tracks extrusion patterns, immediately detecting material accumulation, filament deviations, and extrusion failures.\",\"AI Powered Safe Start\":\"Pre-Flight Checklist by AI\",\"Peace of mind every time you print\":\"Peace of mind, every time you print\",\"AI Powered Safe Start Desc\":\"Prior to each operational cycle, H2D's vision system initiates a comprehensive pre-flight checklist: Chamber Integrity Scan – Detects debris across the entire print surface. Hardware Configuration Audit – Instantly identifies nozzle dimensions and build plate properties. Digital-Physical Alignment – Automatically verifies consistency between detected hardware specifications and active slicer parameters.\",\"Comprehensive Filament Monitoring\":\"SOTA Filament Monitoring\",\"Save your print from filament feeding issues\":\"15 sensors on one filament path\",\"Comprehensive Filament Monitoring Desc\":\"Unlike legacy systems with single filament run-out detectors, the H2D features comprehensive material flow monitoring. Throughout the AMS-to-nozzle path, 15 strategic sensors form an intelligent network, continuously tracking five key parameters: feeding velocity, tension, filament tip location, extruder thermal environment, and dynamic extrusion pressure. This establishes an industry-leading filament behavior control system.\",\"Learn More\":\"Learn More\",\"New Product Specs\":\"H2D Specs\",\"Unboxing video\":\"Unboxing video\",\"Unboxing video Note\":\"*Compliant with the requirements of GB/T 70.1-2008 standard                 [Equivalent standards: ISO 4762, ASME/ANSI B 18.3.1M - 1986                 (R1993), DIN EN ISO 12474]\",\"What in the box\":\"What's in the box\",\"Explore more about H2D\":\"Explore more about H2D\",\"New Product AMS Combo\":\"H2D AMS Combo\",\"New Product Laser Full Combo\":\"H2D Laser Full Combo\",\"Laser Edition\":\"Laser Edition\",\"Build Plate\":\"Textured PEI Build Plate\",\"Spool Holder\":\"Spool Holder\",\"Accessory Box\":\"Accessory Box\",\"New AMS\":\"AMS 2 Pro\",\"10W Laser Module\":\"10W Laser Module\",\"Optional\":\"Depending on selected combo \",\"40W Laser Module\":\"40W Laser Module\",\"Cutting Module\":\"Cutting Module (with Pen Holder)\",\"Laser Platform\":\"Laser Platform\",\"Cutting Platform\":\"Cutting Platform\",\"Emergency Stop Button\":\"Emergency Stop Button\",\"Multi material Printing\":\"Multi-material Printing\",\"Multi material Printing Description\":\"Combine flexible and rigid materials in a single print to create impressive interlocking structures and innovative designs beyond traditional manufacturing. Pairing high-performance materials with standard ones further reduces costs and boosts material efficiency by using premium materials only where necessary.\",\"Produce precise supports with minimal waste purging and reloading\":\"Perfect supports with minimal waste, purging and reloading\",\"Support Printing Description\":\"Print with support is no longer a headache. With H2D’s dual-nozzle setup, one nozzle can be reserved for dedicated support material, allowing secured print and perfect support interface.\",\"Enhanced Multi color Printing\":\"Efficient Multi-color Printing\",\"Fast and efficient multi color printing\":\"Fast and efficient multi-color printing\",\"Enhanced Multi color Printing Description\":\"Dual-nozzle printing reduces purge cycles in multi-color prints. H2D's smart algorithms optimize filament use, maximizing dual-nozzle efficiency to save time and materials.\",\"Specs Table Collapse\":\"$21\",\"Specs Table No Collapse\":\"$22\",\"Specs Table No Collapse 110V\":\"$23\",\"Specs Table No Collapse 220V\":\"$24\",\"Physical Dimensions UK\":\"492*514*626 mm³\u003cdiv\u003e700*700*1100 mm³ (Recommended Space for Printer)\u003c/div\u003e\",\"Physical Dimensions US\":\"492*514*626 mm³\u003cdiv\u003e(Package Size: 580*605*750mm)\u003c/div\u003e\u003cdiv\u003e700*700*1100 mm³ (Recommended Space for Printer)\u003c/div\u003e\",\"Physical Dimensions Asia\":\"492*514*626 mm³\u003cdiv\u003e(Package Size:\u003cbr\u003eUS Version: 580*605*750mm\u003cbr\u003eUK and other Version: 620*620*755mm)\u003c/div\u003e\u003cdiv\u003e700*700*1100 mm³ (Recommended Space for Printer)\u003c/div\u003e\",\"Gross Weight UK\":\"31 kg\u003cbr\u003e(Gross weight: H2D: 38.5 kg; H2D AMS Combo: 42.3 kg;\u003cbr\u003eH2D Laser Full Combo: 46.2 kg)\",\"Gross Weight US\":\"31 kg\u003cbr\u003e(Gross weight: H2D: 40.6 kg; H2D AMS Combo: 44.2 kg;\u003cbr\u003eH2D Laser Full Combo: 48.2 kg)\",\"Gross Weight Asia\":\"31 kg\u003cbr\u003e(Gross weight:\u003cbr\u003eUS Version — H2D: 40.6 kg; H2D AMS Combo: 44.2 kg; H2D Laser Full Combo: 48.2 kg\u003cbr\u003eUK and other Version — H2D: 38.5 kg; H2D AMS Combo: 42.3 kg; H2D Laser Full Combo: 46.2 kg)\",\"Packaging Update Note\":\"Packaging is now updating, new and old designs may be shipped randomly. Packaging may vary, shipping costs are the same for all orders placed at the same time.\",\"Specs Table Notes\":\"* To ensure the heat bed quickly reaches the needed temperature, the printer will maintain maximum power for no more than 3 minutes .\",\"Expand table\":\"Expand table\",\"Collapse table\":\"Collapse table\",\"Download PDF\":\"Download TDS\",\"Full auto Calibration Description\":\"A single tap initiates automated laser focus verification and material measurement, eliminating manual adjustments.\",\"10W and 40W 405nm Laser for engraving cutting\":\"10W and 40W 455nm Laser for engraving \u0026 cutting\",\"Precise cutting and foiling with a variety of versatile blades\":\"Precise cutting on variety of materials\",\"Drawing and writing\":\"Drawing and writing\",\"New Product\":\"H2D\",\"Stop Button\":\"Stop Button\",\"Emergency\":\"Emergency\",\"A Serious Laser Machine\":\"A Serious Laser Machine\",\"Arrange\":\"Arrange\",\"X1C AND P1S\":\"X1C\",\"Detect issues\":\"Detect issues early to save time and filament.\",\"footnotes\":\"$25\",\"Explore More About H2D\":\"Explore More About H2D\",\"Frequently asked questions\":\"Frequently Asked Questions\",\"Quest 1\":\"1.Can H2D be upgraded to H2D Laser Edition?\",\"Answer one\":\"$26\",\"Quest 2\":\"2.Are the left and right hotends exactly the same?\",\"Answer two\":\"\u003cdiv\u003eYes, the left and right hotends have identical structures and materials, and can be used interchangeably.\u003c/div\u003e\",\"Quest 3\":\"3.What is the maximum number of AMS 2 Pro and AMS HT units that the H2D supports? How many colors can it print at most?\",\"Answer three\":\"\u003cdiv\u003eThe H2D supports a maximum of 4 AMS 2 Pro and 8 AMS HT connected simultaneously, a total of 12 units with 24 slots. \u003c/div\u003e \u003cdiv\u003eBecause H2D is a dual-hotend printer, and in the most extreme scenario, all AMS can be connected to one hotend     while the other hotend uses an external spool holder, it can support up to 25 colors. \u003c/div\u003e\",\"Quest 4\":\"4.Is H2D compatible with first generation AMS?\",\"Answer four\":\"\u003cdiv\u003eThe first-generation AMS has been confirmed to have full plug-and-play compatibility and can be used with the H2D for multi-color printing, but it does not support the AMS drying function.\u003c/div\u003e \u003cdiv\u003eDue to the fundamental differences in the feeding mechanism and buffering structure, the H2D does not support the AMS lite.\u003c/div\u003e\",\"Question 5\":\"5.AMS 2 Pro is directly connected to the printer through the 6-pin ports, so what are the two 4-pin ports on the back of the printer used for?\",\"Answer five\":\"\u003cdiv\u003eThe two 4-pin ports on the back are reserved for future expansion accessories. For example, to upgrade a non-laser version of the printer to a laser version, one of these ports can be used to connect an external air pump.\u003c/div\u003e\",\"Question 6\":\"6.Can I use the A1 series Hotend on the H2D? Conversely, can H2D hotends be used on A1 series printers?\",\"Answer six v2\":\"\u003cdiv\u003eAlthough the hotend of the H2D series is similar to the A1 hotend in structure , it is not exactly the same.\u003c/div\u003e \u003cbr /\u003e \u003cdiv\u003eThe H2D hotends are specifically designed for the H2D printer, offering optimized compatibility. For example, they support a larger maximum volumetric flow rate, lower clogging risk, more precise nozzle offset calibration between the left and right hotends, and automatic hotend type recognition via the live camera.\u003c/div\u003e \u003cbr /\u003e \u003cdiv\u003eTherefore , to ensure you get the best print quality, we strongly recommend that you do not use the A1 hotend for H2D printers.\u003c/div\u003e \u003cbr /\u003e \u003cdiv\u003ePurchasing additional H2D hotends for use on A1 printers is feasible. However, you will also need to use the H2D hotend silicone sock.\u003c/div\u003e\",\"Question 7\":\"7.What are the differences between the 10W and 40W laser modules? How should I choose?\",\"Answer seven\":\"\u003cdiv\u003eBoth the 10W and 40W laser modules are blue light lasers that support processing a variety of materials, including wood, rubber, metal sheets, leather, dark acrylic, and stone. However, due to differences in power and size, there are the following distinctions:\u003c/div\u003e \u003cbr /\u003e \u003cdiv\u003e1.Maximum cutting thickness(For Basswood Plywood): \u003c/div\u003e \u003cdiv\u003e10W laser module: 5mm; \u003c/div\u003e \u003cdiv\u003e40W laser module: 15mm;\u003c/div\u003e \u003cbr /\u003e \u003cdiv\u003e2.Maximum engraving speed(For Basswood Plywood): \u003c/div\u003e \u003cdiv\u003e10W laser module: 400mm/s ; \u003c/div\u003e \u003cdiv\u003e40W laser module: 1000mm/s ；\u003c/div\u003e \u003cbr /\u003e \u003cdiv\u003e3.Processable Area:\u003c/div\u003e \u003cdiv\u003e10W laser module: Maximum processing area X310mm * Y270mm, maximum processing height 280mm；\u003c/div\u003e \u003cdiv\u003e40W laser module: Maximum processing area X310mm * Y250mm, maximum processing height 265mm；\u003c/div\u003e\",\"Question 8\":\"8.Is a USB included as standard? What functions are affected without a USB? \",\"Answer eight\":\"\u003cdiv\u003eThe package does not include a standard USB flash drive. You can still initiate printing normally without a USB, as the printer has built-in storage space to run print files.\u003c/div\u003e \u003cdiv\u003eHowever, without a USB inserted, the following functions will be affected:\u003c/div\u003e \u003cbr /\u003e \u003cdiv\u003e1. The recording and time-lapse photography functions can't be turned on;\u003c/div\u003e \u003cdiv\u003e2. Printing cannot be initiated through the LAN;\u003c/div\u003e \u003cdiv\u003e3. Print files cannot be sent to the machine for storage through the studio;\u003c/div\u003e \u003cdiv\u003e4. Log files cannot be exported;\u003c/div\u003e \u003cbr /\u003e \u003cdiv\u003e\u003cspan style=\\\"font-weight: 700;\\\"\u003eUSB requirements: \u003c/span\u003eUSB2.0 protocol or above (actual minimum write speed needs to be greater than 10M/s), supported file formats are FAT32 and exFAT. And the printer only supports mounting one USB, and cannot connect multiple USB via a USB hub.\u003c/div\u003e\",\"Question 9\":\"9.Why can’t I freely select hotend for printing with the printer’s built-in files?\",\"Answer 9\":\"\u003cdiv\u003eThe hotend to be used for printing has already been determined when the model file is sliced. As for the built-in models, the right hotend has been selected during the slicing process, so it is impossible to change the hotend used for printing on the printer screen.\u003c/div\u003e \u003cdiv\u003eWhen you slice the file in Bambu Studio and send the print task , you can freely choose to use the left hotend or the right hotend. For some filaments, such as TPU and PPS/PPA-CF, it is recommended to use specific hotends for printing.\u003c/div\u003e \u003cbr /\u003e \u003cdiv\u003eFor more details on H2D filament printing, please check the \u003ca href=\\\"https://wiki.bambulab.com/h2/h2d-filament-printing-guide\\\"\u003ewiki\u003c/a\u003e.\u003c/div\u003e\",\"Question 10\":\"10. Will the smoke and dust generated by laser operations affect my printer's precision and lifespan?\",\"Answer 10\":\"\u003cdiv\u003eH2D is equipped with an efficient exhaust system that effectively removes smoke and dust generated by laser operations, significantly reducing contamination. During R\u0026D, we conducted rigorous testing to ensure that with regular machine cleaning, the impact of smoke and dust on performance and precision is negligible. For detailed cleaning instructions, please refer to: \u003ca href=\\\"https://wiki.bambulab.com/h2/maintenance/period-maintenance\\\"\u003ewiki\u003c/a\u003e\u003c/div\u003e\",\"Question 11\":\"11. How can I improve the success rate and quality of TPU printing?\",\"Answer 11\":\"\u003cdiv\u003eDue to the flexible nature of TPU filaments, there are some operational issues that can arise during feeding and printing. To facilitate TPU printing, we have created a dedicated Wiki guide. Simply follow the instructions in the Wiki to successfully print with TPU filaments: \u003ca href=\\\"https://wiki.bambulab.com/h2/h2d-tpu-printing-guide\\\"\u003ewiki\u003c/a\u003e\u003c/div\u003e\",\"Question 12\":\"12. Are there any special safety precautions I need to take when using the laser function?\",\"Answer 12\":\"\u003cdiv\u003eBecause laser processing involves using high-energy lasers on potentially flammable materials, we strongly advise users not to leave the machine unattended during laser operations. Please maintain constant vigilance over the machine's operational status and ensure that there are no flammable or explosive materials in the machine's surroundings. For more information please refer to: \u003ca href=\\\"https://wiki.bambulab.com/h2/laser-safety-document\\\"\u003ewiki\u003c/a\u003e \u003cbr /\u003e \u003cbr /\u003e \u003cdiv\u003eFor more information about H2D, refer to the official \u003ca href=\\\"https://wiki.bambulab.com/h2d\\\"\u003ewiki\u003c/a\u003e.\u003c/div\u003e\u003c/div\u003e\",\"Specs Table Notes2\":\"* To ensure the heat bed quickly reaches the needed temperature, the printer will maintain maximum power for no more than 3 minutes .\",\"Safety Key\":\"Safety Key\",\"Ventilation Pipe\":\"Ventilation Pipe\",\"Laser Cutting Materials\":\"Laser \u0026 Cutting Materials\"},\"Check out the awesome giveaway\":\"Check out the awesome giveaway\",\"Check out\":\"Check out\",\"Hide\":\"Hide\",\"Show More\":\"Show More\",\"Contact Us\":\"Contact Us\",\"ColorPick\":{\"step one label\":\"1. Cho ailsafe for safe, precise heating\",\"Clear digital display for easy monitoring of drying status\":\"Clear digital display for easy monitoring of drying status\",\"Compatible With All Bambu Lab Printers\":\"Compatible With All Bambu Lab Printers\",\"The AMS 2 pro is compatible with all Bambu Labs products\":\"The AMS HT will be compatible with all Bambu Lab products. \",\"Status Display\":\"Status Display\",\"SpecificationTable\":{\"item\":\"Item\",\"specification\":\"Specification\",\"body\":\"Body\",\"dimensions\":\"Dimensions\",\"dimensionsValue\":\"114*280*245 mm³\",\"netWeight\":\"Net Weight\",\"netWeightValue\":\"1.21 kg\",\"housingMaterial\":\"Housing Material\",\"housingMaterialValue\":\"PC/PA\",\"flameRetardantGrade\":\"Flame Retardant Grade\",\"flameRetardantGradeValue\":\"UL 94 V-0\",\"screen\":\"Screen\",\"screenDescription\":\"Supports displaying real-time temperature and humidity, and remaining drying duration.\",\"printing\":\"Printing\",\"filamentSupported\":\"Filament Supported\",\"filamentSupportedValue\":\"PLA, PETG, ABS, ASA, PET, PA, PC, PVA (dried), BVOH (dried), PP, POM, HIPS, Bambu PLA-CF/PAHT-CF/PETG-CF/Support for PLA/PETG, and TPU for AMS.\u003cbr/\u003eBypass Filament Outlet: TPE, generic TPU, Bambu PET-CF/TPU 95A, and other filament that contains carbon fiber or glass fiber.\",\"filamentNotSupported\":\"Filament Not Supported\",\"filamentNotSupportedValue\":\"PVA (damp), BVOH (damp)\",\"filamentDiameter\":\"Filament Diameter\",\"filamentDiameterValue\":\"1.75 mm\",\"spoolDimension\":\"Spool Dimension\",\"spoolDimensionWidth\":\"Width: 50 mm-68 mm\",\"spoolDimensionDiameter\":\"Diameter: 197 mm-202 mm\",\"rfidIdentification\":\"RFID Identification\",\"supported\":\"Supported\",\"filamentOdometry\":\"Filament Odometry\",\"drying\":\"Drying\",\"maximumTemperature\":\"Maximum Temperature\",\"maximumTemperatureValue\":\"85 °C\",\"filamentSupportedDrying\":\"Filament Supported\",\"filamentSupportedDryingValue\":\"PLA, PETG, Support for PLA/PETG, ABS, ASA, PET, PA, PC, PVA, BVOH, PP, POM, HIPS, Bambu PLA-CF/ PAHT-CF/ PETG-CF, and TPU for AMS\",\"activeMoistureDischarge\":\"Active Moisture Discharge\",\"rotatingDryingMode\":\"Rotating Drying Mode\",\"sealedStorage\":\"Sealed Storage\",\"topLidOpenDetection\":\"Top Lid Open Detection\",\"temperatureHumidityDetection\":\"Temperature and Humidity Detection and Maintenance\",\"temperatureHumidityDescription\":\" Supported. Real-time information can be displayed on the screen, printer UI, Bambu Studio, and Bambu Handy.\",\"voltage\":\"Voltage\",\"voltageDCValue\":\"DC: 24 V\",\"voltageACValue\":\"AC: 100 V–240 V~, 50 Hz/60 Hz\",\"averagePower\":\"Average Power\",\"averagePowerValue\":\"150 W\",\"filamentDryingNote\":\"* Filaments marked with * require higher drying temperature. The AMS 2 Pro cannot dry them completely. If you want better drying performance for these filaments, we recommend purchasing an AMS HT.\",\"downloadFilamentTDS\":\"Download TDS\"},\"Specs\":{\"AMS HT Specs\":\"AMS HT Specs\"},\"Whats in the Box\":\"What’s in the Box\",\"Explore more about AMS HT\":\"Explore more about AMS HT\",\"FAQ\":{\"question1\":\"1.What is the difference between the two discharge ports on the back of the machine?\",\"answer1\":\"The port at the rear of the top cover is specifically for TPU filament. Due to the softness of the TPU filament, it is easy to fail when using the AMS 2 Pro automatic feeding function. When using the TPU, insert it into the AMS HT and ensure the material tray rotates in the correct direction. Insert the material tube into the TPU output port and manually push the filament through the PTFE tube until it is fully loaded into the extruder.\u003cdiv\u003e\u003c/div\u003e\u003cbr/\u003e\u003cdiv\u003eNote:\u003c/div\u003e\u003cul\u003e  \u003cli\u003e1.When using TPU, AMS HT cannot use the automatic feed and return function, but can be used as a drying box to prevent material moisture.\u003c/li\u003e  \u003cli\u003e2.AMS HT won't be able to run filament drying while feeding filament and initiating a print via the bypass port.\u003c/li\u003e\u003c/ul\u003e\",\"question2\":\"2.Can the AMS HT be used with all series printers?\",\"answer2\":\"\u003cdiv\u003eYes, AMS HT is compatible with all printers.\u003c/div\u003e\u003cbr /\u003e\u003cp\u003eThe AMS  HT requires specific accessory configurations for various Bambu Lab 3D printers.\u003c/p\u003e\u003cdiv\u003eSee the  \u003ca href='https://wiki.bambulab.com/ams/manual/multi-model-AMS-compatibility-guide' target='_blank'\u003eMultiple AMS Units Connection Guide\u003c/a\u003e for detailed setup instructions.\u003c/div\u003e\",\"question3\":\"3.Can I print and dry at the same time?\",\"answer3\":\"Printing while drying is not yet supported, including all the AMSs that are related to the on-going print job (eg. The AMSs assigned for auto-refill). However, you can dry filament in AMSs that are not assigned to the on-going print job.\",\"answer3_v1\":\"Certain models currently support the Simultaneous Drying and Printing Function.Please refer to the \u003ca style='color: #00CD0A' href='https://wiki.bambulab.com/en/ams-2-pro/manual/drying-function' target='_blank'\u003e Wiki \u003c/a\u003e for the minimum supported firmware version and operation guidelines.\",\"question4\":\"4.How many AMS HT units can be connected to the X1 series and P1 series at most?\",\"answer4\":\"X1 and P1 series printers support up to 4 AMS HT connections at the same time.\",\"question5\":\"5.Can the AMS HT be directly connected to the printer for drying?\",\"answer5\":\"H2D and X/P/A series printers are connected to AMS HT and use drying function. Each AMS HT requires an external 220V power supply for drying It is not supported to draw power from the printer for drying (The power adapter is pre-included with the product package).\",\"question6\":\"6.Does it support standalone drying without connecting to the printer?\",\"answer6\":\"When using the AMS HT drying function, the AMS HT must be connected to the printer via a 6-pin bus cable to ensure that the printer is powered on and set to filament drying mode.\u003cdiv\u003e\u003c/div\u003eThe AMS HT cannot perform standalone drying without a connection to the printer.\"},\"Bambu AMS HT\":\"Bambu AMS HT\",\"Desiccant\":\"Desiccant\",\"Power Cord (For AMS HT ONLY)\":\"Power Cord (For AMS HT ONLY)\",\"PTFE Tube\":\"PTFE Tube (263mm*2+900mm*1)\",\"Bambu Bus Cable-6Pin\":\"Bambu Bus Cable-6Pin\"},\"reviews\":{\"sectionTitle\":\"Ratings \u0026 Reviews\",\"lightbox\":{\"previousImage\":\"Previous image\",\"nextImage\":\"Next image\",\"closeLightbox\":\"Close lightbox\",\"featuredReview\":\"Featured Review\",\"imageCounter\":\"{current} / {total}\",\"more\":\"More\",\"collapse\":\"Collapse\"},\"form\":{\"overallRating\":\"Overall rating\",\"whatStoodOut\":\"What stood out\",\"selectUpToTags\":\"Select up to {max} tags that describe your experience\",\"reviewTitle\":\"Review title\",\"titlePlaceholder\":\"Summarize your experience in one line\",\"yourReview\":\"Your review\",\"bodyPlaceholder\":\"What did you like or dislike? How did you use this product? Any tips for other users?\",\"photosOptional\":\"Photos\",\"wouldRecommend\":\"Would you recommend this product?\",\"yes\":\"Yes\",\"no\":\"No\",\"postAnonymously\":\"Post anonymously\",\"anonymousHint\":\"Your name will be hidden from other users\",\"submitting\":\"Submitting...\",\"submitReview\":\"Submit Review\",\"errorRating\":\"Please select a rating\",\"errorTitle\":\"Please enter a review title\",\"errorTitleMax\":\"Title must be {max} characters or less\",\"errorContentMin\":\"Review must be at least {min} characters\"},\"list\":{\"customerReviews\":\"Customer Reviews\",\"sortByLabel\":\"Sort by\",\"mostHelpful\":\"Most Helpful\",\"newest\":\"Newest\",\"withImages\":\"With Images\",\"noMatchingReviews\":\"No reviews match your filters\",\"showingReviewsRange\":\"{total, plural, one {Showing \u003cb\u003e{range}\u003c/b\u003e of \u003cb\u003e{total}\u00 yNow\":\"Buy Now\",\"downloadPdf\":\"Download PDF\",\"compareAllProducts\":\"Compare All Products\"}\n"])</script><script>self.__next_f.push([1,"76:{\"item\":\"Item\",\"specification\":\"Specification\",\"body\":\"Body\",\"dimensions\":\"Dimensions\",\"dimensionsValue\":\"372*280*226 mm³\",\"netWeight\":\"Net Weight\",\"netWeightValue\":\"2.5 kg\",\"housingMaterial\":\"Housing Material\",\"housingMaterialValue\":\"ABS/PC\",\"printing\":\"Printing\",\"filamentSupported\":\"Filament Supported\",\"filamentSupportedValue\":\"PLA, PETG, ABS, ASA, PET, PA, PC, PVA (dried), BVOH (dried), PP, POM, HIPS, Bambu PLA-CF/PAHT-CF/PETG-CF/Support for PLA/PETG, and TPU for AMS\",\"filamentNotSupported\":\"Filament Not Supported\",\"filamentNotSupportedValue\":\"TPE, generic TPU, PVA (damp), BVOH (damp),Bambu PET-CF/TPU 95A, and other filament that contains carbon fiber or glass fiber\",\"filamentDiameter\":\"Filament Diameter\",\"filamentDiameterValue\":\"1.75 mm\",\"spoolDimension\":\"Spool Dimension\",\"spoolDimensionWidth\":\"Width: 50 mm-68 mm\",\"spoolDimensionDiameter\":\"Diameter: 197 mm-202 mm\",\"rfidIdentification\":\"RFID Identification\",\"supported\":\"Supported\",\"drying\":\"Drying\",\"highestTemperature\":\"Highest Temperature\",\"highestTemperatureValue\":\"* 65 °C\",\"filamentSupportedDryingValue\":\"PLA, PETG, Support for PLA/PETG, ABS*, ASA*, PET*, PA*, PC*, PVA*, BVOH *, PP, POM*, HIPS*, Bambu PLA-CF*/ PAHT-CF*/ PETG-CF*, and TPU for AMS*\",\"activeMoistureDischarge\":\"Active Moisture Discharge\",\"sealedStorage\":\"Sealed Storage\",\"temperatureHumidityDetection\":\"Temperature \u0026 Humidity Detection\",\"temperatureHumidityDescription\":\"Supported. Real-time temperature and humidity can be displayed on the screen, Bambu Studio, and Bambu Handy.\",\"power\":\"Power\",\"input\":\"Input\",\"powerInputValue\":\"24 V 4 A\",\"filamentDryingNote\":\"* Filaments marked with * require higher drying temperature. The AMS 2 Pro cannot dry them completely. If you want better drying performance for these filaments, we recommend purchasing an AMS HT.\",\"hotTips\":\"*The maximum temperature of the drying function can only be achieved when the ambient temperature is above 25 °C. When the ambient temperature is below 25 °C, due to natural heat dissipation, the actual drying temperature may not reach the maximum value.\",\"downloadFilamentTDS\":\"Download TDS\"}\n"])</script><script>self.__next_f.push([1,"77:{\"AMS 2 Pro Specs\":\"AMS 2 Pro Specs\"}\n78:{\"Dry\":\"Dry\",\"Undry\":\"Moist\"}\n"])</script><script>self.__next_f.push([1,"79:{\"question1\":\"1.There is an independent power port on the AMS 2 Pro in addition to the 6-pin port. Is this necessary?\",\"answer1\":\"\u003cspan\u003eWhen the H2D is used with a single AMS 2 Pro, all functions, including automatic feeding and drying, can be utilized without an external \u003ca style='color: #00CD0A' href='/products/ams-2-pro-switching-adapter' target='_blank'\u003epower adapter\u003c/a\u003e.\u003cbr/\u003eWhen the H2D is used with more than one AMS 2 Pro, if some AMS 2 Pro units are used for multi-color printing while others are used for filament drying, then the AMS 2 Pro units used for drying require an external \u003ca style='color: #00CD0A' href='/products/ams-2-pro-switching-adapter' target='_blank'\u003epower adapter\u003c/a\u003e. The external power adapter can be purchased from the Bambu Lab official store.\u003c/span\u003e\",\"question2\":\"2.Can the AMS 2 Pro be used with all series printers?\",\"answer2\":\"Yes, AMS 2 Pro is compatible with all printers. \u003cbr /\u003e The AMS 2 Pro requires specific accessory configurations for various Bambu Lab 3D printers.\u003cbr /\u003e\u003cbr/\u003eSee the  \u003ca style='color: #00CD0A' href='https://wiki.bambulab.com/ams/manual/multi-model-AMS-compatibility-guide' target='_blank'\u003eMultiple AMS Units Connection Guide\u003c/a\u003e for detailed setup instructions.\",\"question3\":\"3.Can AMS and AMS 2 Pro be used at the same time for printing?\",\"answer3\":\"Yes, you can use both AMS and AMS 2 Pro on one H2D.\",\"question4\":\"4.Can I dry filament while printing?\",\"answer4\":\"Currently, drying is not supported for AMS 2 Pro/HT that are actively involved in the printing process, including those that may be used for automatic refill during the current print job. Printing while drying is not yet supported.\u003cbr/\u003eThe only \\\"dry while printing\\\" scenario currently supported is: the printer uses some of the connected AMS 2 Pro/HT units or an external spool holder for printing, while the AMS 2 Pro/HT units not involved in the current print job can be used for drying.\u003cbr/\u003eIf the printer is feeding or printing, and at the same time powering 1 AMS 2 pro for drying, the drying power will be automatically reduced, in order to ensure that the printing power is prioritized. So it is recommended to use the external \u003ca style='color: #00CD0A' href='/products/ams-2-pro-switching-adapter' target='_blank'\u003epower adapter\u003c/a\u003e for best drying results.\",\"answer4_v1\":\"Certain models currently support the Simultaneous Drying and Printing Function.Please refer to the \u003ca style='color: #00CD0A' href='https://wiki.bambulab.com/en/ams-2-pro/manual/drying-function' target='_blank'\u003e Wiki \u003c/a\u003e for the minimum supported firmware version and operation guidelines.\",\"question5\":\"5.Can I get power from the printer for drying?\",\"answer5_v1\":\"When using \u003cb\u003eA1/P1/X1 series \u003c/b\u003e, One Switching Adapter is required for each AMS 2 Pro unit. \u003cb\u003eH2/P2/X2D printers\u003c/b\u003e can power one AMS 2 Pro unit for drying without the switching adapter. To dry filaments in multiple units simultaneously, each additional AMS 2 Pro unit requires its own Switching Adapter.\",\"answer5\":\"The H2D printer supports powering one AMS 2 Pro for drying directly from the printer. If you need to dry filament in multiple AMS 2 Pro units simultaneously, the additional AMS 2 Pro units require power supply via a \u003ca style='color: #00CD0A' href='/products/ams-2-pro-switching-adapter' target='_blank'\u003epower adapter\u003c/a\u003e (purchased separately).\",\"question6\":\"6.Does it support standalone drying without connecting to the printer?\",\"answer6\":\"When using the AMS 2 Pro drying function, the AMS 2 Pro must be connected to the printer via a 6-pin bus cable to ensure that the printer is powered on and set to filament drying mode.\u003cbr/\u003eThe AMS 2 Pro cannot perform standalone drying without a connection to the printer.\"}\n"])</script><script>self.__next_f.push([1,"75:{\"60\":\"+60%\",\"content\":\"The all-new 2nd-generation AMS 2 pro, features \u003cspan style='color: #00CD0A'\u003emore powerful feeding motors that significantly\u003c/span\u003e boost filamentfeeding efficiency, accelerating multi-color and multimaterial printing.Even better, the AMS 2 pro introduces afilament drying function with active air vent on a fully sealedsystem, greatlyenhancing drying efficiency andmaintaining optimal filament conditions for extended periods\",\"Bambu Lab AMS 2 Pro\":\"Bambu Lab AMS 2 Pro\",\"AMS Evolved\":\"AMS, Evolved.\",\"Live Auto Arrangement\":\"Live Auto Arrangement\",\"Maximize material efficiency minimize waste\":\"Maximize material efficiency, minimize waste\",\"Dry Filament Quickly and Intelligently\":\"Dry Filament Quickly and Intelligently\",\"Evolved Polished DesignDetails\":\"Evolved, Polished DesignDetails\",\"Powerful Bambu permanent magnet synchronous servo motor sped-up the filament feeding by 60\":\"The powerful Bambu permanent magnet synchronous servo motor accelerates filament feeding by 60% for enhanced efficiency.\",\"10min\":\"-10min\",\"Engineered To Better Dry Use High-performance Filaments\":\"Engineered To Better Dry \u0026 Use High-performance Filaments\",\"Faster multi-color printing\":\"Faster multi-color printing\",\"Xiaomi Su7 Ultra Prototype by 大匠\":\"Xiaomi Su7 Ultra Prototype by @大匠\",\"Active Air Vent\":\"Electro-Magnetic Air Vent\",\"Fast filament drying air-tight filament storage\":\"Fast filament drying \u0026 air-tight filament storage\",\"24-Colors\":\"24-Colors\",\"Materials\":\"Multi-material\",\"Serial connect up to 4 AMS 2 Pro 8 AMS HT total of 24 filaments\":\"Serially connect up to 4 AMS 2 Pro \u0026 8 AMS HT units, total of 24 filaments\",\"65 Drying\":\"65°C Drying\",\"Up to 65 drying temperature\":\"Up to 65°C drying temperature\",\"Brushless Motor\":\"Brushless Motor\",\"60 faster feeding speed\":\"60% faster feeding speed\",\"Automated venting facilitates dehumidification during drying and airtight sealing for weeks of quality printing\":\"Automated venting facilitates dehumidification during drying and ensures airtight sealing for weeks of high-quality printing.\",\"Auto-rotate Drying\":\"Auto-rotate Drying\",\"During the drying process the filament spools rotate automatically to provide more even drying\":\"During the drying process, the filament spools rotate automatically to ensure more even drying.\",\"RFID Sync\":\"RFID Sync\",\"AMS 2 Pro uses RFID to auto-match drying settings for Bambu official filaments no manual input needed\":\"AMS 2 Pro uses RFID to auto-match drying settings for Bambu official filaments, no manual input needed.\",\"Speed Up Faster Multi-material Printing\":\"Speed Up! Faster Multi-material Printing!\",\"Average 10min saved for 100 filament changes\":\"Saves an average of 10 minutes per 100 filament changes.\",\"Evolved Polished Design Details\":\"Evolved, Polished Design Details\",\"Easy-access Guide Rails\":\"Tool-Free Filament Tubes Access\",\"See-through filament guide rails and a quick-release feeding mechanism make removing stuck filament quicker and easier\":\"Removing snapped filament from the first-gen AMS requires extracting all spools and disassembling the shell with two screws, taking 3-5 minutes. In contrast, the AMS 2 Pro offers direct, tool-free access to fila the\\n                      filament spool should not slide down, even if the previous\\n                      two spools have a certain forward tilt angle.\\n                      Additionally, to avoid affecting the accuracy of vibration\\n                      compensation, you can add reinforcement to the column. For\\n                      more details, please check \\n                      \u003ca\\n                        href='https://wiki.bambulab.com/a1/manual/faq'\\n                        target='_blank'\\n                      \u003e\\n                        here.\\n                      \u003c/a\u003e\\n                    \u003c/p\u003e\",\"Will you sell official refurbished A1 printers\":\"9. Will you sell official refurbished A1 printers?\",\"Sell Offical Refurbished Answer\":\"\u003cp\u003e\\n                      A: Currently, Factory Refurbished A1 units are only\\n                        available for sale within the Chinese domestic market. There\\n                        are no plans for overseas sales of Factory Refurbished units\\n                        at this time.\\n                      \u003cbr /\u003e\\n                      For your reference, all Refurbished units will have an \\\"R\\\"\\n                        mark located on the back of the Base Housing, near the power\\n                        cord plug.For more details, please check\\n                      \u003ca\\n                        href='https://wiki.bambulab.com/a1/manual/faq'\\n                        target='_blank'\\n                      \u003e\\n                        here.\\n                      \u003c/a\u003e\\n                    \u003c/p\u003e\",\"Are the A1 3D printers currently available\":\"10. Are the A1 3D printers currently available for sale from\\n                    the same batch that was recalled in January 2024?\",\"A1 Print Available Answer\":\"\u003cp\u003eA: No,they aren't. A1 3D printers sold after January 30,\\n                        2024
