<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Werke">
<meta name="theme-color" content="#1b1b1d">
<title>Werke</title>
<link rel="icon" id="favicon">
<style>
  :root{--bg:#232326;--panel:#2c2c30;--panel2:#38383d;--line:#3c3c42;--text:#e8e8ea;--mute:#a7a7ae;--mute2:#7c7c84;--acc:#00ae42;--warn:#f2b84b;--off:#ff6b5e}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
    font:15px/1.4 "IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .kopf{position:sticky;top:0;z-index:5;background:#1b1b1d;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
  .kopf .in{max-width:1100px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .kopf svg{width:42px;height:42px;flex:none}
  h1{margin:0;font:700 27px/1.1 "Chakra Petch","Segoe UI",-apple-system,sans-serif}
  .sub{display:block;font:500 11px/1 "IBM Plex Sans",-apple-system,sans-serif;color:var(--mute2);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
  .grow{flex:1}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
  .seg button{background:none;border:0;color:var(--mute);padding:7px 13px;border-radius:9px;font:inherit;font-size:13px;cursor:pointer}
  .seg button.on{background:var(--acc);color:#fff;font-weight:600}
  .wrap{max-width:1100px;margin:0 auto;padding:16px 18px 40px}
  .search{width:100%;margin:0 0 6px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font:inherit;outline:none}
  .search:focus{border-color:var(--acc)}
  h2{font-size:17px;font-weight:700;margin:22px 2px 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  a.card{position:relative;display:flex;gap:14px;align-items:center;padding:14px 32px 14px 14px;border-radius:18px;
    background:var(--panel);border:1px solid var(--line);color:inherit;text-decoration:none;transition:transform .12s,border-color .12s,background .12s}
  a.card:hover{border-color:#4c4c53;background:var(--panel2);transform:translateY(-1px)}
  .ic{flex:none;width:52px;height:52px}
  .ic svg{width:52px;height:52px;display:block}
  .t{font-weight:600}
  .d{color:var(--mute);font-size:12.5px}
  .dot{position:absolute;top:12px;right:12px;width:9px;height:9px;border-radius:50%;background:#4c4c53}
  .dot.on{background:#19d36b;box-shadow:0 0 0 3px #00ae4230}
  .dot.off{background:var(--off)}
  .star{position:absolute;bottom:8px;right:10px;background:none;border:0;color:#4c4c53;font-size:16px;cursor:pointer;padding:2px}
  .star.on{color:var(--warn)}
  .pikopf{display:flex;align-items:center;gap:10px;margin:22px 2px 12px;flex-wrap:wrap}
  .pikopf h2{margin:0}
  .knopf{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
  .knopf:hover{border-color:#4c4c53}
  .knopf.gruen{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  .knopf.rot{background:#ff6b5e22;border-color:#ff6b5e66;color:var(--off)}
  .pi{padding:14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
  .pizeile{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .marke{font-size:11.5px;padding:2px 8px;border-radius:8px;background:#4c4c5340;color:var(--mute);white-space:nowrap}
  .marke.on{background:#00ae4226;color:#19d36b}.marke.off{background:#ff6b5e22;color:var(--off)}.marke.warn{background:#f2b84b22;color:var(--warn)}
  .werte{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;margin:10px 0 4px}
  .werte span{color:var(--mute)}.werte b{font-weight:500;text-align:right}.werte b.heiss{color:var(--off)}
  .hin{font-size:12.5px;padding:5px 9px;border-radius:9px;margin:8px 0 2px}
  .hin.ok{background:#00ae421a;color:#19d36b}.hin.warn{background:#f2b84b1f;color:var(--warn)}.hin.off{background:#ff6b5e1f;color:var(--off)}.hin.lauf{background:var(--panel2);color:var(--text)}
  button.hin{border:0;font:inherit;font-size:12.5px;text-align:left;cursor:pointer;width:100%}
  button.hin:hover{filter:brightness(1.25)}
  .pliste{border:1px solid var(--line);border-radius:12px;max-height:55vh;overflow:auto}
  .pz{display:flex;justify-content:space-between;gap:10px;padding:8px 11px;border-bottom:1px solid var(--line);font-size:13px}
  .pz:last-child{border-bottom:0}
  .pz .v{color:var(--mute);font:12px ui-monospace,Menlo,monospace;text-align:right;word-break:break-all}
  .sich{font-size:11px;padding:1px 6px;border-radius:6px;background:#ff6b5e22;color:var(--off);margin-left:6px;white-space:nowrap}
  .fenster.gross{width:min(1400px,100%);height:min(900px,92vh);display:flex;flex-direction:column;overflow:hidden}
  .tbox{flex:1;min-height:0;background:#16161a;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .tbox .xterm{height:100%;padding:8px 4px 8px 10px}
  .tbox .xterm-viewport{background:#16161a!important}
  .tasten .knopf{padding:6px 10px;font-size:12.5px}.tasten .knopf.an{background:var(--acc);border-color:var(--acc);color:#fff}
  .bz{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid var(--line);font-size:13px}
  .bz:last-child{border-bottom:0}.bz>div{flex:1;min-width:0}.bz .v{color:var(--mute);font-size:12px;overflow-wrap:anywhere}
  .bz code{font:12px ui-monospace,Menlo,monospace}
  .bkopf{font-size:12.5px;color:var(--mute);margin:14px 2px 6px}
  .leer{color:var(--mute2);font-size:13px;margin:14px 0;text-align:center}
  .knoepfe{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .schicht{position:fixed;inset:0;z-index:20;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px}
  .schicht[hidden]{display:none}
  .fenster{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;width:min(640px,100%);max-height:90vh;overflow:auto}
  .fkopf{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
  .fenster pre{background:#1b1b1d;border:1px solid var(--line);border-radius:12px;padding:10px;height:50vh;overflow:auto;font:12px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;margin:0 0 8px}
  .fenster label{display:block;font-size:12.5px;color:var(--mute);margin:10px 0 4px}
  .fenster input,.fenster textarea{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:#1b1b1d;color:var(--text);font:inherit;outline:none}
  .fenster input:focus{border-color:var(--acc)}
  .fenster textarea{font:12px/1.4 ui-monospace,Menlo,monospace;height:120px;resize:vertical}
  .fenster ol{margin:6px 0;padding-left:20px;color:var(--mute);font-size:13px}
  footer{margin-top:28px;color:var(--mute2);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="kopf"><div class="in">
  <span id="logo"></span>
  <div><h1>Werke</h1><span class="sub" id="zaehler">Alle Werkzeuge an einem Ort</span></div>
  <div class="grow"></div>
  <div class="seg" id="netz"><button data-n="lan" class="on">Zuhause</button><button data-n="ts">Unterwegs</button></div>
</div></div>
<div class="wrap">
  <input class="search" id="suche" placeholder="Werk suchen …" autocomplete="off">
  <div id="inhalt"></div>
  <section id="pibereich"></section>
  <footer>Grüner Punkt = erreichbar · Stern = oben anheften · Pis über Piwerk</footer>
</div>
<div class="schicht" id="schicht" hidden><div class="fenster" id="fenster"></div></div>

  if (fav.length && !q) gruppen["Angeheftet"] = fav;
  liste.forEach(w => { if (q || !favs.has(w.n)) (gruppen[w.g] ??= []).push(w); });

    `<h2>${g}</h2><div class="grid">${ws.map(karte).join("")}</div>`).join("")
    || `<p class="d">Nichts gefunden.</p>`;
  document.getElementById("zaehler").textContent =
    `${liste.length} Werke · ${netz==="lan"?"im Heimnetz":"über Tailscale"}`;
  pruefe();
  piZeichnen();
}
function karte(w){

// Erreichbarkeit: kurzer Abruf ohne CORS – Antwort egal, Hauptsache keine Netzfehler
function pruefe(){

inhalt.addEventListener("click",e=>{

// ---------- Raspberry Pis: Status & Updates über Piwerk (Stack „piwerk“, nginx leitet /pi/ weiter) ----------
const PIAPI = "/pi/api";
const piBox = document.getElementById("pibereich");
const schicht = document.getElementById("schicht"), fensterEl = document.getElementById("fenster");
let piDaten, piSchluessel = "", logTimer = null, tSitzung = null;
const ZUST = {online:["online","on"], kein_zugang:["kein Zugang","warn"], offline:["offline","off"],
  ohne_ip:["keine IP",""], unbekannt:["prüfe …",""]};
const LAUF = {update:"Update läuft …", container:"Container werden aktualisiert …", neustart:"Startet neu …", pruefen:"Sucht nach Updates …"};
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function gb(kb){return (kb/1048576).toFixed(1).replace(".",",")}
function dauer(s){if(s==null)return "–";const t=Math.floor(s/86400),h=Math.floor(s%86400/3600);
  return t?`${t} T ${h} h`:`${h} h ${Math.floor(s%3600/60)} min`}

async function piLaden(){
  try{const r=await fetch(PIAPI+"/pis",{cache:"no-store"}); if(!r.ok) throw 0; piDaten=await r.json();}
  catch(e){piDaten=null}
  piZeichnen();
}
function piZeichnen(){
  const q=document.getElementById("suche").value.trim().toLowerCase();
  if(piDaten===undefined){piBox.innerHTML=""; return;}
  if(!piDaten){piBox.hidden=!!q; piBox.innerHTML=`<div class="pikopf"><h2>Raspberry Pis</h2></div><p class="d">Piwerk ist gerade nicht erreichbar.</p>`; return;}
  const pis=piDaten.pis.filter(p=>!q||(p.name+" "+p.host+" raspberry pi").toLowerCase().includes(q));
  piBox.hidden=!!q && !pis.length;
  const on=piDaten.pis.filter(p=>p.status.zustand==="online").length;
  piBox.innerHTML=`<div class="pikopf"><h2>Raspberry Pis</h2><span class="d">${on} von ${piDaten.pis.length} online</span><div class="grow"></div>
    <button class="knopf" data-a="alle">Alle updaten</button><button class="knopf" data-a="neu" title="Pi hinzufügen">＋ Pi</button></div>
    <div class="grid">${pis.map(piKarte).join("")}</div>`;
}
function piKarte(p){
  const s=p.status||{}, [txt,kl]=ZUST[s.zustand]||ZUST.unbekannt, kn=[];
  let mitte="", hinweis="";
  if(s.zustand==="online"){
    const r=s.ram, d=s.disk;
    mitte=`<div class="werte">
      <span>CPU</span><b>${s.cpu??"–"} %</b>
      <span>Temp.</span><b class="${s.temp>=70?"heiss":""}">${s.temp!=null?String(s.temp).replace(".",",")+" °C":"–"}</b>
      <span>RAM</span><b>${r?gb(r[0])+" / "+gb(r[1])+" GB":"–"}</b>
      <span>Speicher</span><b>${d?Math.round(100*d[0]/d[1])+" % belegt":"–"}</b>
      <span>Läuft seit</span><b>${dauer(s.uptime)}</b></div>`;
    if(p.job) hinweis=`<button class="hin lauf" data-a="log">${LAUF[s.job]||esc(s.job_titel||"Läuft")+" …"} ›</button>`;
    else if(!s.sudo) hinweis=`<div class="hin warn">Updates noch nicht freigegeben</div>`;
    else if(s.neustart) hinweis=`<div class="hin off">Neustart nötig</div>`;
    else if(s.updates) hinweis=`<button class="hin warn klick" data-a="liste" title="Liste anzeigen">${s.updates} Update${s.updates==1?"":"s"} verfügbar${s.sicherheit?` · ${s.sicherheit} Sicherheit`:""} ›</button>`;
    else hinweis=`<div class="hin ok">Alles aktuell</div>`;
    if(s.sudo && !p.job){
      kn.push(`<button class="knopf ${s.updates?"gruen":""}" data-a="update">Updaten</button>`);
      if(s.neustart) kn.push(`<button class="knopf rot" data-a="neustart">Neustart</button>`);
      if(s.docker) kn.push(`<button class="knopf" data-a="container" title="Docker-Container aktualisieren">Container</button>`);
      kn.push(`<button class="knopf" data-a="pruefen" title="Nach Updates suchen">Prüfen</button>`);
    }
    if(!s.sudo) kn.push(`<button class="knopf gruen" data-a="einst">Einrichten</button>`);
    kn.push(`<button class="knopf" data-a="terminal" title="Kommandozeile im Browser">Terminal</button>`);
    if(!p.job) kn.push(`<button class="knopf" data-a="befehle" title="Fertige und eigene Befehle">Befehle</button>`);
  } else if(s.zustand==="kein_zugang"){
    mitte=`<p class="leer">Pi ist erreichbar, aber der Schlüssel fehlt noch.</p>`;
    kn.push(`<button class="knopf gruen" data-a="einst">Einrichten</button>`);
  } else if(s.zustand==="ohne_ip"){
    mitte=`<p class="leer">Noch keine IP eingetragen.</p>`;
  } else if(s.zustand==="offline"){
    mitte=`<p class="leer">Nicht erreichbar${s.zuletzt?"<br>zuletzt gesehen "+new Date(s.zuletzt*1000).toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"}):""}</p>`;
  } else mitte=`<p class="leer">Wird abgefragt …</p>`;
  if(p.letzter_job) kn.push(`<button class="knopf" data-a="log" title="Protokoll">${p.job?"Live":"Protokoll"}</button>`);
  if(p.url) kn.push(`<a class="knopf" href="${esc(p.url)}" target="_blank" rel="noopener" title="Weboberfläche öffnen">↗</a>`);
  kn.push(`<button class="knopf" data-a="einst" title="Einstellungen">⚙</button>`);
  const modell=(s.modell||"").replace("Raspberry Pi","Pi").replace(/ Rev [\d.]+/,"").replace(/ Model /," ");
  return `<div class="pi" data-id="${esc(p.id)}">
    <div class="pizeile"><span class="t">${esc(p.name)}</span><span class="marke ${kl}">${txt}</span></div>
    <div class="d">${esc(p.host||"IP folgt")}${modell?" · "+esc(modell):""}</div>
    ${mitte}${hinweis}<div class="knoepfe">${kn.join("")}</div></div>`;
}

function oeffne(html){fensterEl.innerHTML=html; schicht.hidden=false;}
function schliesse(){
  schicht.hidden=true; fensterEl.innerHTML=""; fensterEl.onclick=null; fensterEl.classList.remove("gross");
  if(logTimer){clearInterval(logTimer); logTimer=null;}
  if(tSitzung){tSitzung.ende(); tSitzung=null;}
}
schicht.addEventListener("click",e=>{ if(e.target===schicht||e.target.closest("[data-zu]")) schliesse(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!schicht.hidden&&!tSitzung) schliesse(); });

async function piAktion(id,art){
  const r=await fetch(`${PIAPI}/pis/${encodeURIComponent(id)}/${art}`,{method:"POST"});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.job){alert(j.fehler||"Das hat nicht geklappt."); return;}
  piLaden(); return j.job;
}
function zeigeLog(jid,titel){
  if(logTimer){clearInterval(logTimer); logTimer=null;}
  oeffne(`<div class="fkopf"><b>${esc(titel)}</b><button class="knopf" data-zu>✕</button></div>
    <pre id="logtext"></pre><div class="d" id="logstand">läuft …</div>`);
  const pre=document.getElementById("logtext"); let ab=0;
  const hol=async()=>{
    try{
      const j=await (await fetch(`${PIAPI}/job/${jid}?ab=${ab}`,{cache:"no-store"})).json();
      if(j.fehler){document.getElementById("logstand").textContent=j.fehler; clearInterval(logTimer); logTimer=null; return;}
      const unten=pre.scrollTop+pre.clientHeight>=pre.scrollHeight-30;
      pre.textContent+=j.zeilen.map(z=>z+"\n").join(""); ab=j.anzahl;
      if(unten) pre.scrollTop=pre.scrollHeight;
      document.getElementById("logstand").textContent=j.fertig?(j.ok?"Fertig":"Mit Fehler beendet – siehe Protokoll"):"läuft …";
      if(j.fertig){clearInterval(logTimer); logTimer=null; piLaden();}
    }catch(e){}
  };
  hol(); logTimer=setInterval(hol,1000);
}
function zeigeListe(p){
  const pk=[...(p.status.pakete||[])].sort((a,b)=>(b.sicherheit-a.sicherheit)||a.name.localeCompare(b.name));
  const zeile=x=>`<div class="pz"><span><b style="font-weight:500">${esc(x.name)}</b>${x.sicherheit?'<span class="sich">Sicherheit</span>':""}${x.alt?"":'<span class="sich" style="background:#00ae4222;color:#19d36b">neu</span>'}</span>
    <span class="v">${x.alt?esc(x.alt)+" → ":""}${esc(x.neu)}</span></div>`;
  oeffne(`<div class="fkopf"><b>${esc(p.name)} – ${pk.length} Update${pk.length==1?"":"s"}${p.status.sicherheit?` · ${p.status.sicherheit} Sicherheit`:""}</b><button class="knopf" data-zu>✕</button></div>
    <input id="l_such" placeholder="Paket suchen …" style="margin-bottom:10px">
    <div class="pliste" id="l_liste">${pk.map(zeile).join("")}</div>
    <div class="knoepfe" style="justify-content:flex-end">${p.status.sudo&&!p.job?'<button class="knopf gruen" id="l_up">Jetzt updaten</button>':""}</div>`);
  document.getElementById("l_such").addEventListener("input",e=>{

  });

// Befehle: fertige (je nach erkannter App) und eigene
function zeigeBefehle(p){
  const apps=p.status.apps||[], eigene=[...(p.befehle||[])];
  const fertig=(piDaten.befehle||[]).filter(b=>!b.app||apps.includes(b.app));
  const zeile=(id,name,text,code,weg)=>`<div class="bz"><div><div style="font-weight:500">${esc(name)}</div>
    <div class="v">${code?`<code>${esc(text)}</code>`:esc(text)}</div></div>
    <button class="knopf" data-b="${esc(id)}">Ausführen</button>${weg!=null?`<button class="knopf" data-weg="${weg}" title="Entfernen">✕</button>`:""}</div>`;
  const zeichne=()=>{
    oeffne(`<div class="fkopf"><b>${esc(p.name)} – Befehle</b><button class="knopf" data-zu>✕</button></div>
      <div class="bkopf" style="margin-top:0">Erkannt auf diesem Pi</div>
      <div class="pliste">${fertig.map(b=>zeile(b.id,b.name,b.text,false,null)).join("")}</div>
      <div class="bkopf">Eigene Befehle</div>
      ${eigene.length?`<div class="pliste">${eigene.map((b,i)=>zeile("eigen-"+i,b.name||b.cmd,b.cmd,true,i)).join("")}</div>`:`<p class="d" style="margin:0 2px">Noch keine – unten anlegen. Läuft als Benutzer ${esc(p.user)}, mit <code>sudo</code> davor als root.</p>`}
      <div class="knoepfe" style="flex-wrap:nowrap"><input id="b_name" placeholder="Name" style="width:34%"><input id="b_cmd" placeholder="Befehl, z. B. sudo ncc files:scan --all" style="flex:1"><button class="knopf gruen" id="b_neu">＋</button></div>`);
    document.getElementById("b_neu").onclick=async()=>{
      const name=document.getElementById("b_name").value.trim(), cmd=document.getElementById("b_cmd").value.trim();
      if(!cmd){document.getElementById("b_cmd").focus(); return;}
      eigene.push({name,cmd}); await speichereBefehle(); zeichne();
    };
  };
  const speichereBefehle=async()=>{
    p.befehle=eigene;
    await fetch(PIAPI+"/pis",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id:p.id,name:p.name,host:p.host,user:p.user,url:p.url,befehle:eigene})});
  };
  fensterEl.onclick=async e=>{
    const w=e.target.closest("[data-weg]");
    if(w){ if(!confirm("Befehl entfernen?")) return; eigene.splice(+w.dataset.weg,1); await speichereBefehle(); return zeichne(); }
    const b=e.target.closest("[data-b]"); if(!b) return;
    const id=b.dataset.b, f=fertig.find(x=>x.id===id), name=f?f.name:(eigene[+id.slice(6)]?.name||eigene[+id.slice(6)]?.cmd);
    if((f?f.frage:true)&&!confirm(`„${name}“ auf ${p.name} ausführen?`)) return;
    const r=await fetch(`${PIAPI}/pis/${encodeURIComponent(p.id)}/befehl/${encodeURIComponent(id)}`,{method:"POST"});
    const j=await r.json().catch(()=>({}));
    if(!j.job) return alert(j.fehler||"Das hat nicht geklappt.");
    fensterEl.onclick=null; zeigeLog(j.job,`${p.name} – ${name}`); piLaden();
  };
  zeichne();
}

// Terminal im Browser (xterm.js) – wie Raspberry Pi Connect Lite, nur über das eigene Netz
const XTERM="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0", XFIT="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0";
function ladeSkript(src){return new Promise((ok,nein)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=nein;document.head.appendChild(s)})}
async function xtermLaden(){
  if(window.Terminal&&window.FitAddon) return;
  const l=document.createElement("link"); l.rel="stylesheet"; l.href=XTERM+"/css/xterm.css"; document.head.appendChild(l);
  await ladeSkript(XTERM+"/lib/xterm.js"); await ladeSkript(XFIT+"/lib/addon-fit.js");
}
const TASTEN={"Esc":"\x1b","Tab":"\t","↑":"\x1b[A","↓":"\x1b[B","←":"\x1b[D","→":"\x1b[C","|":"|","~":"~","/":"/"};
async function zeigeTerminal(p){
  oeffne(`<div class="fkopf"><b>${esc(p.name)} – Terminal</b><span class="marke" id="t_st">verbinde …</span><span class="grow"></span>
    <button class="knopf" id="t_neu">Neu verbinden</button><button class="knopf" data-zu>✕</button></div>
    <div class="tbox" id="t_box"></div>
    <div class="knoepfe tasten"><button class="knopf" data-k="Strg">Strg</button>${Object.keys(TASTEN).map(k=>`<button class="knopf" data-k="${k}">${k}</button>`).join("")}</div>`);
  fensterEl.classList.add("gross");
  const st=document.getElementById("t_st");
  try{await xtermLaden()}catch(e){st.textContent="xterm.js nicht ladbar"; st.className="marke off"; return;}
  if(schicht.hidden) return;
  const term=new Terminal({fontSize:13,fontFamily:"ui-monospace,Menlo,Consolas,monospace",cursorBlink:true,scrollback:5000,
    theme:{background:"#16161a",foreground:"#e8e8ea",cursor:"#19d36b",selectionBackground:"#00ae4255",green:"#19d36b",brightGreen:"#3ee88a"}});
  const fit=new FitAddon.FitAddon(); term.loadAddon(fit); term.open(document.getElementById("t_box"));
  let ws=null, strg=false;
  const strgKnopf=fensterEl.querySelector('[data-k="Strg"]');
  const senden=d=>{ if(ws&&ws.readyState===1) ws.send("0"+d) };
  const groesse=()=>{ try{fit.fit()}catch(e){} if(ws&&ws.readyState===1) ws.send("1"+JSON.stringify({c:term.cols,r:term.rows})) };
  term.onData(d=>{
    if(strg&&d.length===1){const c=d.toUpperCase().charCodeAt(0); if(c>=64&&c<=95) d=String.fromCharCode(c-64); strg=false; strgKnopf.classList.remove("an");}
    senden(d);
  });
  function verbinde(){
    if(ws){ws.onclose=null; ws.close();}
    st.textContent="verbinde …"; st.className="marke";
    ws=new WebSocket(`${location.protocol==="https:"?"wss":"ws"}://${location.host}${PIAPI}/terminal/${encodeURIComponent(p.id)}`);
    ws.binaryType="arraybuffer";
    ws.onopen=()=>{st.textContent="verbunden"; st.className="marke on"; groesse(); term.focus();};
    ws.onmessage=e=>term.write(typeof e.data==="string"?e.data:new Uint8Array(e.data));
    ws.onclose=()=>{st.textContent="getrennt"; st.className="marke off";
      term.write("\r\n\x1b[90m[Verbindung beendet – „Neu verbinden“ drücken]\x1b[0m\r\n");};
  }
  const beobachter=new ResizeObserver(()=>groesse()); beobachter.observe(document.getElementById("t_box"));
  document.getElementById("t_neu").onclick=()=>{term.reset(); verbinde();};
  fensterEl.querySelector(".tasten").addEventListener("click",e=>{
    const k=e.target.closest("[data-k]")?.dataset.k; if(!k) return;
    if(k==="Strg"){strg=!strg; strgKnopf.classList.toggle("an",strg);} else senden(TASTEN[k]);
    term.focus();
  });
  tSitzung={ende(){ beobachter.disconnect(); if(ws){ws.onclose=null; ws.close();} term.dispose(); }};
  setTimeout(()=>{groesse(); verbinde();},50);
}
function einrichtBefehl(){
  const k=piSchluessel;
  return `mkdir -p ~/.ssh && chmod 700 ~/.ssh && (grep -qF '${k}' ~/.ssh/authorized_keys 2>/dev/null || echo '${k}' >> ~/.ssh/authorized_keys) && chmod 600 ~/.ssh/authorized_keys && echo "$(whoami) ALL=(root) NOPASSWD:SETENV: /usr/bin/apt-get, /usr/bin/systemctl reboot, /usr/bin/docker" > /tmp/piwerk.sudo && sudo visudo -cf /tmp/piwerk.sudo && sudo install -m 440 -o root -g root /tmp/piwerk.sudo /etc/sudoers.d/piwerk && rm /tmp/piwerk.sudo && echo "Piwerk eingerichtet"`;
}
async function zeigeEinst(p){
  if(!piSchluessel){try{piSchluessel=(await (await fetch(PIAPI+"/schluessel")).json()).schluessel}catch(e){}}
  const n=p||{name:"",host:"",user:"pi",url:""};

  ssh(); ["f_user","f_host"].forEach(i=>document.getElementById(i).addEventListener("input",ssh));
  document.getElementById("f_kopie").onclick=async e=>{

piBox.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]"); if(!b) return;
  const a=b.dataset.a, id=b.closest(".pi")?.dataset.id, p=piDaten?.pis.find(x=>x.id===id);
  if(a==="neu") return zeigeEinst(null);
  if(a==="alle"){
    const bereit=piDaten.pis.filter(x=>x.status.zustand==="online"&&x.status.sudo&&!x.job);
    if(!bereit.length) return alert("Kein Pi ist gerade bereit für ein Update.");
    if(!confirm(`${bereit.map(x=>x.name).join(", ")} jetzt updaten?`)) return;
    await fetch(PIAPI+"/alle",{method:"POST"}); return piLaden();
  }
  if(!p) return;
  if(a==="einst") return zeigeEinst(p);
  if(a==="liste") return zeigeListe(p);
  if(a==="terminal") return zeigeTerminal(p);
  if(a==="befehle") return zeigeBefehle(p);
  if(a==="log") return zeigeLog(p.letzter_job,`${p.name} – Protokoll`);
  if(a==="neustart"&&!confirm(`${p.name} jetzt neu starten?`)) return;
  if(a==="container"&&!confirm(`Alle Docker-Container auf ${p.name} aktualisieren?`)) return;
  const jid=await piAktion(id,a);
  if(jid&&a!=="neustart") zeigeLog(jid,`${p.name} – ${{update:"Update",container:"Container",pruefen:"Prüfen"}[a]}`);
});
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) piLaden(); });
setInterval(()=>{ if(!document.hidden && schicht.hidden) piLaden(); },10000);

zeichne();
piLaden();
</script>
