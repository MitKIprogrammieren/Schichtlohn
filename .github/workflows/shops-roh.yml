name: Shopdaten roh holen

# Zum Prüfen: holt die Produktlisten und Logos der Herstellershops und legt sie im Zweig „shopdaten“ ab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/shops_roh.py tools/shops.json /tmp/roh
      - run: python3 tools/logos_holen.py tools/logo_quellen.json /tmp/roh/logos
      - name: In den Zweig shopdaten legen
        run: |
          cd /tmp/roh
          git init -q -b shopdaten
          git config user.name "MitKIprogrammieren"
          git config user.email "MitKIprogrammieren@users.noreply.github.com"
          git add -A
          git commit -q -m "Shopdaten roh $(date +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shopdaten
