name: Preise der Shops aktualisieren

# Holt jeden Morgen die Produktlisten der Herstellershops und 3DJake und baut preise.json (für die Preisliste in SchichtLohn).
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shops holen
        run: python3 tools/shops_roh.py tools/shops.json /tmp/roh
      - name: 3DJake auffrischen (Preise, neue Farben)
        run: python3 tools/jake.py tools/haendler/3djake.jsonl 2500
        timeout-minutes: 90
        continue-on-error: true
      - name: Vereinheitlichen und preise.json bauen
        run: |
          python3 tools/shops.py /tmp/roh /tmp/norm
          python3 tools/preise_bauen.py /tmp/norm preise.json
      - name: Speichern, falls sich Preise geändert haben
        run: |
          python3 - <<'PY'
          import json,subprocess
          neu=json.load(open("preise.json"))
          try:
              alt=json.loads(subprocess.run(["git","show","HEAD:preise.json"],capture_output=True,text=True,check=True).stdout)
          except Exception:
              alt={}
          open("/tmp/gleich","w").write("1" if neu.get("z")==alt.get("z") else "0")
          PY
          git config user.name "MitKIprogrammieren"
          git config user.email "MitKIprogrammieren@users.noreply.github.com"
          if [ "$(cat /tmp/gleich)" = "1" ]; then git checkout -- preise.json tools/haendler/3djake.jsonl; echo "Keine Preisänderung"; else git add preise.json tools/haendler/3djake.jsonl; fi
          # Wann zuletzt geprüft wurde – kleine eigene Datei, damit preise.json (1 MB) nicht jeden Tag neu gespeichert wird
          python3 -c "import json,time;s=json.load(open('preise.json')).get('stand');json.dump({'geprueft':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'stand':s},open('preise-stand.json','w'))"
          git add preise-stand.json
          git commit -m "$( [ "$(cat /tmp/gleich)" = "1" ] && echo 'Shoppreise geprüft (keine Änderung)' || echo 'Shoppreise aktualisiert' )"
          for i in 1 2 3; do git pull -q --rebase && git push && break; sleep 5; done
          for f in preise.json preise-stand.json; do curl -s "https://purge.jsdelivr.net/gh/MitKIprogrammieren/Schichtlohn@main/$f" | head -c 200 || true; done
