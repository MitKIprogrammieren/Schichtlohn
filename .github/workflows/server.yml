name: SchichtLohn-Server (Container)

# Baut den SchichtLohn-Server für die Synology (x86 und ARM) und legt ihn unter
# ghcr.io/mitkiprogrammieren/schichtlohn-server ab.
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mitkiprogrammieren/schichtlohn-server:latest
          labels: |
            org.opencontainers.image.source=https://github.com/MitKIprogrammieren/Schichtlohn
            org.opencontainers.image.description=SchichtLohn-Server: Lager-Datenbank und Etikett-Leser
            org.opencontainers.image.licenses=MIT
