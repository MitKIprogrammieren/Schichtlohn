name: SchichtLohn-Server (Container)

# Baut den SchichtLohn-Server für die Synology (x86 und ARM) und legt ihn unter
# ghcr.io/mitkiprogrammieren/schichtlohn-server ab.
on:
  push:
    branches: [main]
    paths: ["server/**", "schichtlohn/config.yaml", ".github/workflows/server.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version aus app.py
        id: v
        run: |
          v=$(grep -oP '^VERSION = "\K[^"]+' server/app.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          grep -q "version: \"$v\"" schichtlohn/config.yaml || { echo "::error::schichtlohn/config.yaml hat nicht Version $v"; exit 1; }
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mitkiprogrammieren/schichtlohn-server:latest
            ghcr.io/mitkiprogrammieren/schichtlohn-server:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/MitKIprogrammieren/Schichtlohn
            org.opencontainers.image.description=SchichtLohn-Server: Lager-Datenbank und Etikett-Leser
            org.opencontainers.image.licenses=MIT
            io.hass.name=SchichtLohn-Server
            io.hass.type=addon
            io.hass.version=${{ steps.v.outputs.version }}
