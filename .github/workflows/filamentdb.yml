name: Filament-Datenbank aktualisieren

# Holt jede Woche die Open Filament Database und SpoolmanDB und baut filamentdb.json neu.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quellen holen
        run: |
          git clone -q --depth 1 https://github.com/OpenFilamentCollective/open-filament-database.git /tmp/ofd
          git clone -q --depth 1 https://github.com/Donkie/SpoolmanDB.git /tmp/sdb
      - name: filamentdb.json bauen
        run: python3 tools/filamentdb.py /tmp/ofd /tmp/sdb filamentdb.json
      - name: Speichern, falls sich etwas geändert hat
        run: |
          python3 - <<'PY'
          import json,subprocess
          neu=json.load(open("filamentdb.json"))
          try:
              alt=json.loads(subprocess.run(["git","show","HEAD:filamentdb.json"],capture_output=True,text=True,check=True).stdout)
          except Exception:
              alt={}
          gleich=all(neu.get(k)==alt.get(k) for k in ("b","l","c","g"))
          open("/tmp/gleich","w").write("1" if gleich else "0")
          PY
          if [ "$(cat /tmp/gleich)" = "1" ]; then git checkout -- filamentdb.json; echo "Keine Änderung"; exit 0; fi
          git config user.name "MitKIprogrammieren"
          git config user.email "MitKIprogrammieren@users.noreply.github.com"
          git add filamentdb.json
          git commit -m "Filament-Datenbank aktualisiert"
          for i in 1 2 3; do git pull -q --rebase && git push && break; sleep 5; done
          curl -s "https://purge.jsdelivr.net/gh/MitKIprogrammieren/Schichtlohn@main/filamentdb.json" | head -c 200 || true
