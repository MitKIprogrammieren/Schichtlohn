name: Farbige Herstellerlogos holen

# Holt die Logos von den Herstellerseiten (nur wo robots.txt es erlaubt) und legt sie als Download (Artefakt) ab.
on:
  workflow_dispatch:

jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Logos holen
        run: python3 tools/logos_holen.py tools/logo_quellen.json /tmp/logos
      - uses: actions/upload-artifact@v4
        with:
          name: logos
          path: /tmp/logos
          retention-days: 3
