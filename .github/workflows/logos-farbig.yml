name: Farbige Herstellerlogos holen

# Holt die Logos von den Herstellerseiten (nur wo robots.txt es erlaubt) und legt sie als Download (Artefakt) ab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Logos holen
        run: python3 tools/logos_holen.py tools/logo_quellen.json /tmp/logos
      - name: In den Zweig logos-farbig legen
        run: |
          git config user.name "MitKIprogrammieren"
          git config user.email "MitKIprogrammieren@users.noreply.github.com"
          git checkout --orphan logos-farbig
          git rm -rfq .
          cp -r /tmp/logos/. .
          git add -A
          git commit -qm "Farbige Herstellerlogos (Rohdaten)"
          git push -f origin logos-farbig
